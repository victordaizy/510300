  exit_open_gap_lower_bound: -0.095
  blocked_exit_policy: "CARRY_UNTIL_FIRST_ELIGIBLE_OPEN"
  terminal_open_positions_policy: "FAIL_NO_FORCED_OR_FICTITIOUS_EXIT"
  stop_new_entries_if_scheduled_exit_after_partition_end: true
  missing_position_mark_policy: "LAST_OBSERVED_TOTAL_RETURN_CLOSE_WITH_STALE_FLAG"

costs:

  first_executable_time: "NEXT_CHINA_BENCHMARK_TRADING_DAY_OPEN"
  foreign_index_asof_rule: "FOREIGN_MARKET_DATE_STRICTLY_BEFORE_CHINA_SIGNAL_DATE"
  fx_asof_rule: "CENTRAL_PARITY_DATE_NOT_AFTER_CHINA_SIGNAL_DATE"
  maximum_foreign_age_calendar_days: 7
  maximum_fx_age_calendar_days: 7
  same_open_price_used_for_signal_and_execution: false
  future_return_used_in_signal: false

universe:
  master_statuses: ["L", "D", "I"]
  minimum_observed_history_days: 252
  minimum_raw_price_cny: 0.5
  amount_lookback_trading_days: 20
  minimum_prior_median_amount_20_cny: 100000000.0
  minimum_signal_amount_to_prior_median_ratio: 0.5
  maximum_order_fraction_of_prior_median_amount: 0.01
  require_point_in_time_list_and_delist_dates: true
  require_observed_non_suspended_signal_bar: true
  require_observed_non_suspended_entry_bar: true

signal:
  family: "CROSS_MARKET_SYNTHETIC_FAIR_VALUE_DISCOUNT_REVERSION"
  relative_log_price_definition: "LOG_ETF_TOTAL_RETURN_CLOSE_MINUS_LOG_FOREIGN_INDEX_CLOSE_MINUS_LOG_FX_CNY_PER_FOREIGN_CURRENCY"
  rolling_equilibrium_lookback_trading_days: 120
  rolling_center: "MEDIAN_EXCLUDING_SIGNAL_DAY"
  rolling_scale: "1.4826_X_MAD_EXCLUDING_SIGNAL_DAY"
  minimum_scale: 0.005
  maximum_entry_zscore: -2.0
  maximum_entry_log_deviation: -0.01
  fixed_holding_period_trading_days_open_to_open: 5
  prefreeze_signal_coverage_only_no_future_return_used: true

prefreeze_coverage_gate:
  minimum_executable_signal_rows: 30
  minimum_signal_years: 3
  minimum_tracking_groups_with_signals: 2

portfolio:
  maximum_positions_per_cycle: 2
  enter_only_when_flat: true
  equal_weight_selected_positions: true
  maximum_one_etf_per_tracking_group: true
  board_lot_shares: 100
  minimum_trade_notional_cny: 5000.0
  diversification_correlation_lookback_trading_days: 60
  diversification_minimum_pair_observations: 50
  maximum_pairwise_correlation: 0.90
  entry_open_gap_lower_bound: -0.095

frozen_candidate_definition:
  dependent_variable: "log(PB_i_t)"
  pb_formula: "raw_close / book_value_per_share"
  book_value_per_share_rule: "经reported_bps与归母权益/总股本交叉校验后的正值"
  industry_effect: "CITIC_L1_POINT_IN_TIME_SECTOR_FIXED_EFFECT"
  roe_variable: "TTM归母净利润/最新已知正归母权益"
  growth_variable: "TTM营业收入同比"
  growth_choice_reason: "避免上年亏损导致利润同比无定义或符号翻转"
  future_model_formula: "log(PB_i_t)=a_sector_t+b1_t*clip(ROE_i_t,-0.5,0.8)+b2_t*clip(RevenueGrowth_i_t,-1,1)+epsilon_i_t"
  future_company_cheapness: "-epsilon_i_t"
  future_index_aggregation: "对完整样本按当期官方权重重新归一化后加权"
  fitting_enabled_in_this_stage: false
  residual_calculation_enabled_in_this_stage: false
  alternative_variant_enabled: false
  parameter_search_enabled: false

point_in_time_rules:
  financial_vintage: "每个报告期仅取available_at不晚于快照日的最新已知版本"
  price: "快照日未复权收盘价；专用历史快照优先于当前成分日线"
  industry_interval: "in_date <= snapshot_date < out_date；out_date为空表示持续有效"
  industry_overlap_resolution: "同公司新一级行业生效时截断旧行业区间；同日起多行业硬失败"
  current_snapshot_backfill_allowed: false
  future_revision_allowed: false


  version: 2.0.0
  frozen_date: '2026-09-04'
  timezone: Asia/Shanghai
  state: PRE_FORWARD_ONLY_FREEZE
  research_mode: STRICT_FORWARD_ONLY
  not_before_trade_date: '2026-09-07'
  forward_start_rule: FIRST_SSE_TRADING_DAY_ON_OR_AFTER_2026_09_07_AFTER_G0_ALL_PASS
  historical_backfill_allowed: false
  historical_tradable_backtest_allowed: false
  pre_g0_signal_collection_allowed: false
  pre_g1_model_estimation_allowed: false
  pre_g2_prediction_allowed: false
  current_validated_high_sharpe_strategy: NONE
  current_position_target: UNSET
  position_impact: 0
  live_trading_authorized: false
  broker_connection_authorized: false

scope:
  tradable_universe:
    - 510300.SH
    - CASH_CNY
  signal_instrument: SGX_FTSE_CHINA_A50_INDEX_FUTURES_OBSERVATION_ONLY
  signal_instrument_position: 0
  shorting_allowed: false
  leverage_allowed: false
  old_post_close_v1_mutation_allowed: false
  archived_stress_hazard_rescue_allowed: false

storage:
  logical_data_root: data
  required_link_type: Junction
  approved_resolved_data_root: 'E:\ResearchData\New project 8\data'
  external_root_must_match_exactly: true

clock:
  timezone: Asia/Shanghai
  health_check_at: '14:55:00'
  contract_volume_asof_window: ['14:54:57', '14:55:00']
  contract_freeze_window: ['14:55:00', '14:55:05']
  a50_start_window: ['15:00:05', '15:00:15']
  a50_end_window: ['15:03:20', '15:03:30']
  signal_calculation_deadline: '15:03:35'
  research_intent_at: '15:03:45'
  future_broker_ack_deadline: '15:04:15'
  after_hours_matching_window: ['15:05:00', '15:30:00']
  target_window_next_sse_day: ['09:35:00', '09:35:30']
  prequeue_and_cancel_allowed: false

signal_data:
  primary_source_requires_verified_realtime_entitlement: true
  exchange_timestamp_required: true
  received_at_required: true
  raw_payload_sha256_required: true
  maximum_market_data_latency_seconds: 3.0
  maximum_absolute_ntp_offset_milliseconds: 100.0
  contract_candidate_set: TWO_NEAREST_UNEXPIRED_LISTED_CONTRACT_MONTHS
  contract_selection_rule: HIGHEST_CUMULATIVE_VOLUME_0900_TO_1455
  continuous_contract_allowed: false
  contract_switch_after_freeze_allowed: false
  no_view_on_missing_volume_tie_or_identity_uncertainty: true
  price_hierarchy:
    - MEDIAN_FRESH_BID_ASK_MIDPOINT
    - MEDIAN_OF_AT_LEAST_3_ELIGIBLE_TRADES
  minimum_trade_count_fallback: 3
  formula: LOG_F1_DIV_F0
  unknown_delay_web_quote_allowed: false
  required_daily_states:
    sse_rule_state: VERIFIED_CURRENT
    sgx_session_state: VERIFIED_CONTINUOUS_TRADING
    etf_state: NORMAL_TRADING
    company_action_state: VERIFIED_NONE_OR_TOTAL_RETURN_ADJUSTED

target:
  primary: LOG_NEXT_0935_MID_DIV_SAME_DAY_OFFICIAL_CLOSE
  executable_buy_side: LOG_NEXT_0935_BID_VWAP_DIV_SAME_DAY_OFFICIAL_CLOSE
  executable_sell_side: LOG_SAME_DAY_OFFICIAL_CLOSE_DIV_NEXT_0935_ASK_VWAP
  depth_state_required: VERIFIED_FOR_FROZEN_QUANTITY
  company_action_unproven_state: NO_VIEW_COMPANY_ACTION_OR_TOTAL_RETURN_UNPROVEN

model:
  regression: OLS_WITH_INTERCEPT
  covariance: NEWEY_WEST_BARTLETT
  hac_lag_rule: FLOOR_4_TIMES_N_OVER_100_POWER_2_OVER_9
  monthly_update_rule: FIRST_SSE_TRADING_DAY_USING_ONLY_PRIOR_MONTH_END_MATURE_DATA
  current_day_excluded: true
  immature_target_excluded: true
  parameter_search_allowed: false
  feature_search_allowed: false
  coefficient_sign_flip_allowed: false
  conditional_interval_one_sided_confidence: 0.975
  conditional_interval_critical_value: 1.959963984540054
  beta_gate_one_sided_confidence: 0.95
  gate_minimum_mature_days:
    g1: 60
    g2: 120
    g3: 180

costs:
  account_reference_cny: 200000.0
  commission_rate_per_leg: 0.0002
  minimum_commission_cny_per_leg: 5.0
  base_slippage_bps_per_leg: 5.0
  stress_slippage_bps_per_leg: 10.0
  minimum_economic_overlay_notional_cny: 25000.0
  base_round_trip_bps_at_minimum_notional: 14.0
  stress_round_trip_bps_at_minimum_notional: 24.0

signal_gates:
  research_tier_bps: 42.0
  execution_tier_bps: 72.0
  research_tier_position_impact: 0
  execution_tier_requires_separate_authorization: true

sequential_gates:
  g0:
    required_checks:
      - SSE_AFTER_HOURS_RULE_CURRENT
      - SGX_A50_SESSION_SPEC_CURRENT
      - BROKER_SUPPORTS_CLOSING_PRICE_ORDER_FOR_510300
      - BROKER_ACCEPTS_BEFORE_1505
      - BROKER_ACK_AND_PARTIAL_FILL_TIMESTAMPS_AVAILABLE
      - ACCOUNT_CASH_SWEEP_CONFLICT_ABSENT_OR_DISABLED
      - A50_PRIMARY_FEED_REALTIME_ENTITLEMENT_PROVEN
      - A50_EXCHANGE_TIMESTAMP_AVAILABLE
      - LOCAL_CLOCK_SYNC_PASS
      - CODE_AND_MANIFEST_FROZEN_COMMIT_PRESENT
    pass_state: PASS_G0_FORWARD_COLLECTION_ADMITTED
    fail_state: BLOCKED_G0_NO_FORWARD_SIGNAL_COLLECTION
  g1:
    minimum_mature_days: 60
    minimum_coverage: 0.90
    beta_point_estimate_positive: true
    action_authorized: false
  g2:
    minimum_mature_days: 120
    beta_lcb_positive: true
    first_and_second_60_beta_positive: true
    prequential_oos_mse_improvement_positive: true
    minimum_research_signal_clusters: 5
  g3:
    minimum_mature_days: 180
    replication_oos_improvement_positive: true
    latest_60_beta_positive: true
    minimum_research_signal_clusters: 8
    cluster_bootstrap_net_edge_lcb_positive: true
    maximum_single_cluster_profit_share: 0.25
  g4:
    requires_separate_live_authorization: true
    functionality_test_shares: 100
    functionality_test_excluded_from_economic_sample: true
    economic_order_notional_cny: 25000.0
    minimum_submitted_events: 20
    minimum_initial_actual_fills: 10
    minimum_formal_actual_fills: 20
  g5:
    minimum_forward_days: 252
    minimum_actual_fills: 20
    minimum_net_sharpe: 1.20
    minimum_net_cagr: 0.04
    maximum_drawdown: 0.08
  g6:
    minimum_forward_days: 504
    minimum_actual_fills: 40
    separate_capacity_freeze_required: true

future_position_mapping:
  enabled_now: false
  pilot:
    prerequisite: G0_TO_G3_PASS_AND_SEPARATE_G4_AUTHORIZATION
    base_inventory_cny: 50000.0
    base_lots: 2
    base_lot_cny: 25000.0
    overlay_cny: 25000.0
    target_cny: [25000.0, 50000.0, 75000.0]
  full_scale_candidate:
    prerequisite: G4_PASS_AND_SEPARATE_CAPACITY_FREEZE
    base_inventory_cny: 100000.0
    base_lots: 2
    base_lot_cny: 50000.0
    overlay_cny: 50000.0
    target_cny: [50000.0, 100000.0, 150000.0]

hard_stops:
  - TWO_CONSECUTIVE_MONTHLY_BETA_LCB_NONPOSITIVE
  - LATEST_60_DAY_BETA_NONPOSITIVE
  - LAST_10_VALID_SIGNALS_ALL_UNFILLED
  - FILL_RATE_DOWN_AT_LEAST_50_PERCENT
  - ACTUAL_FILL_20_CAPACITY_ADJUSTED_NET_EDGE_LCB_NONPOSITIVE
  - WRONG_SIGNAL_LOSS_EXCEEDS_CORRECT_SIGNAL_PROFIT
  - DATA_RIGHTS_LATENCY_OR_CONTRACT_IDENTITY_UNPROVEN
  - BROKER_ACK_AFTER_DEADLINE
  - EXCHANGE_RULE_CHANGED
  - CASH_T1_INVENTORY_OR_COMPANY_ACTION_STATE_UNPROVEN

forbidden_rescue:
  - CHANGE_OBSERVATION_WINDOW
  - LOWER_42_OR_72_BPS_GATE
  - CHANGE_NEXT_0935_EXIT
  - ADD_MACRO_TECHNICAL_NEWS_OR_VALUATION_FILTER
  - DROP_UNFILLED_SIGNALS
  - REVERSE_SIGNAL_DIRECTION
  - SELECT_ONLY_PASSING_SIDE_AFTER_RESULTS
  - BACKFILL_MISSED_FORWARD_DAY

boundaries:
  model_trained_now: false
  signal_generated_now: false
  position_mapping_enabled: false
  paper_or_shadow_position_enabled: false
  executable_order_generation_enabled: false
  broker_connection_enabled: false
  actual_fill_assumption_enabled: false
  live_trading_enabled: false


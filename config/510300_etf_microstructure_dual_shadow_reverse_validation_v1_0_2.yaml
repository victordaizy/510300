acquisition:
  fund_share:
    source: 上海证券交易所commonQuery.do
    sql_id: COMMON_SSE_ZQPZ_ETFZL_ETFJBXX_JJGM_SEARCH_L
    method: 每个510300交易日按SEC_CODE与STAT_DATE请求唯一记录
    unit_conversion: TOT_VOL万份乘10000得到份
  margin:
    source: 上海证券交易所queryMargin.do
    method: 按beginDate和endDate分页请求510300全部记录
    derived_rqye: rqyl乘同日510300收盘价
    derived_rzrqye: rzye加derived_rqye
  nav:
    primary: 东方财富f10.lsjz
    secondary: 新浪CaihuiFundInfoService.getNav
    maximum_unit_nav_absolute_difference: 0.00005
    sina_pagination_boundary_policy: 只删除日期及整行内容完全相同的重复记录，去重后唯一日期数必须等于total，否则失败
    accumulated_nav_policy: 全部510300信号交易日差异不得超过0.00005；非交易日异常仅登记且不进入候选输入
  raw_response_policy: 每个响应正文保存为只新增文件并记录SHA256；V1.0.2可哈希不变地复制V1.0.1失败任务的响应，恢复执行只能复用已验证文件，禁止覆盖
  calendar_policy: 以510300交易日为唯一信号日历，三类信号源必须逐日完整且唯一
  non_trading_source_rows: 仅审计，不进入规则或评价


factor:
  name: GammaOIPressure
  epsilon: 1.0e-12
  formula: >-
    -((high-low)/(turnover_cny+epsilon))
    *tanh((open_interest-lag1_open_interest)/(volume+1))
    *tanh(delta)
    *log(1+underlying_close^2*abs(gamma))
    /(sqrt(1+abs(theta))*sqrt(1+dte_years))
  direction: 每个信号日选择因子值最高的合约
  lag_rule: lag1_open_interest必须是同一合约在上一基准交易日的值
  missing_policy: 任一输入缺失则该合约当日无信号

schedule:
  signal_time: t日收盘后
  entry_time: t+1交易日
  exit_time: t+2交易日
  holding_trading_days: 1
  overlap_allowed: false
  next_signal_may_use_exit_day_close: true

contract_selection:

  contract_unit_required: 10000
  minimum_calendar_days_to_expiry: 5
  maximum_calendar_days_to_expiry: 60
  minimum_moneyness: 0.80
  maximum_moneyness: 1.20
  minimum_signal_day_volume: 100
  minimum_signal_day_open_interest: 100
  minimum_signal_premium_per_contract_cny: 500
  maximum_signal_premium_per_contract_cny: 10000
  target_signal_notional_cny: 7000
  maximum_contracts: 10
  tie_break:
    - factor_descending
    - volume_descending
    - contract_code_ascending

execution_envelope:
  entry_price: 次一交易日该合约日内最高成交价
  exit_price: 再下一交易日该合约日内最低成交价
  missing_entry_trade: 不成交并持有现金
  missing_exit_trade: 退出价值按零计
  option_fee_cny_per_contract_per_leg: 5.0
  initial_cash_cny: 20000
  minimum_opening_trade_notional_cny: 5000
  insufficient_cash: 订单拒绝并持有现金

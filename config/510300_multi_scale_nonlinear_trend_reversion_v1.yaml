protocol:
  project_id: 510300_MULTI_SCALE_NONLINEAR_TREND_REVERSION_V1
  candidate_model_id: 510300_MULTI_SCALE_NONLINEAR_TREND_REVERSION_V1
  state: PROTOCOL_DRAFT_BEFORE_FIRST_2015_PLUS_CANDIDATE_OUTCOME
  registration_date: '2026-08-31'
  timezone: Asia/Shanghai
  evidence_class: RETROSPECTIVE_PUBLISHED_COEFFICIENT_TRANSFER_ONE_SHOT
  purpose: 检验多尺度弱趋势延续、极端趋势反转是否能迁移到沪深300并在只交易510300与现金时形成净费后证据
  one_shot: true
  parameter_rescue_after_result: forbidden
  alternate_scale_rescue_after_result: forbidden
  alternate_weight_rescue_after_result: forbidden
  coefficient_refit_rescue_after_result: forbidden
  direction_reversal_after_result: forbidden
  combination_rescue_after_result: forbidden
  sharpe_target_is_acceptance_gate_not_optimization_objective: true

literature:
  primary_paper:
    title: Trends and Reversion in Financial Markets on Time Scales from Minutes to Decades
    authors: [Sara A. Safari, Christof Schmidhuber]
    arxiv_id: '2501.16772v1'
    publication_date: '2025-01-28'
    url: https://arxiv.org/html/2501.16772v1
    daily_source_sample: 1990_TO_2020_GLOBAL_FUTURES
    direct_equation: R_next_equals_a_plus_b_phi_plus_c_phi_cubed
    reported_daily_intercept: 0.0133
    reported_daily_linear_coefficient: 0.0129
    reported_daily_cubic_coefficient: -0.0062
    reported_daily_linear_t_stat: 3.0
    reported_daily_cubic_absolute_t_stat: 2.7
  transfer_limits:
    source_is_not_510300: true
    paper_coefficients_are_mechanism_prior_not_performance_claim: true
    paper_contains_no_510300_costed_long_cash_backtest: true
    overlapping_literature_period: 2015_TO_2020
    temporal_holdout_period: 2021_TO_2026

scope:
  execution_asset: 510300.SH
  allowed_holdings: [510300.SH, CASH_CNY]
  signal_asset: 000300.SH_PRICE_INDEX
  long_only: true
  leverage_allowed: false
  short_selling_allowed: false
  derivatives_execution_allowed: false
  live_trading_authorized: false

dates:
  signal_history_start: '2005-04-08'
  training_normalization_end: '2014-12-31'
  evaluation_start: '2015-01-05'
  evaluation_end: '2026-08-14'
  structural_periods:
    EARLY_LITERATURE_OVERLAP:
      start: '2015-01-05'
      end: '2020-12-31'
    LATE_TEMPORAL_HOLDOUT:
      start: '2021-01-04'
      end: '2026-08-14'

inputs:
  index_price:
    path: data/raw/market/000300_price_index_return_dispersion_v1.parquet
    required_columns: [date, close]
  index_input_audit:
    path: reports/data_quality/510300_csi300_return_dispersion_volatility_inputs_v1.json
    required_status: PASS
  etf_daily:
    path: data/raw/market/510300_daily_downside_risk_v1.parquet
    required_columns: [date, open, high, low, close]
  etf_input_audit:
    path: reports/data_quality/510300_downside_risk_inputs_v1.json
    required_status: PASS
  dividends:
    path: data/reference/510300_dividends.csv
    required_columns: [record_date, ex_date, payment_date, cash_dividend_per_share]
  benchmark_total_return:
    path: data/raw/r6/H00300_total_return_daily.parquet
    required_columns: [date, close]
  candidate_input_audit:
    path: reports/data_quality/510300_multi_scale_nonlinear_trend_reversion_v1_inputs.json
    required_status: PASS_PRE_FREEZE_DATA_AND_NORMALIZATION_CONTRACT
  backtest_engine:
    path: backtest/engine.py

data_contract:
  index_expected_rows: 5189
  index_expected_first_date: '2005-04-08'
  index_expected_last_date: '2026-08-14'
  index_expected_evaluation_rows: 2823
  index_rows_before_evaluation: 2366
  etf_expected_rows: 3456
  etf_expected_first_date: '2012-05-28'
  etf_expected_last_date: '2026-08-14'
  evaluation_market_dates_must_match_index: true
  missing_signal_action: NO_VIEW_AND_HOLD_PREVIOUS_RESEARCH_TARGET

normalization:
  method: FIXED_PRE_2015_TRAINING_SAMPLE_MEAN_AND_SAMPLE_STANDARD_DEVIATION
  training_log_return_count: 2365
  training_log_return_mean: 0.0005323077446158067
  training_log_return_sample_std: 0.018153464702916094
  normalized_return_clip_absolute: 20.0
  evaluation_values_used_to_estimate_normalization: false

trend:
  horizons_trading_days: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
  lag_multiplier: 2.25
  maximum_horizon_lag_count: 2304
  minimum_squared_weight_energy_capture: 0.99
  weight_formula: n_times_exp_minus_2n_over_T
  weights_l2_normalized: true
  current_day_return_weight: 0.0
  trend_clip_lower: -2.5
  trend_clip_upper: 2.5
  aggregation: EQUAL_WEIGHT_MEAN_OF_TEN_CLIPPED_TREND_STRENGTHS
  score_intercept_used: false
  fixed_linear_coefficient: 0.0129
  fixed_cubic_coefficient: -0.0062
  signal_timing: T日收盘后
  earliest_execution: T加1交易日开盘

mechanism_evaluation:
  outcome: NEXT_TRADING_DAY_000300_NORMALIZED_LOG_RETURN
  newey_west_lags: 5
  minimum_valid_rows: 2800
  bootstrap:
    method: CIRCULAR_MOVING_BLOCK_OVER_DAILY_ROWS
    repetitions: 5000
    block_length_trading_days: 20
    confidence_level: 0.90
    random_seed: 20260831
  gates:
    full_sample_linear_coefficient_positive: true
    full_sample_cubic_coefficient_negative: true
    full_sample_linear_newey_west_t_minimum: 1.645
    full_sample_cubic_newey_west_t_maximum: -1.645
    linear_bootstrap_90pct_lower_positive: true
    cubic_bootstrap_90pct_upper_negative: true
    fixed_paper_score_slope_positive: true
    fixed_paper_score_newey_west_t_minimum: 1.645
    fixed_paper_score_bootstrap_90pct_lower_positive: true
    fixed_paper_score_mse_improvement_vs_zero_positive: true
    both_structural_periods_preserve_linear_positive_cubic_negative: true
    both_structural_periods_fixed_score_slope_positive: true
  pass_requires_all_gates: true

portfolio:
  enabled_only_if_mechanism_gate_passes: true
  position_mapping: ONE_IF_FIXED_TREND_SCORE_POSITIVE_ELSE_ZERO
  initial_research_target: 1.0
  missing_score_action: HOLD_PREVIOUS_RESEARCH_TARGET
  initial_capital_cny: 20000.0
  lot_size_shares: 100
  cash_annual_rate: 0.0
  base_costs:
    commission_rate_per_leg: 0.0003
    minimum_commission_cny_per_leg: 5.0
    stamp_duty_rate: 0.0
    slippage_bps_per_leg: 5.0
  stress_costs:
    commission_rate_per_leg: 0.0003
    minimum_commission_cny_per_leg: 5.0
    stamp_duty_rate: 0.0
    slippage_bps_per_leg: 10.0

portfolio_gates:
  base_net_sharpe_minimum: 1.20
  stress_net_sharpe_minimum: 0.90
  annualized_excess_vs_510300_buy_hold_minimum: 0.0
  annualized_excess_vs_h00300_total_return_minimum: 0.0
  maximum_drawdown_ratio_vs_buy_hold_maximum: 0.75
  late_temporal_holdout_net_sharpe_minimum: 1.00
  maximum_single_positive_year_share_of_positive_excess: 0.50
  delete_any_calendar_year_excess_vs_buy_hold_must_be_positive: true
  deflated_sharpe_probability_minimum: 0.95
  pass_requires_all_gates: true

selection_bias:
  trial_count_rule: COUNT_ALL_EXISTING_510300_MANIFESTS_PLUS_NON_MANIFEST_PREFREEZE_ATTEMPTS
  non_manifest_prefreeze_failed_attempt_count: 1
  named_non_manifest_attempts: [510300_CSI300_ABSORPTION_RATIO_TIMING_V1]
  expected_prior_manifest_count_at_freeze: 343
  expected_total_trial_count_including_current: 345
  pbo_status: NOT_IDENTIFIABLE_SINGLE_FIXED_PATH

adjudication:
  mechanism_pass_status: PASS_NONLINEAR_TREND_MECHANISM_PORTFOLIO_EVALUATION_ALLOWED
  mechanism_fail_status: REJECTED_FROZEN_NONLINEAR_TREND_MECHANISM_GATE_FAILED_NO_RESCUE
  portfolio_pass_status: PASS_HISTORICAL_NET_SHARPE_1P2_FORWARD_EVIDENCE_REQUIRED
  portfolio_fail_status: REJECTED_FROZEN_NONLINEAR_TREND_PORTFOLIO_GATE_FAILED_NO_RESCUE
  data_fail_status: NO_VIEW_DATA_OR_PROTOCOL_CONTRACT_FAILED
  return_evaluation_if_mechanism_fails: NOT_ALLOWED
  target_net_sharpe: 1.20
  verified_forward_target_required: true

governance:
  research_only: true
  paper_signal_allowed: false
  shadow_signal_allowed: false
  order_generation: false
  broker_connection: false
  position_change: false
  live_trading_authorized: false


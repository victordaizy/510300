factor:
  id: CSI300_POINT_IN_TIME_PCA_ABSORPTION_RATIO_STANDARDIZED_SHIFT
  active_factor_count: 1
  return_definition: daily_log_return_of_forward_filled_total_return_close_on_csi300_trading_calendar
  covariance_window_trading_days: 500
  covariance_weighting: exponential
  exponential_half_life_trading_days: 250
  covariance_centering: weighted_mean
  covariance_denominator: normalized_weights_sum_to_one
  eigenvector_count_formula: floor(valid_member_count/5)
  absorption_ratio_formula: sum_largest_floor_N_div_5_covariance_eigenvalues_divided_by_covariance_trace
  short_average_trading_days: 15
  long_average_trading_days: 250
  long_standard_deviation_trading_days: 250
  long_standard_deviation_ddof: 1
  standardized_shift_formula: (AR_mean_15-AR_mean_250)/AR_sample_std_250
  upper_risk_off_threshold: 1.0
  lower_risk_on_threshold: -1.0
  initial_target_position: 0.5
  threshold_mapping: HYSTERESIS_CARRY_PREVIOUS_STATE
  high_shift_action: TARGET_ZERO
  low_shift_action: TARGET_ONE
  equality_included: true
  threshold_selection: none
  ranking: none
  winsorization: none
  sign_reversal_after_result: forbidden

mechanism_model:
  target: next_execution_open_to_following_open_000300_price_index_log_return
  exposure_regressor: frozen_hysteresis_target_position_known_at_prior_close
  regression: target_log_return = alpha + beta_exposure * target_position + error
  expected_beta_exposure_direction: positive
  signal_lag_trading_days: 1
  newey_west_max_lag_trading_days: 20
  bootstrap_method: CIRCULAR_MOVING_BLOCK_BOOTSTRAP_EXPOSURE_COEFFICIENT
  bootstrap_repetitions: 5000
  bootstrap_block_length_trading_days: 60
  bootstrap_confidence_level: 0.90
  random_seed: 20260830

mechanism_gates:
  minimum_complete_oos_trading_returns: 2800
  minimum_full_risk_on_days: 60
  minimum_full_risk_off_days: 60
  full_sample_beta_exposure_must_be_positive: true
  full_sample_beta_exposure_one_sided_t_minimum: 1.645
  bootstrap_90pct_lower_beta_exposure_must_be_positive: true
  every_structural_period_beta_exposure_must_be_positive: true
  minimum_each_extreme_state_days_per_structural_period: 20
  pass_requires_all_gates: true

allocation:
  enabled_only_if_mechanism_gate_passes: true
  initial_target_position: 0.5
  risk_on_target_position: 1.0
  risk_off_target_position: 0.0
  between_threshold_action: carry_previous_target
  missing_or_invalid_factor_action: NO_VIEW_CARRY_PREVIOUS_TARGET

  evidence_class: RETROSPECTIVE_PRE_2015_PUBLISHED_MECHANISM_ONE_SHOT_ON_PREVIOUSLY_OBSERVED_510300_HISTORY
  purpose: 验证沪深300点时成分股PCA吸收率的标准化变化能否区分后续可交易持有期收益状态；机制门全部通过后才允许计算510300与现金组合的净费后收益和夏普率
  registration_date: '2026-08-30'
  timezone: Asia/Shanghai
  primary_paper_sample_ends_before_evaluation: true
  historical_510300_data_already_contaminated: true
  candidate_factor_values_read_before_freeze: true
  candidate_market_return_outcomes_read_before_freeze: false
  candidate_portfolio_returns_read_before_freeze: false
  pristine_blind_holdout_claim_allowed: false
  one_shot: true
  pre_factor_data_contract_correction: true
  pre_factor_failure_receipt: reports/frozen/510300_csi300_absorption_ratio_timing_v1_pre_factor_membership_failure.json
  target_sharpe_is_acceptance_gate_not_optimization_objective: true
  parameter_rescue_after_result: forbidden
  alternate_factor_rescue_after_result: forbidden
  alternate_window_rescue_after_result: forbidden
  reverse_direction_after_result: forbidden
  alternate_eigenvector_fraction_after_result: forbidden
  alternate_threshold_after_result: forbidden
  alternate_initial_state_after_result: forbidden
  continuous_weight_mapping_after_result: forbidden
  combination_with_rejected_candidates_after_result: forbidden

literature:
  primary_mechanism_paper:
    title: Principal Components as a Measure of Systemic Risk
    authors: Mark Kritzman, Yuanzhen Li, Sebastien Page, Roberto Rigobon
    publication_year: 2011
    journal: The Journal of Portfolio Management
    url: https://globalmarkets.statestreet.com/research/service/public/v1/article/insights/pdf/v2/275a6997-b913-47da-b487-948d83f7765e/jpm_principal_components_as_a_measure_of_systemic_risk.pdf
    sample_start: '1998-01-01'
    sample_end: '2010-01-31'
    original_market: MSCI_USA_51_INDUSTRIES
    expected_direction: standardized_absorption_ratio_increase_precedes_weaker_stock_returns
  exact_published_construction:
    covariance_window_trading_days: 500
    eigenvector_count: approximately_one_fifth_of_assets
    exponential_half_life_trading_days: 250
    short_average_trading_days: 15
    long_average_trading_days: 250
    standardization: difference_between_15_day_and_250_day_AR_means_divided_by_trailing_250_day_AR_sample_standard_deviation
    risk_on_trigger: standardized_shift_less_than_or_equal_to_minus_one
    risk_off_trigger: standardized_shift_greater_than_or_equal_to_plus_one
    between_trigger_action: carry_previous_state
    execution_lag: one_trading_day
  transfer_limitations:
    - 原论文使用51个美国行业指数，本候选转移到中国沪深300点时成分股
    - 原论文风险关闭资产是美国国债，本候选受范围约束只能持有零收益现金，因此不得借用论文组合表现
    - 动态点时成分数量可能为300或301，固定取floor(N/5)个最大特征值以保持约五分之一比例
    - 历史成员来自第三方将官方调样公告标准化后的区间以及既有点时面板，不得称为中证官方历史权重
    - 第三方区间将已于2009-12-29终止上市的600357.SH错误延长到2014-07-10；冻结前依据上交所退市与指数剔除公告将其opt_out纠正为2009-12-29
    - 历史成分行情与复权因子是当前回溯重建，不构成当时可得性时间戳证明
    - 历史研究不是盲测；510300及000300历史在其他候选中已经被观察


metrics:
  annualization_trading_days: 242
  sharpe_risk_free_rate: 0.0
  sharpe_definition: 日收益算术均值除以样本标准差乘sqrt(242)
  cagr_definition: 日复合对数收益按242日年化
  cumulative_net_excess_definition: 策略累计净收益率减同成本情景510300含分红买入持有累计净收益率
  event_forward_windows_trading_days:
    - 5
    - 10
    - 20
    - 60

decision_gates:
  phase_1_microstructure:
    gate_1_net_sharpe:
      minimum: 1.2
      required_scenarios:
        - BASE
        - STRESS
    gate_2_cumulative_net_excess:
      minimum_exclusive: 0.0
      required_scenarios:
        - BASE
        - STRESS
    gate_3_drawdown_reduction:
      maximum_drawdown_magnitude_ratio_vs_buy_hold: 0.80
      required_scenarios:
        - BASE
        - STRESS
    gate_4_multiple_independent_cycles:
      minimum_positive_pressure_cycles_under_stress: 2
      maximum_largest_positive_cycle_share: 0.80
  phase_1_pass_rule: 四项门槛全部通过
  phase_2_combination:
    run_only_if_phase_1_passes: true
    paths:
      - 510300含分红买入持有
      - 原始估值仓位基线
      - 原始微观结构风险开关
      - 估值基线加微观结构否决
    gate_5_combination_must_add_value: 组合必须在净夏普、最大回撤、跨周期稳定性或单一事件依赖至少一项明确优于两个单一系统，否则保留表现更好的单一系统

stop_rules:
  if_data_gate_fails: NO_VIEW_SAME_DEFINITION_HISTORY_UNAVAILABLE
  if_phase_1_fails: REJECTED_LONG_CYCLE_REPLICATION_NO_PHASE_2_NO_RESCUE
  parameter_rescue: FORBIDDEN
  window_rescue: FORBIDDEN
  date_rescue: FORBIDDEN
  source_substitution_rescue: FORBIDDEN
  valuation_or_technical_filter_rescue: FORBIDDEN


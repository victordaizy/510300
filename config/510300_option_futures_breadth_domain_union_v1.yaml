    path: data/raw/r6/H00300_total_return_daily.parquet
    benchmark_id: H00300
  cash_distributions:
    path: data/reference/510300_dividends.csv

common_clock:
  definition: IF0、000300、期权日统计、全A特征四类信息均存在的交易日交集
  sort: date_ascending
  duplicate_policy: reject
  percentile_window_rows: 252
  percentile_minimum_rows: 126
  percentile_definition: 当前值在含当前行的最近252个共同信息日有效值中的小于等于比例

option_gamma_domain:
  contract_filter:
    adjusted_contracts_allowed: false
    minimum_calendar_days_to_expiry: 5
    maximum_calendar_days_to_expiry: 90
    contract_unit_must_be_positive: true
    volume_must_be_nonnegative: true
    open_interest_must_be_nonnegative: true
    required_nonmissing:
      - contract_unit
      - volume
      - open_interest
      - underlying_close
      - delta
      - gamma
      - implied_volatility
  gamma_weight: abs(gamma)*open_interest*contract_unit*underlying_close^2
  option_sign: call=1,put=-1
  gamma_balance: sum(option_sign*gamma_weight)/sum(gamma_weight)
  rank: gamma_balance的滚动252共同期权日百分位，最少126日
  state_machine:
    initial_state: 1
    enter_cash_when_rank_at_least: 0.90
    return_full_when_rank_below: 0.50
    missing_rank_while_full: 保持满仓
    missing_rank_while_cash: 保持空仓

orthogonal_domains:
  breadth:
    raw_feature: top10pct_amount_share
    trigger: 滚动百分位小于等于0.20
  basis:
    basis: log(IF0_close/000300_close)
    basis_z60: (basis-rolling_mean60)/rolling_sample_std60
    basis_change5: basis-basis_lag5
    trigger: basis_z60滚动百分位小于等于0.10，或basis_change5滚动百分位小于等于0.05
    vote_cap: 两个基差信号合并且最多只计一票
  futures_open_interest:
    raw_feature: log(IF0_open_interest/IF0_open_interest_lag5)
    trigger: 滚动百分位小于等于0.15
  option_put_call_volume:
    raw_feature: log((put_volume+1)/(call_volume+1))
    trigger: 滚动百分位小于等于0.10
  required_votes_for_cash: 2

final_state_rule:
  cash_state: 期权Gamma滞回状态为空仓，或信号日四个正交域至少两票触发
  full_state: 其他全部情况
  option_state_applies_on_execution_date: true
  orthogonal_votes_use_previous_signal_date: true

account:
  initial_capital_cny: 500000.0
  lot_size_shares: 100
  paid_dividends_reinvested_at_earliest_next_open: true
  cash_annual_rate: 0.015

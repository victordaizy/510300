protocol:
  project_id: 510300_OIL_TREND_MONTHLY_TIMING_V1
  candidate_model_id: 510300_OIL_TREND_MONTHLY_TIMING_V1
  state: PROTOCOL_DRAFT_BEFORE_FIRST_RESULT
  evidence_class: RETROSPECTIVE_POST_REJECTION_ORTHOGONAL_EXTERNAL_PRICE_TREND_ONE_SHOT
  purpose: 验证点时可得的原油趋势能否稳定识别510300下月收益；只有机制门通过后才允许读取组合收益与夏普率
  registration_date: '2026-08-30'
  timezone: Asia/Shanghai
  historical_510300_data_already_contaminated: true
  one_shot: true
  target_sharpe_is_acceptance_gate_not_optimization_objective: true
  parameter_rescue_after_result: forbidden
  alternate_factor_rescue_after_result: forbidden
  alternate_window_rescue_after_result: forbidden
  reverse_direction_after_result: forbidden
  combination_with_rejected_candidates_after_result: forbidden
  pre_freeze_data_decision:
    status: CORRECTED_BEFORE_ANY_510300_OUTCOME_WAS_READ
    rejected_input_series: EIA_WTI_RWTC
    rejection_reason: 2020-04-20现货价格为负导致预注册对数公式无定义；禁止删点、截尾或平移
    admitted_input_series: EIA_BRENT_RBRTE
    decision_basis: 纯数据定义域与完整性；未读取任何510300候选收益

literature:
  china_equity_paper:
    title: 'Stock return predictability in China: Power of oil price trend'
    doi: 10.1016/j.frl.2021.102537
    url: https://www.sciencedirect.com/science/article/pii/S1544612321005006
    published_sample_end: '2019-12-31'
    preregistered_direction: 油价趋势因子与下一期中国权益风险溢价负相关
  open_method_source:
    title: 'Oil Strikes Back: Trend Factors and Exchange Rates'
    doi: 10.1111/jmcb.13146
    url: https://bimsa.net/doc/publication/5573.pdf
    equation: T_t_L等于最近L个月末价格均值除以本月末价格；OTF_t_L等于ln(T_t_L)减ln(T_t_minus_1_L)
  transfer_limitations:
    - 本研究交易510300而非论文的全市场风险溢价序列
    - 本研究使用EIA公开Brent现货而非假定可取得的商业数据库快照
    - WTI因2020年负价格令对数公式无定义而在冻结前按数据准入规则排除
    - 本研究额外施加五个美国工作日可得性滞后，因此是保守迁移检验而非逐字复制论文

scope:
  execution_asset: 510300.SH
  allowed_holdings:
    - 510300.SH
    - CASH_CNY
  auxiliary_information:
    - EIA_BRENT_SPOT_RBRTE
    - H00300_TOTAL_RETURN_BENCHMARK
  long_only: true
  leverage_allowed: false
  short_selling_allowed: false
  derivatives_execution_allowed: false
  signal_time: 中国月末交易日收盘后
  earliest_execution_time: 下一中国交易日开盘
  live_trading_authorized: false

dates:
  raw_warmup_start: '2012-01-01'
  evaluation_start: '2015-01-05'
  evaluation_end: '2026-08-12'
  structural_periods:
    PAPER_SAMPLE_OVERLAP:
      start: '2015-01-05'
      end: '2019-12-31'
    POST_PUBLISHED_SAMPLE:
      start: '2020-01-01'
      end: '2026-08-12'

inputs:
  etf_daily:
    path: data/raw/market/510300_daily_downside_risk_v1.parquet
    symbol: 510300.SH
    required_columns: [date, open, high, low, close, volume, amount]
  dividends:
    path: data/reference/510300_dividends.csv
    required_columns: [symbol, record_date, ex_date, payment_date, cash_dividend_per_share]
  benchmark_total_return:
    path: data/raw/r6/H00300_total_return_daily.parquet
    symbol: H00300
    required_columns: [date, close]
  oil_raw_response:
    path: data/raw/macro/eia_brent_spot_daily_oil_trend_v1_raw.json
  oil_daily:
    path: data/raw/macro/eia_brent_spot_daily_oil_trend_v1.parquet
    series: RBRTE
    required_columns: [date, value, availability_date, series, units]
  input_audit:
    path: reports/data_quality/510300_oil_trend_inputs_v1.json
    required_status: PASS
    candidate_outcomes_computed: false
    portfolio_returns_computed: false
  backtest_engine:
    path: backtest/engine.py

data_contract:
  oil_source_owner: U.S. Energy Information Administration
  oil_api_route: https://api.eia.gov/v2/petroleum/pri/spt/data/
  oil_series: RBRTE
  oil_series_description: Europe Brent Spot Price FOB
  oil_units: $/BBL
  oil_request_start: '2012-01-01'
  oil_request_end: '2026-08-14'
  oil_minimum_rows: 3650
  oil_expected_first_observation: '2012-01-03'
  oil_expected_last_observation: '2026-08-14'
  oil_duplicate_policy: reject
  oil_missing_or_nonpositive_policy: reject
  oil_availability_proxy: 观测日期加五个美国工作日；忽略美国节假日会使可得日偏早，因此另设十工作日稳健性门
  expected_etf_rows: 3456
  expected_evaluation_rows: 2821
  expected_etf_first_date: '2012-05-28'
  expected_etf_last_date: '2026-08-14'
  etf_duplicate_policy: reject
  etf_missing_ohlc_policy: reject
  minimum_complete_monthly_targets: 130

oil_factor:
  id: EIA_BRENT_NORMALIZED_MA_LOG_CHANGE_12M
  lag_months: 12
  monthly_price: 每个自然月最后一个EIA日度观测值
  availability_lag_us_business_days: 5
  robustness_availability_lag_us_business_days: 10
  normalized_moving_average_formula: 最近12个月末Brent价格均值除以当月Brent价格
  factor_formula: ln(normalized_moving_average_t)减ln(normalized_moving_average_t_minus_1)
  factor_selection: single_fixed_specification
  alternate_lag_selection: forbidden
  sign_reversal_after_result: forbidden

signal:
  decision_dates: 510300每个自然月最后一个真实交易日
  factor_alignment: factor_available_date小于等于decision_date的最新因子
  positive_factor_target_position: 0.0
  nonpositive_factor_target_position: 1.0
  positive_factor_reason: 按文献预注册负向预测关系进入现金
  missing_factor_action: 维持前一目标；若从未形成有效目标则持有现金
  execution: 下一交易日未复权开盘价

mechanism_target:
  horizon: 从本次信号的下一交易日开盘到下次信号的下一交易日开盘
  return_formula: (退出开盘价加持有期间应享现金分红)除以进入开盘价减一
  dividend_entitlement: record_date大于等于进入日且严格小于退出日
  risk_off_group: oil_factor大于零
  risk_on_group: oil_factor小于等于零
  expected_group_difference: risk_off_group_mean_minus_risk_on_group_mean小于零

bootstrap:
  method: CIRCULAR_MOVING_BLOCK_OVER_MONTHLY_ROWS
  repetitions: 5000
  block_length_months: 6
  confidence_level: 0.90
  random_seed: 20260830

mechanism_gates:
  minimum_complete_monthly_targets: 130
  minimum_observations_each_group: 45
  full_sample_mean_difference_must_be_negative: true
  full_sample_median_difference_must_be_negative: true
  bootstrap_90pct_upper_must_be_negative: true
  newey_west_slope_must_be_negative: true
  newey_west_one_sided_t_maximum: -1.645
  every_structural_period_mean_difference_must_be_negative: true
  every_leave_one_calendar_year_out_mean_difference_must_be_negative: true
  pass_requires_all_gates: true

portfolio:
  enabled_only_if_mechanism_gate_passes: true
  initial_capital_cny: 20000.0
  initial_position: 0.0
  lot_size_shares: 100
  cash_annual_rate: 0.0
  base_costs:
    commission_rate_per_leg: 0.0003
    minimum_commission_cny_per_leg: 5.0
    slippage_bps_per_leg: 5.0
    stamp_duty_rate: 0.0
  double_costs:
    commission_rate_per_leg: 0.0006
    minimum_commission_cny_per_leg: 10.0
    slippage_bps_per_leg: 10.0
    stamp_duty_rate: 0.0
  delayed_start_months: [0, 1, 2, 3]

portfolio_gates:
  base_net_sharpe_minimum: 1.20
  double_cost_net_sharpe_minimum: 0.90
  annualized_excess_vs_510300_buy_hold_must_be_positive: true
  annualized_excess_vs_h00300_total_return_must_be_positive: true
  maximum_drawdown_ratio_vs_buy_hold_maximum: 0.75
  every_structural_period_net_sharpe_minimum: 0.50
  every_structural_period_excess_vs_buy_hold_must_be_positive: true
  every_delayed_start_net_sharpe_minimum: 1.00
  every_delayed_start_excess_vs_buy_hold_must_be_positive: true
  ten_business_day_clock_net_sharpe_minimum: 1.00
  ten_business_day_clock_excess_vs_buy_hold_must_be_positive: true
  delete_any_calendar_year_excess_vs_buy_hold_must_be_positive: true
  maximum_single_positive_year_share_of_positive_excess: 0.50
  deflated_sharpe_probability_minimum: 0.95
  probabilistic_sharpe_above_1p0_minimum: 0.80
  pass_requires_all_gates: true

selection_bias:
  trial_count_rule: COUNT_ALL_PREEXISTING_510300_MANIFESTS_AS_CONSERVATIVE_UPPER_BOUND
  pbo_status: NOT_APPLICABLE_ONE_FROZEN_SPECIFICATION
  deflated_sharpe_method: BAILEY_LOPEZ_DE_PRADO_NORMAL_NULL_TRIAL_STD_PROXY

adjudication:
  mechanism_pass_status: PASS_OIL_TREND_PREDICTIVE_GATE_PORTFOLIO_EVALUATION_ALLOWED
  mechanism_fail_status: REJECTED_FROZEN_OIL_TREND_PREDICTIVE_GATE_FAILED_NO_RESCUE
  portfolio_pass_status: HISTORICAL_RETROSPECTIVE_SHARPE_1P2_PASS_FORWARD_CONFIRMATION_REQUIRED
  portfolio_fail_status: REJECTED_FROZEN_OIL_TREND_PORTFOLIO_GATE_FAILED_NO_RESCUE
  data_fail_status: NO_VIEW_DATA_OR_PROTOCOL_CONTRACT_FAILED
  program_fail_status: PROGRAM_FAILED
  target_net_sharpe: 1.20
  historical_pass_never_authorizes_trading: true

governance:
  research_only: true
  discovery_only: true
  paper_or_shadow_position_mapping: disabled
  order_generation: false
  broker_connection: false
  position_change: false
  live_trading_authorized: false

paths:
  manifest: config/510300_oil_trend_monthly_timing_v1_manifest.json
  freeze_receipt: reports/frozen/510300_oil_trend_monthly_timing_v1_freeze_receipt.json
  result_json: reports/research/510300_oil_trend_monthly_timing_v1_result.json
  result_markdown: reports/research/510300_OIL_TREND_MONTHLY_TIMING_V1.md
  monthly_factor_table: data/research/510300_oil_trend_monthly_timing_v1/monthly_oil_factor.parquet
  signal_table: data/research/510300_oil_trend_monthly_timing_v1/monthly_signals_and_targets.parquet
  mechanism_table: data/research/510300_oil_trend_monthly_timing_v1/monthly_mechanism_targets.parquet
  base_ledger: data/research/510300_oil_trend_monthly_timing_v1/base_ledger.parquet
  base_trades: data/research/510300_oil_trend_monthly_timing_v1/base_trades.parquet
  double_cost_ledger: data/research/510300_oil_trend_monthly_timing_v1/double_cost_ledger.parquet
  double_cost_trades: data/research/510300_oil_trend_monthly_timing_v1/double_cost_trades.parquet
  buy_hold_ledger: data/research/510300_oil_trend_monthly_timing_v1/buy_hold_ledger.parquet
  buy_hold_trades: data/research/510300_oil_trend_monthly_timing_v1/buy_hold_trades.parquet
  robust_clock_ledger: data/research/510300_oil_trend_monthly_timing_v1/robust_clock_ledger.parquet
  robust_clock_trades: data/research/510300_oil_trend_monthly_timing_v1/robust_clock_trades.parquet

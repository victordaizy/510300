diagnostic_definition:
  bucket_rule: "FROZEN_FOUR_VALUATION_BUCKETS_NO_POSITION_MAPPING"
  buckets:
    - {id: "B1_EXPENSIVE", lower_inclusive: 0.00, upper_exclusive: 0.20}
    - {id: "B2", lower_inclusive: 0.20, upper_exclusive: 0.40}
    - {id: "B3", lower_inclusive: 0.40, upper_exclusive: 0.60}
    - {id: "B4_CHEAP", lower_inclusive: 0.60, upper_inclusive: 1.00}
  spearman_tie_rule: "AVERAGE_RANK"
  chronological_split_rule: "成熟样本按观察日排序后在样本数中点切分"
  hac_regression: "rank(return) on intercept and rank(percentile)"
  hac_monthly_max_lags: {60: 2, 120: 5, 242: 12}
  hac_kernel: "BARTLETT_NEWEY_WEST"
  hac_p_value: "ONE_SIDED_NORMAL_APPROXIMATION_FOR_POSITIVE_SLOPE"
  overlapping_label_caveat: "收益窗口重叠；只使用预冻结HAC，不使用普通独立样本p值"

primary_predictive_gate:
  minimum_matured_observations: 36
  minimum_observations_per_bucket: 5
  spearman_ic_strictly_positive: true
  both_chronological_half_ics_strictly_positive: true
  bucket_mean_returns_nondecreasing: true
  cheapest_minus_expensive_mean_return_strictly_positive: true
  cheapest_minus_expensive_median_return_strictly_positive: true
  h00300_spearman_confirmation_strictly_positive: true
  h00300_cheapest_minus_expensive_mean_return_strictly_positive: true
  familywise_hac_method: "HOLM_BONFERRONI"
  familywise_alpha: 0.05
  family_size: 1
  pass_status: "HISTORICAL_PREDICTIVE_SCREEN_PASS_STRATEGY_EVALUATION_NOT_RUN"
  fail_status: "REJECT_PREDICTIVE_SCREEN_STOP_NO_STRATEGY_BACKTEST"


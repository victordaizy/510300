    normalized_panel_output: data/raw/510300_stress_transmission_hazard_v2_four_state_ledger_execution_v1/dividend_action_candidates.parquet
    exact_duplicate_rows_may_be_collapsed: true
    conflicting_economic_terms_rule: CORPORATE_ACTION_UNRESOLVED
  request_control:
    maximum_workers: 2
    minimum_delay_seconds_per_request: 0.5
    retries: 3
    checkpoint_reuse_allowed: true
    checkpoint_overwrite_allowed: false
    output_overwrite_allowed: false
  excluded_bulk_sources:

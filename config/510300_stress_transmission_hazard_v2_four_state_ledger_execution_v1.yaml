    end_date: "2026-08-14"
    symbol_universe_rule: ANY_PIT_MEMBERSHIP_ON_OR_AFTER_FRESH_DAILY_START
    expected_symbol_count: 493
    fields: [ts_code, trade_date, open, high, low, close, pre_close, change, pct_chg, vol, amount]
    checkpoint_directory: data/raw/510300_stress_transmission_hazard_v2_four_state_ledger_execution_v1/daily_checkpoints

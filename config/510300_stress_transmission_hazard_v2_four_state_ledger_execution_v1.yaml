    acquisition_status: reports/research/510300_stress_transmission_hazard_v2_four_state_input_acquisition_status_v1.json

daily_validation:
  unique_key: [symbol, date]
  price_columns: [raw_open, raw_high, raw_low, raw_close, pre_close]
  prices_must_be_finite_positive: true
  volume_and_amount_must_be_finite_nonnegative: true
  ohlc_envelope_required: true
  pct_chg_identity: (RAW_CLOSE/PRE_CLOSE-1)*100
  pct_chg_absolute_tolerance_percentage_points: 0.011
  cross_source_overlap:
    preferred_source: FRESH_TUSHARE_DAILY
    price_absolute_tolerance_cny: 0.011
    pct_chg_absolute_tolerance_percentage_points: 0.011
    conflict_state: SUPPLIER_MISSING_OR_CONFLICT

corporate_action_reconciliation:
  candidate_rule: ABS(DAILY_PRE_CLOSE-PRIOR_OBSERVED_UNADJUSTED_CLOSE)>0.011
  previous_close_rule: PRIOR_OBSERVED_DAILY_RAW_CLOSE_FOR_SAME_SYMBOL
  exact_action_date_rule: DIVIDEND_EX_DATE_EQUALS_CURRENT_DAILY_DATE
  multi_action_or_suspension_interval_rule: FAIL_CLOSED_UNRESOLVED
  admitted_process: 实施
  availability_rule: IMP_ANN_DATE_STRICTLY_BEFORE_EX_DATE
  gross_cash_field: cash_div_tax
  post_to_pre_share_ratio: ONE_PLUS_STK_DIV
  subscription_cash_outflow: 0.0
  rights_issue_terms_available: false
  expected_pre_close: ROUND_TO_CENT((PREVIOUS_RAW_CLOSE-GROSS_CASH+SUBSCRIPTION_OUTFLOW)/POST_TO_PRE_SHARE_RATIO)
  expected_pre_close_absolute_tolerance_cny: 0.011
  no_action_rule: PRE_CLOSE_MATCHES_PREVIOUS_RAW_CLOSE_AND_NO_NONZERO_IMPLEMENTED_ACTION_ON_DATE
  unresolved_return_value: null


      missing_daily_row_state: SUPPLIER_MISSING_OR_CONFLICT
    adj_factor:
      reason: NOT_REQUIRED_FOR_DAILY_PRE_CLOSE_ACTION_DETECTION_AND_DIRECT_RETURN_USE_IS_PROHIBITED
  outputs:

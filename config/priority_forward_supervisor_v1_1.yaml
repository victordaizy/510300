version: PRIORITY_FORWARD_SUPERVISOR_V1_1
status: SESSION_SCOPED_RESEARCH_AUTOMATION_ATOMIC_CLAIM
timezone: Asia/Shanghai
poll_seconds: 30
heartbeat_seconds: 60

outputs:
  status: reports/audit/priority_forward_supervisor_status.json
  run_receipt_directory: reports/audit/priority_forward_supervisor_runs
  codex_run_receipt_directory: reports/audit/priority_forward_codex_runs_v1_5
  codex_current_status: reports/audit/priority_forward_codex_run_status_v1_5.json
  codex_log_directory: output/priority_forward_codex_automation_v1_5
  codex_task_claim_directory: reports/audit/priority_forward_task_claims_v1_5
  event_ledger: reports/audit/priority_forward_supervisor_events.jsonl
  lock_file: output/priority_forward_supervisor/supervisor.lock
  log_file: output/priority_forward_supervisor/supervisor.log

tasks:
  - id: PRIMARY_MARKET_PCF_IOPV
    schedule: "09:25"
    latest_start: "09:35"
    weekdays: [0, 1, 2, 3, 4]
    launcher: scripts/run_510300_primary_market_collection_task_v1_1.ps1
    evidence_globs:
      - reports/data_quality/primary_market_task_runs/*.json
      - reports/data_quality/510300_primary_market_task_status_*.json
  - id: INDUSTRY_EXPECTATION_GAP
    schedule: "17:05"
    latest_start: "23:30"
    weekdays: [0, 1, 2, 3, 4]
    launcher: scripts/run_industry_expectation_gap_forward_operations_task.ps1
    evidence_globs:
      - reports/forward/industry_expectation_gap_v1_evaluation/task_runs/*.json
  - id: PRIORITY_FORWARD_STATUS
    schedule: "17:15"
    latest_start: "23:50"
    weekdays: [0, 1, 2, 3, 4]
    launcher: scripts/run_priority_forward_research_status_task.ps1
    evidence_globs:
      - reports/audit/priority_forward_status_task_runs/*.json

safety:
  research_only: true
  position_mapping_enabled: false
  order_generation_enabled: false
  broker_connection_enabled: false
  live_trading_enabled: false

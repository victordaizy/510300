protocol:
  model_id: 510300_CONSTITUENT_FRAGILITY_DSV5_INCREMENT_V1
  display_name: 510300成分脆弱性非重叠五日下行半方差增量检验V1
  version: 1.0.0
  registration_date: "2026-09-05"
  timezone: Asia/Shanghai
  evidence_class: RESEARCH_OBSERVED_PREQUENTIAL
  new_alpha_family: false
  new_estimand: true
  new_policy_evaluation_chain: true
  parent_feature_family: 510300_STRESS_TRANSMISSION_HAZARD_V2
  relation_to_parent: NEW_ESTIMAND_NOT_PARENT_RESCUE
  one_shot_historical_test: true
  historical_data_already_observed_by_project: true
  primary_question: >-
    成分股风险传导T_C与静态脆弱性F，能否在510300自身价格风险之外，
    稳定提高对非重叠未来5个交易日下行半方差的预测？

source_adjudication:
  initial_proposal:
    path: E:/CodexData/.codex/attachments/845b3564-acf8-4350-9411-d41ad8252ab6/pasted-text.txt
    bytes: 23709
    sha256: f84cbb87da25d4739dd0cb3923fdaa420896ab2274b72416874576c526f3f914
  final_review:
    path: E:/CodexData/.codex/attachments/680c28e5-e2e9-411c-ac61-577f04dcd2e2/pasted-text.txt
    bytes: 20849
    sha256: 22db4b1e717bfb3d48252d50889a8680d43f6cf0d63f78bd1ba0cc09e6a489d2
  precedence: FINAL_REVIEW_SUPERSEDES_INITIAL_PROPOSAL_ON_CONFLICT
  resolved_conflicts:
    prediction_target: NONOVERLAPPING_FUTURE_5D_DOWNSIDE_SEMIVARIANCE
    policy_evaluation: NOT_ALLOWED_UNTIL_B2_PASSES
    minimum_position: NOT_APPLICABLE_IN_THIS_PREDICTION_ONLY_MODEL
    constituent_feature_definition: REUSE_FROZEN_PARENT_FEATURE_VALUES
    causal_percentile_warmup: >-
      REUSE_PARENT_PERSISTED_DEFINITION_WITHOUT_NEW_252_OBSERVATION_OVERLAY
    causal_percentile_warmup_rationale: >-
      最终审校将本研究登记为NEW_ESTIMAND_NOT_PARENT_RESCUE并要求F保持旧定义；
      因此不得同时重算父特征或新增暖启动门。初稿的252日新暖启动不进入本V1。

scope:
  executable_assets: [510300.SH, CASH_CNY]
  signal_inputs:
    - 510300_TOTAL_WEALTH_DAILY
    - FROZEN_POINT_IN_TIME_CSI300_CONSTITUENT_F
    - FROZEN_POINT_IN_TIME_CSI300_CONSTITUENT_T_C
  long_only: true
  leverage_allowed: false
  short_selling_allowed: false
  derivatives_execution_allowed: false
  industry_feature_allowed: false
  macro_feature_allowed: false
  nbs_feature_allowed: false
  minute_feature_allowed: false
  signal_time: T_MARKET_CLOSE
  hypothetical_label_entry_time: NEXT_TRADING_DAY_OFFICIAL_OPEN
  historical_cutoff_for_features: "2026-08-14"
  live_trading_authorized: false

lineage:
  required_audit_output: reports/audit/510300_constituent_fragility_dsv5_increment_v1_lineage_audit.json
  comparisons:
    - id: 510300_DOWNSIDE_RISK_BUDGET_V1
      config_path: config/510300_downside_risk_budget_v1.yaml
      result_path: reports/research/510300_downside_risk_budget_v1_result.json
      target: FUTURE_20D_MAXIMUM_ADVERSE_EXCURSION_WITH_20D_DOWNSIDE_SEMIVARIANCE_SECONDARY
      decision: NOT_EXACT_MATCH
    - id: HAR_VOLATILITY_CHALLENGER
      config_path: config/har_volatility_challenger.yaml
      result_path: reports/research/510300_har_volatility_20d_report.json
      target: FUTURE_20D_REALIZED_VOLATILITY
      decision: NOT_EXACT_MATCH
    - id: 510300_OPTION_IMPLIED_DOWNSIDE_RISK_BUDGET_V1
      config_path: config/510300_option_implied_downside_risk_budget_v1.yaml
      result_path: reports/data_quality/510300_option_implied_downside_risk_budget_v1/G0_G1_ADJUDICATION.json
      target: OVERLAPPING_FUTURE_5D_TOTAL_VARIANCE_WITH_OPTION_INCREMENT
      decision: NOT_EXACT_MATCH
    - id: 510300_STRESS_TRANSMISSION_HAZARD_V2
      config_path: config/510300_stress_transmission_hazard_v2.yaml
      result_path: reports/research/510300_stress_transmission_hazard_v2_g1b_historical_final_status_v1.json
      target: BAD10_EVENT_PROBABILITY
      decision: PARENT_FEATURE_FAMILY_ONLY_NOT_EXACT_ESTIMAND
  exact_match_expected: false
  if_exact_match_found: STOP_AND_REUSE_FROZEN_B1_LEDGER


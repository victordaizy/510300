parent_feature_contract:
  F:
    fields:
      - f1_breadth_risk_percentile
      - f2_leadership_risk_percentile
      - f3_comovement_risk_percentile
    aggregation: MEDIAN_REQUIRING_ALL_THREE
    persisted_field: F
    persisted_value_must_equal_recomputed_median: true
  T_C:
    fields:
      - t1_breadth_drop_risk_percentile
      - t2_tail_diffusion_risk_percentile
      - t3_comovement_accel_risk_percentile
    aggregation: MEDIAN_REQUIRING_ALL_THREE
    funding_shock_t4_included: false
  interaction: T_C_TIMES_F
  prohibited_parent_changes:
    - RECOMPUTE_PARENT_CAUSAL_PERCENTILES
    - CHANGE_20_5_60_WINDOWS
    - CHANGE_PARENT_COVERAGE_GATES
    - CHANGE_TAIL_SIGMA_MULTIPLE
    - ADD_FUNDING_SHOCK_OR_OTHER_MACRO
    - ADD_INDUSTRY

label:
  name: DSV5
  definition: ANNUALIZED_FIVE_DAY_DOWNSIDE_SEMIVARIANCE
  formula: 252_DIV_5_TIMES_SUM_OF_MIN_LOG_RETURN_ZERO_SQUARED
  horizon_trading_days: 5
  nonoverlapping_within_each_offset: true
  signal_origin: T_CLOSE
  entry_date: NEXT_TRADING_DAY
  entry_price: OFFICIAL_UNADJUSTED_OPEN
  first_return: LOG_ENTRY_DAY_CLOSE_DIVIDED_BY_ENTRY_DAY_OPEN
  later_returns: LOG_CURRENT_TOTAL_WEALTH_CLOSE_DIVIDED_BY_PREVIOUS_TOTAL_WEALTH_CLOSE
  dividend_contract:
    wealth_basis: ONE_SHARE_PLUS_ENTITLED_CASH_DIVIDEND_RECEIVABLE
    entitlement_clock: HOLDER_AT_RECORD_DATE_CLOSE
    recognition_clock: EX_DATE_RECEIVABLE
    entry_day_preexisting_entitlement_included: false
    later_ex_date_cash_included_only_if_record_date_on_or_after_entry_date: true
    reinvestment: false
  annualization_days: 252
  total_variance_diagnostic:
    enabled: true
    training_target_allowed: false
  qlike_epsilon: 1.0e-8
  labels_may_be_read_only_after_g0_g1_pass_and_prelable_commit: true

b1_features:
  LOG_RV20:
    formula: LOG_SQRT_252_DIV_20_TIMES_SUM_LAST_20_LOG_TOTAL_RETURNS_SQUARED
  NEG5:
    formula: MAX_NEGATIVE_SUM_LAST_5_LOG_TOTAL_RETURNS_ZERO
  DD20:
    formula: MAX_ONE_MINUS_CURRENT_TOTAL_WEALTH_DIV_LAST_20_DAY_MAX_ZERO
  all_slopes_nonnegative: true

origin_schedule:
  calendar: ETF_OBSERVED_SSE_OPEN_TRADING_DATES
  anchor: FIRST_DATE_WITH_COMPLETE_F_T_C_B1_HISTORY_AND_MATURE_FIVE_DAY_PATH
  cadence_trading_days: 5
  registered_offsets: [0, 1, 2, 3, 4]
  primary_offset: 0
  offset_selection_after_label_read_allowed: false
  scheduled_no_view_rule: RETAIN_GRID_SKIP_ORIGIN_WITHOUT_SHIFTING_OR_REANCHORING
  first_training_origins: 80
  minimum_primary_total_origins: 225
  minimum_primary_prequential_evaluation_origins: 145
  evaluation_eras: 3
  era_assignment: CONTIGUOUS_NEAR_EQUAL_COUNTS_EARLIER_ERA_GETS_ONE_EXTRA
  minimum_origins_each_era: 48
  insufficient_state: NO_VIEW_INSUFFICIENT_NONOVERLAPPING_ORIGINS

models:
  prediction_order: [B0, B1, B2]
  B0:
    type: EXPANDING_MATURED_TRAINING_DSV5_MEAN
  B1:
    type: EXP_LINK_NONNEGATIVE_QLIKE_RIDGE
    inputs: [LOG_RV20, NEG5, DD20]
  B2:
    type: EXP_LINK_NONNEGATIVE_QLIKE_RIDGE
    inputs: [LOG_RV20, NEG5, DD20, T_C, T_C_X_F]
  qlike_objective: MEAN_ACTUAL_DIV_PREDICTED_PLUS_LOG_PREDICTED_PLUS_L2
  qlike_evaluation: UNIT_INVARIANT_QLIKE_DEVIANCE_WITH_FIXED_EPSILON
  l2_lambda: 1.0
  intercept_penalized: false
  slopes_lower_bound: 0.0
  standardization: CURRENT_MATURE_TRAINING_SAMPLE_ONLY
  training_window: EXPANDING
  refit_every_evaluation_origins: 13
  training_label_maturity_rule: HORIZON_END_DATE_LE_ORIGIN_DATE
  coefficient_hold_between_refits: true
  forbidden_selection:
    - FEATURE_SELECTION
    - LAMBDA_GRID_SEARCH
    - SIGN_REVERSAL
    - RANDOM_FOREST
    - XGBOOST
    - NEURAL_NETWORK
    - SHARPE_BASED_MODEL_SELECTION

evaluation:
  primary_metric: QLIKE
  secondary_metric: LOG_DSV5_PLUS_EPSILON_MSE
  bootstrap:
    method: CIRCULAR_MOVING_BLOCK_OVER_EVALUATION_ORIGINS
    block_length_origins: 13
    repetitions: 5000
    one_sided_confidence: 0.90
    random_seed: 20260905
  risk_quintiles: 5
  robustness_offsets_use_same_frozen_model_and_gate: true

gates:
  G0_DATA_CONTRACT:
    exact_input_hashes: true
    unique_trading_dates: true
    finite_positive_etf_open_close: true
    parent_feature_median_identity: true
    no_industry_macro_or_future_feature: true
  G1_NONOVERLAPPING_ORIGINS:
    primary_total_origins_minimum: 225
    initial_training_origins: 80
    prequential_evaluation_origins_minimum: 145
    evaluation_eras: 3
    origins_each_era_minimum: 48
  G2_B1_VS_B0:
    overall_qlike_relative_improvement_strictly_positive: true
    bootstrap_mean_loss_difference_90pct_lower_strictly_positive: true
    minimum_positive_eras: 2
    latest_era_must_improve: true
    failure_state: REJECTED_FROZEN_PRICE_RISK_NOT_FORECASTABLE
  G3_B2_VS_B1:
    overall_qlike_relative_improvement_minimum: 0.02
    log_dsv5_mse_improvement_strictly_positive: true
    bootstrap_mean_loss_difference_90pct_lower_strictly_positive: true
    minimum_positive_eras: 2
    latest_era_must_improve: true
    minimum_positive_registered_offsets: 4
    highest_to_lowest_actual_dsv5_quintile_ratio_minimum: 1.5
    mean_predicted_to_actual_ratio_minimum: 0.80
    mean_predicted_to_actual_ratio_maximum: 1.25
    failure_state: REJECTED_FROZEN_CONSTITUENT_FRAGILITY_INCREMENT

cascade:
  if_g0_or_g1_fails:
    labels: NOT_READ
    B0_B1_B2: NOT_RUN
    portfolio: NOT_ALLOWED
  if_g2_fails:
    B2: NOT_RUN
    macro_extension: NOT_ALLOWED
    portfolio: NOT_ALLOWED
  if_g3_fails:

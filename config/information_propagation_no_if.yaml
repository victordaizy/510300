experiment:
  id: "INFORMATION_PROPAGATION_510300_NO_IF_V1"
  status: "PREREGISTERED_BEFORE_FIRST_FORMAL_SCAN"
  target_asset: "510300.SH"
  purpose: "检验000300与历史点时Top50内部扩散是否领先510300的分钟级条件收益"
  trading_authorization: "RESEARCH_ONLY_NO_AUTOMATIC_ORDER"

data:
  etf_1m: "data/raw/market/510300_1m_tushare_raw.parquet"
  index_1m: "data/raw/market/000300_1m_tushare_raw.parquet"
  component_1m: "data/raw/constituents/minute_1m"
  historical_weights: "data/raw/constituents/000300_historical_weights.parquet"
  top50_breadth_1m: "data/features/top50_breadth_no_if_1m.parquet"
  output_features: "data/features/510300_information_propagation_no_if_1m.parquet"
  output_deciles: "reports/research/information_propagation_no_if_deciles.csv"
  output_yearly_extremes: "reports/research/information_propagation_no_if_yearly_extremes.csv"
  output_primary_test: "reports/research/information_propagation_no_if_primary_test.json"
  readiness_report: "reports/data_quality/information_propagation_no_if_readiness.json"
  timestamp_audit_report: "reports/data_quality/information_propagation_no_if_timestamp_alignment.json"
  breadth_build_report: "reports/data_quality/top50_breadth_no_if_build.json"

parameters:
  lookback_minutes: 3
  breadth_impulse_minutes: 5
  horizons_minutes: [1, 3, 5, 10, 15]
  leader_count: 50
  minimum_component_weight_coverage: 0.80
  beta: 1.0
  normalization_sessions: 20
  normalization_minimum_sessions: 10
  decile_count: 10
  execution_delay_minutes: 1
  minimum_overlapping_sessions: 500

timestamp_audit:
  deterministic_seed: 20260814
  sample_trading_days: 10
  required_anchor_times: ["09:30:00", "11:30:00", "13:01:00", "15:00:00"]
  expected_etf_component_bars_per_day: 241
  manual_semantics_status: "CONFIRMED"
  manual_semantics_note: "510300、000300与成分股均来自同一代理stk_mins字段定义；另以共同时间集合和日线OHLC审计验证"

primary_test:
  signal: "no_if_primary_alpha_score"
  definition: "z(000300过去3分钟相对510300领先) + z(Top50等权上涨Breadth的5分钟Impulse)"
  statistical_outcome: "etf_markout_close_5m"
  executable_outcome: "etf_execution_next_open_5m"
  horizon_minutes: 5
  metrics: ["P1_P10_MONOTONICITY", "SPEARMAN_IC", "P10_MINUS_P1_BPS", "YEAR_DIRECTION_CONSISTENCY"]

secondary_tests:
  horizons_minutes: [1, 3, 10, 15]
  status: "SECONDARY_EXPLORATORY_NO_PARAMETER_SELECTION"

signals:
  - "no_if_primary_alpha_score"
  - "index_lead_etf_3m"
  - "top50_leader_lead_etf_3m"

execution_costs:
  account_cny: 20000
  commission_rate_per_side: 0.0003
  minimum_commission_cny_per_side: 5.0
  base_slippage_bps_per_side: 5.0
  base_round_trip_spread_bps: 2.5
  stress_total_round_trip_cost_bps: 25.0

research_split:
  development: ["2021-08-12", "2024-06-28"]
  validation: ["2024-08-01", "2025-06-30"]
  contaminated_retrospective: ["2025-08-01", "2026-08-11"]
  governance_note: "本实验在首次正式扫描前冻结；既有历史已被其他510300研究触及，因此不宣称严格样本外"

frozen_interpretation:
  target: "全部统计和执行收益只属于510300.SH"
  index_role: "000300.SH仅为领先对照，不是交易标的"
  breadth_name: "Top50Breadth或LargeWeightBreadth，不称沪深300全市场Breadth"
  rejection_rule: "若成本后缺乏单调性、年度方向不稳定或P10-P1不足以覆盖成本，则淘汰，不调整主参数"

protocol:
  project_id: 510300_TREND_LIFECYCLE_ATLAS_V1
  version: 1.0.0
  state: READY_TO_FREEZE_BEFORE_FIRST_NEW_LIFECYCLE_OUTCOME_READ
  registration_date: '2026-08-31'
  timezone: Asia/Shanghai
  research_stage: MECHANISM_DISCOVERY_ONLY
  evidence_class: RETROSPECTIVE_HISTORICALLY_CONTAMINATED_DUAL_LABEL_EVENT_ATLAS
  one_shot: true
  new_lifecycle_outcome_read_before_freeze: false
  strategy_backtest_allowed: false
  parameter_search: forbidden
  threshold_rescue_after_result: forbidden
  window_rescue_after_result: forbidden
  label_rescue_after_result: forbidden
  feature_rescue_after_result: forbidden
  event_deletion_after_result: forbidden
  source_relabel_after_result: forbidden

scope:
  research_question: 市场趋势的开始、延续、衰退和反转能否被市场内部结构提前识别
  label_asset: H00300_TOTAL_RETURN_INDEX
  execution_asset_if_future_strategy_exists: 510300.SH
  allowed_future_holdings: [510300.SH, CASH_CNY]
  internal_states:
    - U0_EARLY_UP
    - U1_BROAD_UPTREND
    - U2_FRAGILE_LATE_UP
    - R_LOW_STRESS_RANGE
    - D0_EARLY_DOWN
    - D1_MARKDOWN_PANIC
    - X_TRANSITION_NO_VIEW
  phase_1_outputs:
    - DUAL_LABEL_EVENT_TABLES
    - SEVEN_STATE_RETROSPECTIVE_REFERENCE_MAP
    - FOUR_MODULE_EVENT_TRAJECTORIES
    - LEADING_SYNCHRONOUS_LAGGING_CLASSIFICATION
    - PHASE_2_ELIGIBILITY_DECISION
  return_backtest_allowed: false
  range_t_backtest_allowed: false
  range_default_action: NO_NEW_TRADE
  portfolio_mapping: disabled
  paper_signal: disabled
  shadow_signal: disabled
  current_signal: NOT_CREATED
  order_generation: false
  broker_connection: false
  position_change: false
  live_trading_authorized: false

upstream_boundaries:
  three_state_router:
    project_id: 510300_THREE_STATE_TREND_ROUTER_V1
    required_status: REJECTED_FROZEN_THREE_STATE_TREND_ROUTER_TARGET_OR_STATE_GATE_FAILED_NO_RESCUE
    result_path: reports/research/510300_three_state_trend_router_v1_0_1_result.json
    allowed_reuse: 无
    forbidden_reuse: ADX周期、25/20阈值、三态映射、组合收益或参数营救
  regime_transition_router:
    project_id: 510300_REGIME_TRANSITION_ROUTER_V1
    required_status: REJECTED_FROZEN_STATE_IDENTIFIABILITY_GATE_FAILED_NO_PHASE_2_NO_RESCUE
    result_path: reports/research/510300_regime_transition_router_v1.json
    allowed_reuse: 原始数据合同与因果计算方法
    forbidden_reuse: 旧状态、阈值、仓位、收益或改名营救
  stress_atlas:
    project_id: 510300_STRESS_TRANSMISSION_AND_EXHAUSTION_ATLAS_V1
    required_status: EXPLANATORY_ONLY_SYNCHRONOUS_OR_LAGGING_NO_STRATEGY_PROMOTION_NO_RESCUE
    result_path: reports/research/510300_stress_transmission_and_exhaustion_atlas_v1.json
    allowed_reuse: 事件等权、删失和领先时差语义
    forbidden_reuse: 将旧压力事件、旧阈值或旧模型结果解释为本图谱证据
  rejected_range_t:
    policy: RANGE_T_BRANCH_NOT_RESCUED
    required_action_in_v1: NO_NEW_TRADE
  pcf_iopv:
    policy: EXECUTION_QUALITY_ONLY_NOT_TREND_FACTOR

clocks:
  h00300_and_component_close: T日收盘后
  cgb_curve: 曲线日期T日17:30后
  unified_feature_timestamp: T日18:00后
  earliest_hypothetical_execution: T+1交易日开盘
  future_labels: 与点时特征面板物理分离，不得进入特征或参考状态的点时输入
  historical_weight_snapshot_rule: 仅使用snapshot_date不晚于T日的最近月度快照
  historical_weight_provenance_limit: 逐期同期官方归档缺失，不得称严格点时官方权重

dates:
  label_history_start: '2013-12-02'
  feature_history_start: '2019-12-23'
  evaluation_start: '2020-06-23'
  signal_cutoff: '2026-08-12'
  label_market_cutoff: '2026-08-14'
  early_period: ['2020-06-23', '2022-12-30']
  late_period: ['2023-01-03', '2026-08-12']

inputs:
  h00300_total_return:
    path: data/raw/all_etf_momentum_v1/H00300_total_return.parquet
    required_columns: [date, symbol, name, close, source]
    required_symbol: H00300
  etf_market:
    path: data/raw/r6/510300_daily.parquet
    required_columns: [date, open, high, low, close, volume, amount, symbol]
    required_symbol: 510300.SH
  component_cross_section:
    path: data/features/000300_point_in_time_index_cross_section_daily_v1_3.parquet
    required_columns: [date, index_code, con_code, snapshot_weight, weight_source, weight_snapshot_date, constituent_total_return_close, constituent_return_1d, is_suspended, industry_l1, price_available, return_available, industry_available, component_return_contribution_1d]
  industry_daily:
    path: data/features/000300_industry_driver_attribution_daily_v1_3.parquet
    required_columns: [date, weight_snapshot_date, industry_l1, industry_weight, return_coverage_weight, industry_return_1d, weighted_return_contribution_1d, industry_advancer_share_1d, component_count, return_component_count]
  index_driver_status:
    path: reports/data_quality/000300_index_driver_attribution_v1_3_status.json
    required_status: PASS_ATTRIBUTION_ONLY_WITH_NO_VIEW_DAYS
  membership_weight_evidence:
    path: reports/data_quality/csi300_point_in_time_membership_evidence_20260819.json
    required_status: BLOCKED_POINT_IN_TIME_MEMBERSHIP
    required_weight_official_verified_count: 0
  cgb_curve:
    path: data/raw/regime_transition_router_v1/cgb_curve/cgb_1y_10y_daily_2012_2026.parquet
    required_columns: [date, cgb_1y, cgb_10y, source, retrieved_at, available_at_rule]
  cgb_audit:
    path: reports/data_quality/510300_regime_transition_router_v1_cgb.json
    required_status: PASS_CGB_LONG_HISTORY_ACQUISITION
  three_state_result:
    path: reports/research/510300_three_state_trend_router_v1_0_1_result.json
  regime_router_result:
    path: reports/research/510300_regime_transition_router_v1.json
  stress_atlas_result:
    path: reports/research/510300_stress_transmission_and_exhaustion_atlas_v1.json

data_gates:
  expected_cross_section_rows_per_date: 300
  minimum_weight_sum: 0.9998
  maximum_weight_sum: 1.0002
  maximum_weight_snapshot_age_calendar_days: 35
  minimum_price_coverage_weight: 0.95
  minimum_return_coverage_weight: 0.95
  minimum_industry_coverage_weight: 0.95
  minimum_valid_component_count_for_correlation: 200
  future_weight_snapshot_rows_allowed: 0
  duplicate_policy: REJECT
  missing_feature_output: NO_VIEW
  current_constituent_history_backfill: forbidden
  future_weight_snapshot_backfill: forbidden
  current_industry_snapshot_backfill: forbidden
  source_provenance_gate_for_phase_2: false

label_a_directional_change:
  name: VOLATILITY_STANDARDIZED_DIRECTIONAL_CHANGE
  volatility_lookback_rows: 60
  minimum_volatility_rows: 40
  reference_horizon_rows: 20
  sigma_multiplier: 1.25
  minimum_log_threshold: 0.06
  maximum_log_threshold: 0.18
  threshold_uses_current_or_future_return: false
  event_date: 事后确认方向变化前的局部极值日
  event_types: [UP_START, UP_END, DOWN_START, DOWN_END]
  event_weighting: ONE_EVENT_ONE_WEIGHT

label_b_future_path:
  name: FUTURE_20D_60D_PATH
  volatility_lookback_rows: 60
  minimum_volatility_rows: 40
  horizons_trading_days: [20, 60]
  sustained_up:
    minimum_z20: 0.75
    minimum_z60: 1.25
    minimum_signed_efficiency60: 0.25
    minimum_mfe_to_mae_ratio: 1.50
  sustained_down:
    maximum_z20: -0.75
    maximum_z60: -1.25
    maximum_signed_efficiency60: -0.25
    minimum_mae_to_mfe_ratio: 1.50
  low_trend_range:
    maximum_absolute_z20: 0.75
    maximum_absolute_z60: 1.00
    maximum_absolute_signed_efficiency60: 0.20
  minimum_episode_rows: 5
  maximum_internal_gap_rows: 2
  same_transition_cooldown_rows: 20
  incomplete_horizon_label: CENSORED_FUTURE_60D
  unmatched_label: MIXED_TRANSITION

feature_construction:
  component_windows: [20, 60, 120]
  minimum_window_fraction: 0.80
  contribution_window_rows: 20
  correlation_window_rows: 20
  correlation_minimum_complete_rows: 15
  extreme_down_return_threshold: -0.03
  breadth_change_rows: 5
  industry_path_rows: 20
  downside_short_ewm_span: 5
  downside_long_ewm_span: 20
  causal_percentile_prior_rows: 252
  causal_percentile_minimum_prior_rows: 126
  cgb_change_rows: 63
  cgb_percentile_prior_rows: 504
  cgb_percentile_minimum_prior_rows: 252
  feature_modules:
    PRICE_ACCEPTANCE:
      - price_trend_z20
      - price_trend_z60
      - price_trend_z120
      - signed_efficiency20
      - signed_efficiency60
      - drawdown60
      - breakout_acceptance5_60
    PARTICIPATION_BREADTH:
      - breadth_above_ma20_snapshot_weighted
      - breadth_above_ma60_snapshot_weighted
      - breadth_above_ma120_snapshot_weighted
      - breadth_above_ma20_equal_weighted
      - breadth_above_ma60_equal_weighted
      - breadth_above_ma120_equal_weighted
      - breadth_diffusion5
      - new_high_minus_new_low60
      - industry_positive_weight20
    STRESS_LIQUIDITY:
      - contribution_hhi20
      - average_pairwise_correlation20
      - downside_vol_ratio5_20
      - extreme_down_weight
      - liquidity_impact_pressure
    SLOW_PRIOR:
      - cgb_10y_change63_pressure
  phase_2_candidate_feature_cap: 15
  unavailable_slow_features:
    earnings_revision_breadth: NO_VIEW_INCOMPLETE_POINT_IN_TIME_CONTRACT
    point_in_time_macro_revision_vintage: NO_VIEW_INCOMPLETE_POINT_IN_TIME_CONTRACT

expected_directions:
  trend_like_features:
    features: [price_trend_z20, price_trend_z60, price_trend_z120, signed_efficiency20, signed_efficiency60, drawdown60, breakout_acceptance5_60, breadth_above_ma20_snapshot_weighted, breadth_above_ma60_snapshot_weighted, breadth_above_ma120_snapshot_weighted, breadth_above_ma20_equal_weighted, breadth_above_ma60_equal_weighted, breadth_above_ma120_equal_weighted, breadth_diffusion5, new_high_minus_new_low60, industry_positive_weight20]
    UP_START: positive
    UP_END: negative
    DOWN_START: negative
    DOWN_END: positive
  stress_like_features:
    features: [contribution_hhi20, average_pairwise_correlation20, downside_vol_ratio5_20, extreme_down_weight, liquidity_impact_pressure, cgb_10y_change63_pressure]
    UP_START: negative
    UP_END: positive
    DOWN_START: positive
    DOWN_END: negative

event_alignment:
  full_window_start: -120
  full_window_end: 60
  baseline_window: [-120, -61]
  leading_search_window: [-60, -5]
  pre_event_window: [-20, -1]
  event_window: [0, 0]
  post_event_windows:
    POST_1_20: [1, 20]
    POST_21_60: [21, 60]
  robust_scale: 1.4826_X_EVENT_BASELINE_MAD
  minimum_baseline_observations: 30
  onset_z_threshold: 0.50
  onset_consecutive_rows: 5
  event_periods_to_report: [-120, -60, -20, 0, 20, 60]

leading_gates:
  minimum_events_per_label_transition: 6
  minimum_feature_event_observations: 6
  minimum_direction_fraction: 0.65
  maximum_one_sided_sign_pvalue: 0.10
  minimum_absolute_median_pre_event_z: 0.50
  latest_allowed_median_onset_relative_day: -5
  maximum_single_event_absolute_share: 0.50
  early_late_direction_must_agree_when_each_has_at_least: 3
  required_dual_label_transitions: [UP_START, UP_END, DOWN_START]
  minimum_dual_label_features_per_transition: 2
  minimum_distinct_modules_per_transition: 2
  snapshot_weight_feature_requires_equal_weight_sensitivity: true

reference_state_map:
  U0_EARLY_UP:
    anchor: UP_START
    relative_window: [0, 20]
  U2_FRAGILE_LATE_UP:
    anchor: UP_END
    relative_window: [-20, 0]
  D0_EARLY_DOWN:
    anchor: DOWN_START
    relative_window: [0, 10]
  D1_MARKDOWN_PANIC:
    anchor: DOWN_START
    relative_window: [11, 60]
    pressure_percentile_at_least: 0.70
  R_LOW_STRESS_RANGE:
    label_b_state: LOW_TREND_RANGE
    pressure_percentile_at_most: 0.60
  U1_BROAD_UPTREND:
    label_b_state: SUSTAINED_UP
    breadth_above_ma60_at_least: 0.55
    downside_vol_ratio_below: 1.00
  fallback_state: X_TRANSITION_NO_VIEW
  semantics: RETROSPECTIVE_REFERENCE_ONLY_NOT_A_POINT_IN_TIME_SIGNAL

adjudication:
  if_data_gate_fails: NO_VIEW_TREND_LIFECYCLE_ATLAS_DATA_CONTRACT_FAILED
  if_structure_fails: ATLAS_COMPLETE_NO_DUAL_LABEL_LEADING_STRUCTURE_NO_ROUTER_PROMOTION_NO_RESCUE
  if_structure_passes_but_source_fails: ATLAS_STRUCTURE_FOUND_SOURCE_PROVENANCE_BLOCKED_NO_ROUTER_FREEZE
  if_structure_and_source_pass: ATLAS_DUAL_LABEL_STRUCTURE_PASS_PHASE_2_PROTOCOL_FREEZE_ELIGIBLE
  return_evaluation: NOT_ALLOWED_PHASE_1_EVENT_LABEL_DIAGNOSTICS_ONLY
  strategy_backtest: NOT_RUN
  net_sharpe: NOT_COMPUTED
  up_capture: NOT_COMPUTED
  down_capture: NOT_COMPUTED
  turning_point_delay: NOT_COMPUTED
  range_t_net_edge: NOT_COMPUTED

paths:
  spec: docs/510300_TREND_LIFECYCLE_ATLAS_V1_SPEC.md
  manifest: config/510300_trend_lifecycle_atlas_v1_manifest.json
  freeze_receipt: reports/frozen/510300_trend_lifecycle_atlas_v1_freeze_receipt.json
  input_audit: reports/data_quality/510300_trend_lifecycle_atlas_v1_input_audit.json
  feature_panel: data/research/510300_trend_lifecycle_atlas_v1/feature_panel.parquet
  outcome_label_panel: data/research/510300_trend_lifecycle_atlas_v1/outcome_label_panel.parquet
  label_a_events: data/research/510300_trend_lifecycle_atlas_v1/label_a_events.csv
  label_b_events: data/research/510300_trend_lifecycle_atlas_v1/label_b_events.csv
  event_catalog: data/research/510300_trend_lifecycle_atlas_v1/event_catalog.csv
  event_trajectories: data/research/510300_trend_lifecycle_atlas_v1/event_trajectories.parquet
  trajectory_summary: data/research/510300_trend_lifecycle_atlas_v1/trajectory_summary.csv
  leading_results: data/research/510300_trend_lifecycle_atlas_v1/leading_results.csv
  dual_label_candidates: data/research/510300_trend_lifecycle_atlas_v1/dual_label_candidates.csv
  lifecycle_reference_panel: data/research/510300_trend_lifecycle_atlas_v1/lifecycle_reference_panel.parquet
  result_json: reports/research/510300_trend_lifecycle_atlas_v1.json
  result_markdown: reports/research/510300_TREND_LIFECYCLE_ATLAS_V1.md
  output_audit_json: reports/audit/510300_trend_lifecycle_atlas_v1_output_audit.json
  output_audit_markdown: reports/audit/510300_TREND_LIFECYCLE_ATLAS_V1_OUTPUT_AUDIT.md
  program_failure_json: reports/audit/510300_trend_lifecycle_atlas_v1_program_failure.json

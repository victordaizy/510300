protocol:
  project_id: "CSI300_SMALL_ACCOUNT_ALPHA_V2"
  version: "2.0.0"
  protocol_date: "2026-08-18"
  state: "RETROSPECTIVE_RESCALING_ONLY"
  parent_strategy: "CSI300_REGIME_DUAL_SLEEVE_ALPHA_V1"
  historical_contamination_cutoff: "2026-08-12"
  true_forward_start: "2026-08-13"
  benchmark: "H00300沪深300全收益指数"
  acceptance_metric: "策略几何年化收益率减基准几何年化收益率"
  acceptance_minimum: 0.20

inputs:
  constituent_member_panel: "data/raw/constituents/000300_constituent_daily.parquet"
  component_history_cache: "data/raw/constituents/.tushare_stock_history_cache"
  index_daily: "data/raw/market/000300_daily_feature_warmup.parquet"
  benchmark_total_return: "data/raw/market/H00300_total_return_daily_raw.parquet"
  breadth: "data/features/000300_equal_weight_breadth_daily.parquet"
  parent_implementation: "backtest/run_final_alpha_strategy.py"

schedule:
  start_date: "2021-08-12"
  end_date: "2026-08-14"
  rebalance_every_trading_days: 10
  signal_time: "t日收盘后"
  execution_time: "t+1交易日开盘"

universe:
  point_in_time_members_only: true
  minimum_20d_average_amount_cny: 50000000
  exclude_suspended_on_signal: true
  maximum_open_total_return_gap_for_trade: 0.095

factor_budget:
  maximum: 10
  used: 8
  factors:
    - "个股20日动量"
    - "个股60日动量"
    - "个股120日动量"
    - "个股20日波动率"
    - "个股60日波动率"
    - "个股60日回撤位置"
    - "指数相对MA120趋势"
    - "成分股站上MA60广度"

selection:
  holdings: 3
  bull_when_all:
    index_close_above_ma120: true
    index_return_20d_above: 0.0
    breadth_above_ma60_above: 0.50
  bull_score: "0.50*Rank(MOM60)+0.30*Rank(MOM20)+0.20*Rank(DD60)"
  defensive_score: "0.60*(1-Rank(VOL60))+0.20*(1-Rank(VOL20))+0.20*Rank(DD60)"
  parameter_search_allowed: false

account:
  initial_cash_cny: 20000
  maximum_positions: 3
  minimum_trade_notional_cny: 5000
  lot_size: 100
  cash_annual_rate: 0.015
  long_only: true
  leverage_allowed: false
  retained_target_position_not_rebalanced: true
  subminimum_exit_action: "继续持有，直到整仓卖出金额达到5000元"

costs:
  commission_rate: 0.0003
  minimum_commission_cny: 5.0
  stamp_duty_sell_rate: 0.0005
  stamp_duty_sell_rate_before_reduction: 0.001
  stamp_duty_reduction_effective_date: "2023-08-28"
  base_slippage_bps_per_leg: 5.0
  stress_slippage_bps_per_leg: 15.0

governance:
  historical_result_label: "HISTORICALLY_CONTAMINATED_RETROSPECTIVE"
  strict_holdout_available: false
  historical_pass_may_authorize_live: false
  paper_signal_enabled: false
  position_mapping_enabled: false
  order_generation_enabled: false
  broker_connection_enabled: false
  live_trading_authorized: false

outputs:
  base_ledger: "data/processed/csi300_small_account_alpha_v2/base_ledger.parquet"
  base_trades: "data/processed/csi300_small_account_alpha_v2/base_trades.parquet"
  stress_ledger: "data/processed/csi300_small_account_alpha_v2/stress_ledger.parquet"
  stress_trades: "data/processed/csi300_small_account_alpha_v2/stress_trades.parquet"
  result_json: "reports/backtest/csi300_small_account_alpha_v2.json"
  result_markdown: "reports/backtest/csi300_small_account_alpha_v2.md"


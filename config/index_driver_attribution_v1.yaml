protocol:
  project_id: "510300_INDEX_DRIVER_ATTRIBUTION_V1"
  version: "1.0.0"
  state: "ATTRIBUTION_ONLY"
  data_start: "2019-12-23"
  data_cutoff: "2026-08-14"
  timezone: "Asia/Shanghai"

scope:
  potential_trading_symbol: "510300.SH"
  attribution_index: "000300.SH"
  constituent_trading_authorized: false
  sector_fund_trading_authorized: false
  derivatives_authorized: false

inputs:
  weights:
    path: "data/raw/constituents/000300_historical_weights.parquet"
    required_columns: ["index_code", "con_code", "trade_date", "weight", "source"]
    unit: "percent"
    asof_rule: "trade_date不晚于归因日的最新快照"
  constituent_daily:
    path: "data/raw/constituents/000300_constituent_daily.parquet"
    required_columns: ["date", "con_code", "total_return_close", "is_suspended"]
    return_rule: "只有证券记录日期在全局交易日序列相邻时才计算一日总收益"
  industry_intervals:
    path: "data/raw/reference/a_share_citic_industry_point_in_time.parquet"
    required_columns: ["con_code", "industry_l1", "in_date", "out_date", "classification_usage", "source"]
    taxonomy: "CITIC_L1_POINT_IN_TIME"
    interval_rule: "in_date <= date < out_date；out_date为空表示持续有效"
    fallback_taxonomy: null
    current_snapshot_backfill_allowed: false

quality_gates:
  member_count_minimum: 300
  member_count_maximum: 300
  weight_sum_percent_range: [98.0, 102.0]
  maximum_weight_snapshot_age_calendar_days: 45
  minimum_price_coverage_weight: 0.99
  minimum_return_coverage_weight: 0.95
  minimum_industry_coverage_weight: 0.95
  maximum_contribution_identity_absolute_error: 1.0e-12
  duplicate_security_date_count: 0
  duplicate_active_industry_count: 0

outputs:
  cross_section_path: "data/features/000300_point_in_time_index_cross_section_daily.parquet"
  industry_path: "data/features/000300_industry_driver_attribution_daily.parquet"
  daily_summary_path: "data/features/000300_index_driver_summary_daily.parquet"
  status_json_path: "reports/data_quality/000300_index_driver_attribution_status.json"
  status_markdown_path: "reports/data_quality/000300_index_driver_attribution_status.md"

semantics:
  component_contribution: "snapshot_weight_decimal * constituent_total_return_1d"
  industry_contribution: "同一行业有效成分贡献之和"
  driver: "当日快照加权贡献最大的一级行业；不是未来预测"
  no_view: "数据门槛失败；不得解释为看空或交易动作"
  official_index_return_claim_allowed: false

governance:
  future_return_targets_defined: false
  future_return_reading_allowed: false
  predictive_threshold_search_allowed: false
  position_mapping_enabled: false
  order_generation_enabled: false
  broker_connection_enabled: false
  live_trading_authorized: false
  missing_input_output: "NO_VIEW"

protocol:
  study_id: "510300_BINARY_STATE_FEASIBILITY_V1"
  version: "1.0.0"
  state: "PREFREEZE_IMPLEMENTATION_COMPLETE"
  historical_evidence_label: "HISTORICALLY_CONTAMINATED_PERFECT_FORESIGHT_DIAGNOSTIC_ONLY"
  historical_cutoff: "2026-08-14"
  purpose: "量化只允许满仓或空仓时，达到相对H00300年化净超额20个百分点所需的择时精度"
  is_strategy_candidate: false
  is_trading_signal: false
  live_trading_authorized: false

scope:
  execution_asset: "510300.SH"
  allowed_holdings: ["510300.SH", "CASH_CNY"]
  allowed_target_states: [0, 1]
  initial_capital_cny: 500000.0
  long_only: true
  leverage_allowed: false
  short_selling_allowed: false
  derivatives_allowed: false
  signal_time: "T日收盘后"
  execution_time: "T+1交易日开盘"
  full_state_reinvests_paid_cash_dividends: true

objective:
  benchmark_id: "H00300"
  benchmark_return_type: "TOTAL_RETURN"
  primary_metric: "STRATEGY_NET_CAGR_MINUS_H00300_TOTAL_RETURN_CAGR"
  annualization_trading_days: 242
  minimum_annualized_excess: 0.20
  rolling_window_trading_days: 242
  minimum_rolling_excess_median: 0.20

costs:
  commission_rate_per_leg: 0.0001
  minimum_commission_cny_per_leg: 0.0
  base_slippage_bps_per_leg: 5.0
  stress_slippage_bps_per_leg: 15.0
  cash_annual_rate: 0.015
  lot_size_shares: 100

data_contracts:
  etf_market:
    file: "data/raw/r6/510300_daily.parquet"
    required_rows: 3456
    required_first_date: "2012-05-28"
    required_last_date: "2026-08-14"
    required_symbol: "510300.SH"
    required_columns: ["date", "open", "high", "low", "close", "volume", "amount", "symbol"]
  benchmark_total_return:
    file: "data/raw/r6/H00300_total_return_daily.parquet"
    required_rows: 3457
    required_first_date: "2012-05-28"
    required_last_date: "2026-08-14"
    required_symbol: "H00300"
    required_columns: ["date", "close", "symbol"]
    allowed_non_execution_dates: ["2018-06-18"]
  cash_distributions:
    file: "data/reference/510300_dividends.csv"
    required_event_count: 14
    required_first_ex_date: "2012-12-18"
    required_last_ex_date: "2026-01-19"
    required_columns: ["symbol", "record_date", "ex_date", "payment_date", "cash_dividend_per_share", "source"]

oracle_frontier:
  block_horizons_trading_days: [1, 5, 20, 60, 121, 242]
  evaluate_all_calendar_offsets: true
  final_incomplete_block_policy: "EXCLUDE"
  block_label: "FULL当且仅当从块首日开盘到块末日收盘的510300含分红毛终值高于同期现金终值"
  label_ignores_costs_but_realized_path_charges_costs: true
  accuracy_frontier:
    canonical_horizon_trading_days: 20
    bad_block_recall_grid: [0.50, 0.60, 0.70, 0.80, 0.90, 1.00]
    false_exit_rate_grid: [0.00, 0.10, 0.20]
    repetitions: 50
    random_seed: 20260827
    cost_scenario: "STRESS"

artifacts:
  report_json: "reports/research/510300_binary_state_feasibility_v1.json"
  report_markdown: "reports/research/510300_BINARY_STATE_FEASIBILITY_V1.md"
  output_directory: "data/research/510300_binary_state_feasibility_v1"
  offset_results_parquet: "data/research/510300_binary_state_feasibility_v1/oracle_offset_results.parquet"
  accuracy_frontier_parquet: "data/research/510300_binary_state_feasibility_v1/accuracy_frontier.parquet"
  canonical_block_labels_parquet: "data/research/510300_binary_state_feasibility_v1/canonical_20d_block_labels.parquet"


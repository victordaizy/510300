protocol:
  project_id: 510300_CAUSAL_GAUSSIAN_HMM_REGIME_ROUTER_V1
  version: 1.0.0
  state: READY_TO_PREFIT_ON_PRE_2015_DATA_THEN_FREEZE
  registration_date: '2026-08-31'
  timezone: Asia/Shanghai
  evidence_class: RETROSPECTIVE_HISTORICALLY_CONTAMINATED_ONE_SHOT_STATE_TRANSITION_STRATEGY
  one_shot: true
  candidate_2015_plus_states_read_before_freeze: false
  candidate_2015_plus_outcomes_read_before_freeze: false
  candidate_portfolio_returns_read_before_freeze: false
  parameter_rescue_after_result: forbidden
  threshold_rescue_after_result: forbidden
  window_rescue_after_result: forbidden
  feature_rescue_after_result: forbidden
  state_label_rescue_after_result: forbidden
  range_policy_rescue_after_result: forbidden
  direction_reversal_after_result: forbidden
  combination_with_rejected_candidates_after_result: forbidden

objective:
  description: 预测下一市场阶段，并在上涨阶段满仓510300、下跌阶段空仓、震荡或不确定阶段不交易
  target_net_sharpe: 1.20
  target_interpretation: 历史基准成本与压力成本均通过后仍需独立前向验证

scope:
  execution_asset: 510300.SH
  signal_asset: 000300.SH_PRICE_INDEX
  allowed_holdings: [510300.SH, CASH_CNY]
  long_only: true
  leverage_allowed: false
  short_selling_allowed: false
  derivatives_execution_allowed: false
  live_trading_authorized: false

clocks:
  feature_information_time: T日收盘后
  posterior_information_set: 不晚于T日收盘的000300价格数据
  next_state_forecast: FILTERED_POSTERIOR_AT_T_MULTIPLIED_BY_FROZEN_TRANSITION_MATRIX
  earliest_execution_time: T加1交易日开盘
  signal_calendar: 510300交易日
  future_information_in_feature_or_state: forbidden

dates:
  raw_feature_warmup_start: '2012-05-28'
  first_valid_feature_date: '2012-06-26'
  training_start: '2012-06-26'
  training_end: '2014-12-31'
  evaluation_start: '2015-01-05'
  evaluation_end: '2026-08-14'
  early_period: ['2015-01-05', '2020-12-31']
  late_period: ['2021-01-04', '2026-08-14']

inputs:
  etf_daily:
    path: data/raw/r6/510300_daily.parquet
    sha256: 842528e66948899c28bca26b1c07e4ee03406ede7b25690a5204da8e61980979
    required_rows: 3456
    required_first_date: '2012-05-28'
    required_last_date: '2026-08-14'
    required_columns: [date, open, high, low, close, symbol]
    required_symbol: 510300.SH
  index_daily:
    path: data/raw/r6/000300_daily.parquet
    sha256: b94823b0f3abf79371da9664ce64524212e3854c46f477ba0ace0d42e68757d1
    required_rows: 3456
    required_first_date: '2012-05-28'
    required_last_date: '2026-08-14'
    required_columns: [date, open, high, low, close, symbol]
    required_symbol: 000300.SH
  benchmark_total_return:
    path: data/raw/r6/H00300_total_return_daily.parquet
    sha256: 2846746e1ae199cfae736655b29d90adeb7ca7ba339c04e87b46b98431f09961
    required_rows: 3457
    required_first_date: '2012-05-28'
    required_last_date: '2026-08-14'
    required_columns: [date, close, symbol]
    required_symbol: H00300
    allowed_extra_dates: ['2018-06-18']
  dividends:
    path: data/reference/510300_dividends.csv
    sha256: a96afe27e62bdd7d60485c2ebb44f2ff7e5010dca1f5cae5dc2441e53b7ae06d
    required_rows: 14
    required_first_ex_date: '2012-12-18'

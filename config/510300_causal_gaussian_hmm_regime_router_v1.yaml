  input_audit:
    path: reports/data_quality/510300_causal_gaussian_hmm_regime_router_v1_inputs.json
    required_status: PASS_PREFREEZE_CAUSAL_HMM_MODEL_AND_DAILY_INPUTS_RANGE_T_NOT_ALLOWED
  backtest_engine:
    path: backtest/engine.py
    sha256: 3d6cee6c0424d1f170883bbaff702a9a922927b0b749a982699868b7c44956fc

data_contract:
  expected_training_feature_rows: 613
  expected_evaluation_rows: 2823
  execution_and_signal_dates_must_match: true
  duplicate_dates_allowed: false
  missing_ohlc_allowed: false
  nonpositive_prices_allowed: false
  dividend_history_required: true

features:
  source_price: 000300_PRICE_INDEX_CLOSE
  definitions:
    - name: LOG_RETURN_5D_PER_SQRT_DAY
      formula: LOG(CLOSE_T_DIV_CLOSE_T_MINUS_5)_DIV_SQRT_5
    - name: LOG_RETURN_20D_PER_SQRT_DAY
      formula: LOG(CLOSE_T_DIV_CLOSE_T_MINUS_20)_DIV_SQRT_20
    - name: LOG_ANNUALIZED_REALIZED_VOLATILITY_20D
      formula: LOG(SQRT(MEAN(DAILY_LOG_RETURN_SQUARED,20))*SQRT(242))
  missing_policy: DROP_ONLY_FEATURE_WARMUP_ROWS
  standardization: TRAINING_2012_06_26_TO_2014_12_31_POPULATION_MEAN_AND_STD_ONLY
  standard_deviation_ddof: 0

hidden_markov_model:
  frozen_model_path: config/510300_causal_gaussian_hmm_regime_router_v1_model.json
  model_family: DIAGONAL_GAUSSIAN_HMM
  latent_state_count: 3
  initialization: KMEANS_ON_STANDARDIZED_TRAINING_FEATURES
  kmeans_n_init: 20
  random_state: 20260831
  expectation_maximization_max_iterations: 200
  convergence_tolerance: 0.0000001
  variance_floor: 0.0001
  transition_pseudocount: 0.001
  probability_floor: 0.000000000001
  fit_data_end_must_not_exceed: '2014-12-31'
  state_label_rule: SORT_FROZEN_RAW_EMISSION_MEAN_OF_LOG_RETURN_20D_LOW_BEAR_MIDDLE_RANGE_HIGH_BULL
  minimum_effective_training_mass_per_latent_state: 0.05
  model_selection_or_hyperparameter_search: forbidden

decision_rule:
  probability_source: ONE_STEP_AHEAD_NEXT_STATE_PROBABILITY
  majority_threshold: 0.50
  bull_rule: BULL_PROBABILITY_AT_LEAST_0_50_AND_STRICTLY_LARGEST
  bear_rule: BEAR_PROBABILITY_AT_LEAST_0_50_AND_STRICTLY_LARGEST
  fallback_rule: RANGE_OR_UNCONFIRMED
  tie_rule: RANGE_OR_UNCONFIRMED
  initial_evaluation_posterior: FROZEN_FILTERED_POSTERIOR_AT_2014_12_31

states:
  BULL_TREND:
    target_position: 1.0
    interpretation: 下一阶段上涨概率过半且最高，持有可买整手范围内最大510300仓位
  BEAR_TREND:
    target_position: 0.0
    interpretation: 下一阶段下跌概率过半且最高，持有人民币现金
  RANGE_OR_UNCONFIRMED:
    target_position: 0.0
    interpretation: 下一阶段震荡或方向概率不过半，本版本不交易

range_policy:
  historical_policy: NO_TRADE
  range_t_backtest_allowed: false
  reason_codes:
    - STOCK_ETF_T_PLUS_ONE_NO_NEW_BUY_THEN_SAME_DAY_SELL
    - COMPLETE_2015_TO_2026_INTRADAY_DATA_NOT_AVAILABLE
    - EXISTING_2021_PLUS_INTRADAY_FAMILY_ALREADY_REJECTED_NO_RESCUE
  official_rule_sources:
    - https://www.sse.com.cn/lawandrules/sselawsrules2025/stocks/exchange/c/c_20260424_10816482.shtml
    - https://etf.sse.com.cn/fund/quertion/
  observed_intraday_data:
    path: data/raw/market/510300_15m_from_1m_raw.parquet
    sha256: 5d8aabfb5241aed3fc4c5078fc627ef5f9fe9a7f69850f0e1127ff209f0be1a1
    first_date: '2021-08-12'
    last_date: '2026-08-12'
    rows: 19376
    trading_days: 1211
  source_quality_receipt:
    path: reports/data_quality/510300_15m_from_1m_quality.json
    sha256: e7fc50490e038273dbdf205d64688f85838ab1c16d0d6871c01ed4f9dcc95e26
    required_status: PASS_WITH_SOURCE_CAVEATS
  existing_intraday_family_result:
    path: reports/research/510300_intraday_binary_livermore_screen_v1.json
    required_status: REJECTED_FIXED_INTRADAY_FAMILY_NO_RESCUE
  required_intraday_start_for_historical_t: '2015-01-05'
  required_intraday_end_for_historical_t: '2026-08-14'

mechanism_evaluation:
  forward_horizons_trading_days: [5, 20, 60]
  primary_horizon_trading_days: 20
  minimum_state_days:
    BULL_TREND: 200
    BEAR_TREND: 100
    RANGE_OR_UNCONFIRMED: 200
  minimum_state_episodes:
    BULL_TREND: 8
    BEAR_TREND: 5
  full_sample_required_order: BULL_MEAN_GT_RANGE_MEAN_GT_BEAR_MEAN
  early_and_late_both_require_order: true
  positive_rate_required_order: BULL_GT_RANGE_GT_BEAR
  pass_requires_all_gates: true

portfolio:
  initial_capital_cny: 20000.0
  lot_size_shares: 100
  cash_annual_rate: 0.0
  base_costs:
    commission_rate_per_leg: 0.0003

protocol:
  project_id: "NORMALIZED_VALUATION_5Y_MODELS_V1"
  version: "1.0.0"
  freeze_date: "2026-08-19"
  timezone: "Asia/Shanghai"
  state: "RESEARCH_ONLY_SIGNAL_INPUT_FREEZE_HISTORICALLY_CONTAMINATED"
  return_calculation_enabled: false
  ic_calculation_enabled: false
  position_mapping_enabled: false
  order_generation_enabled: false
  broker_connection_enabled: false

shared_signal_definition:
  index: "000300.SH"
  snapshot_frequency: "MONTHLY_OFFICIAL_WEIGHT_DATE"
  snapshot_start: "2016-08-31"
  snapshot_end: "2026-07-31"
  expected_snapshot_count: 120
  expected_constituents_per_snapshot: 300
  financial_vintage_rule: "每个报告期只取available_at不晚于快照日的最新已知版本"
  price_rule: "LAST_UNADJUSTED_CLOSE_AT_OR_BEFORE_SNAPSHOT"
  normalization_lookback_years: 3
  normalization_minimum_ttm_observations: 4
  normalized_profit_formula: "三年窗口内正TTM归母利润中位数，与当前TTM收入乘三年TTM净利率中位数等权；单项有效时使用该项"
  total_shares_rule: "截至所选报告期最新非空且大于零的总股本"
  company_normalized_ey_formula: "normalized_profit_cny / total_shares / raw_close"
  index_aggregation_rule: "VALID_WEIGHT_RENORMALIZED_OFFICIAL_WEIGHT_MEAN"
  minimum_price_weight_coverage: 0.99
  minimum_normalized_earnings_weight_coverage: 0.90
  industry_labels_used: false
  parameter_search_enabled: false

percentile_definition:
  window_months: 60
  include_current_observation: true
  minimum_observations: 60
  algorithm: "EXACT_EMPIRICAL_MIDRANK"
  formula: "(count(window_value < current_value) + 0.5 * count(window_value == current_value)) / 60"
  comparison_precision: "FLOAT64_EXACT_NO_ROUNDING_BEFORE_RANK"
  missing_window_rule: "NO_SIGNAL_UNTIL_ALL_60_MONTHS_PASS"
  expected_first_ready_observation_date: "2021-07-30"
  expected_first_earliest_execution_date: "2021-08-02"
  expected_ready_observation_count: 61

availability_and_execution:
  information_cutoff: "SNAPSHOT_DATE_CLOSE"
  earliest_execution_rule: "NEXT_INDEX_TRADING_DAY_OPEN"
  review_frequency: "MONTHLY_SNAPSHOT"
  carry_rule_between_reviews: "CANDIDATE_ONLY_NOT_APPLIED_IN_SIGNAL_STAGE"

models:
  VAL01_NORM_EY_5Y_V1:
    registered_trial_id: "VAL01_NORM_EY_5Y"
    predictor_source_column: "weighted_normalized_earnings_yield"
    predictor_percentile_column: "norm_ey_percentile_60m"
    formula: "EY_norm_t"
    expected_direction: "HIGHER_PERCENTILE_HIGHER_FORWARD_RETURN"
    bond_input_used: false
    candidate_mapping:
      - {lower_inclusive: 0.00, upper_exclusive: 0.20, candidate_position: 0.25}
      - {lower_inclusive: 0.20, upper_exclusive: 0.40, candidate_position: 0.50}
      - {lower_inclusive: 0.40, upper_exclusive: 0.60, candidate_position: 0.75}
      - {lower_inclusive: 0.60, upper_inclusive: 1.00, candidate_position: 1.00}
  VAL02_NORM_EY_SPREAD_5Y_V1:
    registered_trial_id: "VAL02_NORM_EY_SPREAD_5Y"
    predictor_source_column: "normalized_ey_spread"
    predictor_percentile_column: "norm_ey_spread_percentile_60m"
    formula: "EY_norm_t - CGB10Y_t / 100"
    expected_direction: "HIGHER_PERCENTILE_HIGHER_FORWARD_RETURN"
    bond_input_used: true
    bond_rule: "快照日同日中债10年期国债收益率，供应商百分数除以100转为小数"
    missing_bond_rule: "NO_SIGNAL_NO_FORWARD_FILL"
    candidate_mapping:
      - {lower_inclusive: 0.00, upper_exclusive: 0.20, candidate_position: 0.25}
      - {lower_inclusive: 0.20, upper_exclusive: 0.40, candidate_position: 0.50}
      - {lower_inclusive: 0.40, upper_exclusive: 0.60, candidate_position: 0.75}
      - {lower_inclusive: 0.60, upper_inclusive: 1.00, candidate_position: 1.00}
    zero_position_variant_registered: false

trial_registration:
  previously_rejected_trial: "VAL01_RAW_EY_5Y"
  rejected_trial_reopened: false
  registered_trials_consumed: ["VAL01_NORM_EY_5Y", "VAL02_NORM_EY_SPREAD_5Y"]
  primary_models_in_family: 2
  forbidden_unregistered_variants:
    - "改变60月分位窗口"
    - "改变三年公司正常化窗口或四个TTM最低观测"
    - "改变正常化盈利两分量等权规则"
    - "加入行业标签、缩尾或事后剔除公司"
    - "VAL02改用非同日、前向填充或其他期限利率"
    - "VAL02在看到结果后加入0%仓位"
    - "改变四档边界"

future_evaluation_frozen_but_not_run:
  signal_ready_start: "2021-07-30"
  signal_ready_end: "2026-07-31"
  expected_signal_count: 61
  primary_prediction_horizon_trading_days: 242
  secondary_diagnostic_horizons_trading_days: [60, 120]
  primary_target: "510300含分红、T+1开盘可捕获的242交易日毛收益"
  confirmation_target: "H00300沪深300全收益指数同期限收益"
  chronological_split_rule: "成熟样本按观察日排序后在样本数中点切分，前后半段均须同向"
  historical_label: "HISTORICALLY_CONTAMINATED_NOT_STRICT_OOS"
  familywise_primary_test_control: "HOLM_BONFERRONI_ALPHA_0_10_ACROSS_VAL01_VAL02"
  strategy_return_calculation_enabled: false

true_forward:
  start: null
  status: "NOT_STARTED"
  activation_rule: "冻结后首个按时记录且未回填的月度信号，其下一交易日才可作为真实前向起点"


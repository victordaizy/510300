factor:
  id: OFFICIAL_AGGREGATE_MONTHLY_TURNOVER_RATIO
  formula: 上交所官方月度A股成交额加深交所官方月度Stocks成交额，除以两市对应月末总市值之和
  numerator: sse_a_monthly_trade_amount_cny_100m + szse_stock_monthly_trade_amount_cny_100m
  denominator: sse_a_month_end_market_cap_cny_100m + szse_stock_month_end_market_cap_cny_100m
  expected_predictive_direction: positive
  selection: single_fixed_specification
  alternate_averaging_denominator: forbidden
  standardization: none
  winsorization: none
  threshold_selection: none
  sign_reversal_after_result: forbidden

external_allocation:
  forecast_formula: -0.019 + 0.258 * aggregate_turnover_ratio
  intercept: -0.019
  turnover_coefficient: 0.258
  risk_aversion_gamma: 5.0
  fixed_monthly_variance: 0.00811801
  fixed_monthly_standard_deviation: 0.0901
  raw_weight_formula: external_forecast_monthly_return / (5.0 * 0.00811801)
  lower_weight_bound: 0.0
  upper_weight_bound: 1.0
  negative_forecast_action: cash
  missing_factor_action: 维持前一目标；若从未形成目标则持有现金
  local_return_fitting: forbidden
  local_parameter_estimation: forbidden

signal:
  decision_dates: 每个自然月最后一个真实交易日
  factor_alignment: factor_month与decision_date所在月份严格一致
  target_position: clip((-0.019 + 0.258 * aggregate_turnover_ratio) / (5.0 * 0.0901^2), 0.0, 1.0)
  execution: 下一交易日未复权开盘价

mechanism_target:
  horizon: 本月信号下一交易日开盘到下月信号下一交易日开盘
  return_formula: (退出开盘价加持有期间应享现金分红)除以进入开盘价减一
  dividend_entitlement: record_date大于等于进入日且严格小于退出日
  regression: future_interval_total_return = alpha + beta * aggregate_turnover_ratio + error
  expected_slope: positive

bootstrap:
  method: CIRCULAR_MOVING_BLOCK_BOOTSTRAP_OLS_SLOPE
  repetitions: 5000
  block_length_months: 6
  confidence_level: 0.90
  random_seed: 20260830

mechanism_gates:
  minimum_complete_monthly_targets: 138
  newey_west_max_lag_months: 3
  full_sample_slope_must_be_positive: true
  newey_west_one_sided_t_minimum: 1.645
  bootstrap_90pct_lower_must_be_positive: true
  every_structural_period_slope_must_be_positive: true
  pass_requires_all_gates: true

portfolio:
  enabled_only_if_mechanism_gate_passes: true
  initial_capital_cny: 20000.0
  initial_position: 0.0
  lot_size_shares: 100
  cash_annual_rate: 0.0
  base_costs:
    commission_rate_per_leg: 0.0003
    minimum_commission_cny_per_leg: 5.0
    slippage_bps_per_leg: 5.0
    stamp_duty_rate: 0.0
  stress_costs:
    commission_rate_per_leg: 0.0003
    minimum_commission_cny_per_leg: 5.0
    slippage_bps_per_leg: 10.0
    stamp_duty_rate: 0.0
  delayed_start_months: [0, 1, 2, 3]

portfolio_gates:
  base_net_sharpe_minimum: 1.20
  stress_net_sharpe_minimum: 0.90
  annualized_excess_vs_510300_buy_hold_must_be_positive: true
  annualized_excess_vs_h00300_total_return_must_be_positive: true
  maximum_drawdown_ratio_vs_buy_hold_maximum: 0.75
  every_structural_period_net_sharpe_minimum: 0.50
  every_structural_period_excess_vs_buy_hold_must_be_positive: true
  every_delayed_start_net_sharpe_minimum: 1.00
  every_delayed_start_excess_vs_buy_hold_must_be_positive: true
  delete_any_calendar_year_excess_vs_buy_hold_must_be_positive: true
  maximum_single_positive_year_share_of_positive_excess: 0.50
  deflated_sharpe_probability_minimum: 0.95
  probabilistic_sharpe_above_1p0_minimum: 0.80
  pass_requires_all_gates: true

selection_bias:
  trial_count_rule: COUNT_ALL_PREEXISTING_510300_MANIFESTS_AS_CONSERVATIVE_UPPER_BOUND
  pbo_status: NOT_APPLICABLE_ONE_FROZEN_SPECIFICATION
  deflated_sharpe_method: BAILEY_LOPEZ_DE_PRADO_NORMAL_NULL_TRIAL_STD_PROXY

adjudication:
  mechanism_pass_status: PASS_AGGREGATE_TURNOVER_VISIBILITY_PREDICTIVE_GATE_PORTFOLIO_EVALUATION_ALLOWED
  mechanism_fail_status: REJECTED_FROZEN_AGGREGATE_TURNOVER_VISIBILITY_PREDICTIVE_GATE_FAILED_NO_RESCUE
  portfolio_pass_status: HISTORICAL_RETROSPECTIVE_SHARPE_1P2_PASS_FORWARD_CONFIRMATION_REQUIRED
  portfolio_fail_status: REJECTED_FROZEN_AGGREGATE_TURNOVER_VISIBILITY_PORTFOLIO_GATE_FAILED_NO_RESCUE
  data_fail_status: NO_VIEW_DATA_OR_PROTOCOL_CONTRACT_FAILED
  program_fail_status: PROGRAM_FAILED
  target_net_sharpe: 1.20
  historical_pass_never_authorizes_trading: true


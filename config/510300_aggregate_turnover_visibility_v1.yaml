protocol:
  project_id: 510300_AGGREGATE_TURNOVER_VISIBILITY_V1
  candidate_model_id: 510300_AGGREGATE_TURNOVER_VISIBILITY_V1
  state: PRE_REGISTERED_READY_TO_FREEZE_AFTER_INPUT_PASS
  evidence_class: RETROSPECTIVE_EXTERNAL_COEFFICIENT_POST_PAPER_SAMPLE_ONE_SHOT_AFTER_PRICE_INPUT_COVERAGE_INSPECTION
  purpose: 验证月末可得的中国股票市场总换手率能否正向预测510300下月可执行收益；只有机制门通过后才允许计算组合收益与夏普率
  registration_date: '2026-08-30'
  timezone: Asia/Shanghai
  paper_sample_ends_before_evaluation: true
  historical_510300_data_already_contaminated: true
  one_shot: true
  target_sharpe_is_acceptance_gate_not_optimization_objective: true
  parameter_rescue_after_result: forbidden
  alternate_factor_rescue_after_result: forbidden
  alternate_window_rescue_after_result: forbidden
  reverse_direction_after_result: forbidden
  alternate_szse_scope_rescue_after_result: forbidden
  combination_with_rejected_candidates_after_result: forbidden
  pre_freeze_data_decision:
    status: CORRECTED_BEFORE_ANY_510300_PRICE_OR_OUTCOME_WAS_READ
    field: SSE_MONTHLY_API_CUTOVER
    original_boundary: 旧接口至2021-12，新接口自2022-01
    corrected_boundary: 旧接口至2021-11，新接口自2021-12
    decision_basis: 2021-12旧接口返回空数组而新接口返回01、02、03三类；2021-11仅旧接口有数据
    parameter_or_outcome_rescue: false
  pre_freeze_transport_decision:
    status: CORRECTED_BEFORE_ANY_510300_PRICE_OR_OUTCOME_WAS_READ
    rejected_source: 深交所动态历史日度与月度API
    rejected_reason: 当前网络路径仅能通过非TLS的HTTP取得动态接口响应；正式证据链禁止降级TLS或关闭证书校验
    replacement_source: 2014至2025深交所官方HTTPS统计年鉴加2026官方HTTPS静态月报
    decision_basis: 在任何510300价格、未来收益、组合收益或夏普率被读取前完成数据源替换；替换只修复可验证传输与归档证据，不使用结果选择口径
    tls_verification_remains_required: true
    parameter_or_outcome_rescue: false
  historical_archive_decision:
    status: HISTORICAL_ARCHIVE_RECONSTRUCTION_NOT_TIMESTAMP_PROOF
    numerical_basis: 深交所年鉴月度表由当月逐日成交累计值和月末市值组成，可用于重建冻结因子数值
    timing_limitation: 年鉴归档文件本身不能证明其在历史月末下一交易日开盘前已经发布
    retrospective_use: allowed_for_numerical_reconstruction_only
    live_or_forward_use: 月末必须在下一交易日开盘前独立捕获当时官方输入；缺失则NO_VIEW且不得回填交易信号
  pre_freeze_price_input_inspection:
    status: FULL_PRICE_FILE_LOADED_FOR_COVERAGE_INSPECTION_BEFORE_FREEZE
    reason: 核对既有510300输入审计的文件哈希、首末日期与审计窗口覆盖范围
    full_price_file_loaded: true
    last_three_price_rows_displayed: true
    factor_joined_to_prices: false
    future_return_series_computed: false
    strategy_returns_computed: false
    sharpe_computed: false
    pristine_blind_holdout_claim_allowed: false

literature:
  primary_paper:
    title: Predicting the Chinese Equity Premium with Trading Volume
    author: Fuwei Jiang
    date: '2013-02-01'
    url: https://www.cfrn.com.cn/uploads/fileupload/4066/paper/1351270551233429.pdf
    sample_start: '1996-06'
    sample_end: '2009-06'
    original_predictor: 月度A股市场成交金额除以月末市场总市值
    predictive_regression: r_t_plus_1 = alpha + beta_turnover * turnover_t + epsilon_t_plus_1
    expected_direction: beta_turnover大于零
    unstandardized_intercept_monthly: -0.019
    unstandardized_turnover_coefficient: 0.258
    monthly_market_return_standard_deviation: 0.0901
    risk_aversion_gamma: 5.0
    paper_weight_cap: 1.5
  transfer_limitations:
    - 本研究交易510300而非论文的全市场风险溢价序列
    - 上交所部分严格使用主板A股加科创板，深交所官方Stocks合计含主板B股与存托凭证；该代理口径在结果后不得替换
    - 本研究为满足无杠杆约束把论文150%仓位上限截为100%
    - 本研究不用2015年前510300收益估计方差，而固定使用论文表1的月度收益标准差0.0901
    - 本研究用下一交易日开盘至下一次执行开盘的含分红收益，而非不可执行的同日收盘成交
    - 2014至2025深交所历史因子值来自官方年鉴数值重建，不把年鉴归档时间误称为历史月末可得性证明


  factor_gates:
    expected_direction_in_both_chronological_halves: true
    primary_top_minus_bottom_net_return_positive: true
    primary_block_bootstrap_lower_bound_positive: true
    incremental_hac_coefficient_positive: true
    sensitivity_direction_must_not_reverse: true
  strategy_gates:
    net_sharpe_minimum: 0.80
    sharpe_improvement_vs_matched_exposure_minimum: 0.25

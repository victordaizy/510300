feature_contract:
  total_return_formula: "R_t = (close_t + dividend_t) / close_t_minus_1 - 1"
  overnight_contribution_formula: "ON_t = (open_t + dividend_t - close_t_minus_1) / close_t_minus_1"
  intraday_contribution_formula: "ID_t = (close_t - open_t) / close_t_minus_1"
  exact_identity: "R_t = ON_t + ID_t"
  aggregation_window_trading_days: 5
  volatility_window_trading_days: 20
  normalization_formula: "raw_t = (sum5_ID_t - sum5_ON_t) / (sd20_R_t * sqrt(5))"
  percentile_history_trading_days: 252
  percentile_history_excludes_current_day: true
  entry_requires_sum5_overnight_negative: true
  entry_requires_sum5_intraday_positive: true
  entry_percentile: 0.80
  exit_percentile_strictly_below: 0.50
  maximum_holding_trading_days: 20
  equality_entry_triggers: true
  equality_exit_triggers: false
  initial_research_state: "CASH"
  research_state_targets: [0.0, 1.0]
  signal_time: "T日收盘后"
  earliest_execution_time: "T+1交易日开盘"

prediction_contract:
  primary_horizon_trading_days: 20
  sensitivity_horizon_trading_days: 5
  return_start: "T+1_OPEN"
  return_end_primary: "T+20_CLOSE"
  return_end_sensitivity: "T+5_CLOSE"
  include_cash_distributions: true
  deduct_entry_and_exit_costs: true
  cash_annual_rate: 0.015
  incremental_baseline:
    id: "H001_ETF_TOTAL_RETURN_5D_REVERSAL"
    formula: "past_5d_dividend_inclusive_total_return"
  primary_incremental_test: "D20 ~ constant + H001 + DAILY_01，使用HAC标准误"

execution:

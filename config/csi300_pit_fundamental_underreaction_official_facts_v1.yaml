  purpose: 为沪深300基本面反应不足第一阶段建立首份官方原始完整定期报告逐项验证的点时财务事实库

parent_freeze:
  path: config/csi300_pit_fundamental_underreaction_enhancement_v1_manifest.json
  expected_status: FROZEN_BEFORE_OFFICIAL_FACT_ACQUISITION_AND_ANY_FUTURE_RETURN_READ
  expected_content_sha256: 17017a08faf16cdd450a3dd2e85dc59fc3360002c698266b86fd71c21ff1beec

inputs:
  target_inventory:
    path: data/audit/csi300_pit_fundamental_underreaction_enhancement_v1/target_event_inventory_without_returns.parquet
    expected_sha256: b9c24f90316d80eb0945b27eabd79e97f134fafae92f3aa94100c05ebf97c694
    target_flag: included_in_phase1_fact_target
    expected_target_event_count: 8223
  official_events:
    path: data/raw/cninfo/a_share_hs_periodic_report_events_v2_1.parquet
    expected_sha256: 028c9a68335b719916e1b735888f6f444bca7f4dfba2bc051a0088a10e98512b
    required_unique_key: [ts_code, report_period]

dependency_contract:
  fiscal_quarter_frequency: Q_DEC
  quarters_including_target: 9
  reason: 覆盖当前与前8个标准季度，以构造单季度同比加速度、最近三期连续性、当前及上年可比TTM和期末资产平均值
  dependency_publication_must_not_exceed_target_publication: true
  missing_dependency_status: NO_VIEW_REQUIRED_OFFICIAL_PERIODIC_REPORT_MISSING
  duplicate_document_download_forbidden: true

official_pdf:
  accepted_host: static.cninfo.com.cn
  search_page_url: https://www.cninfo.com.cn/new/commonUrl/pageOfSearch?url=disclosure/list/search
  query_url: https://www.cninfo.com.cn/new/hisAnnouncement/query
  pdf_base_url: https://static.cninfo.com.cn/
  required_header: '%PDF-'
  timeout_seconds: 120
  maximum_attempts_per_run: 3
  retry_backoff_seconds: [1, 2]
  workers_default: 6
  download_chunk_bytes: 1048576
  maximum_pdf_bytes: 104857600
  retain_full_pdf: false
  retain_full_pdf_sha256: true
  same_event_official_full_pdf_sibling_fallback: true
  sibling_query_page_size: 30
  sibling_maximum_candidates: 10
  sibling_required_same_security_report_period_and_publication_date: true
  sibling_selection_rule: FIRST_COMPLETE_NINE_METRIC_PDF_BY_OFFICIAL_TIMESTAMP_THEN_ANNOUNCEMENT_ID
  sibling_excluded_title_tokens: [摘要, 取消, 更正, 修订, 更新后, 英文, 英文版, 提示性公告]

extraction:
  parser_version: CSI300_PIT_OFFICIAL_FINANCIAL_FACTS_PDFIUM_PDFPLUMBER_V1_2_0
  engine: pypdfium2_text_with_pdfplumber_strict_table_cell_fallback
  statement_scope: CONSOLIDATED_ONLY
  current_period_column_rule: Q1_H1_FY_FIRST_AMOUNT_AFTER_LABEL_Q3_FROZEN_YTD_COLUMN_WITH_OPTIONAL_STATEMENT_NOTE_NUMBER_SKIPPED
  q3_income_ytd_rule: IF_BOTH_7_TO_9_AND_1_TO_9_COLUMNS_EXIST_SELECT_THIRD_AMOUNT_OTHERWISE_SELECT_FIRST_YTD_AMOUNT
  q3_core_profit_rule: SECOND_NON_PERCENT_AMOUNT_ONLY_WHEN_BOTH_CURRENT_QUARTER_AND_YEAR_TO_DATE_COLUMNS_EXIST_OTHERWISE_FIRST_YTD_AMOUNT
  explicit_standalone_dash_amount_rule: ZERO_ONLY_WHEN_DASH_OCCUPIES_THE_CURRENT_AMOUNT_CELL
  explicit_blank_inventory_rule: ZERO_ONLY_WHEN_OFFICIAL_TABLE_EXACT_INVENTORY_ROW_HAS_CURRENT_AND_PRIOR_AMOUNT_CELLS_ALL_BLANK
  combined_receivable_line_rule: FORBIDDEN_AS_ACCOUNTS_RECEIVABLE_USE_PURE_ACCOUNTS_RECEIVABLE_FROM_CONSOLIDATED_NOTES
  units: [元, 千元, 万元, 百万元, 亿元]
  currency: CNY
  required_metrics:
    - OPERATING_REVENUE_YTD
    - OPERATING_PROFIT_YTD
    - PARENT_NET_PROFIT_YTD
    - CORE_PARENT_NET_PROFIT_YTD
    - OPERATING_CASH_FLOW_YTD
    - ACCOUNTS_RECEIVABLE_END
    - INVENTORY_END
    - TOTAL_ASSETS_END
    - TOTAL_LIABILITIES_END
  every_metric_requires_page_label_raw_value_unit_and_locator: true
  ambiguous_or_missing_value_status: NO_VIEW_REQUIRED_OFFICIAL_FINANCIAL_FACTS_INCOMPLETE

admission:
  required_complete_event_ratio: 0.90
  required_complete_event_ratio_each_publication_year: 0.80
  required_complete_event_ratio_each_industry_with_at_least_50_targets: 0.75
  pass_status: PASS_OFFICIAL_PDF_VERIFIED_PIT_FINANCIAL_FACTS_V1
  partial_status: PARTIAL_OFFICIAL_PDF_FACT_ACQUISITION
  coverage_fail_status: BLOCKED_OFFICIAL_PDF_FACT_COVERAGE_BELOW_FROZEN_GATE

checkpoint:
  parser_version_mismatch_requires_reparse: true
  parsed_incomplete_checkpoint_reused: true
  failed_download_checkpoint_retried_on_next_run: true
  atomic_gzip_json: true

governance:
  read_market_prices: false
  read_future_returns: false
  create_future_labels: false
  calculate_signal: false
  calculate_ic: false
  calculate_quantiles: false
  calculate_portfolio_return: false
  calculate_strategy_sharpe: false
  position_mapping: false
  order_generation: false
  broker_connection: false
  trading_authorization: false

artifacts:

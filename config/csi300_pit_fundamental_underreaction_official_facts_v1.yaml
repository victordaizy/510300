  protocol_manifest: config/csi300_pit_fundamental_underreaction_official_facts_v1_manifest.json
  requirement_ledger: data/audit/csi300_pit_fundamental_underreaction_enhancement_v1/official_fact_requirement_ledger.parquet
  document_queue: data/audit/csi300_pit_fundamental_underreaction_enhancement_v1/official_fact_document_queue.parquet
  checkpoint_root: data/raw/cninfo/csi300_pit_fundamental_underreaction_enhancement_v1/checkpoints
  facts: data/raw/cninfo/csi300_pit_fundamental_underreaction_enhancement_v1/official_financial_facts.parquet
  dependency_ledger: data/raw/cninfo/csi300_pit_fundamental_underreaction_enhancement_v1/event_fact_dependency_ledger.parquet
  receipt: data/raw/cninfo/csi300_pit_fundamental_underreaction_enhancement_v1/receipt.json
  report_markdown: reports/data_quality/CSI300_PIT_FUNDAMENTAL_UNDERREACTION_OFFICIAL_FACTS_V1.md

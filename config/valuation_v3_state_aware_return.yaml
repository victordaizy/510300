model:
  model_id: "CSI300_VALUATION_V3_STATE_AWARE_EXPECTED_RETURN"
  version: "0.1.0-diagnostic"
  horizons_trading_days: [20, 60, 120, 242]
  identity: "FutureNormalizedEPS×PartiallyRevertedPE/CurrentPrice + Dividend - 1"

dependence_adjustment:
  exact_non_overlapping: true
  newey_west_lag_rule: "ceil(horizon_trading_days/21)-1"
  moving_block_bootstrap_repetitions: 5000
  moving_block_length_rule: "ceil(horizon_trading_days/21) monthly observations"
  random_seed: 20260813

mean_reversion:
  estimator: "walk-forward no-intercept OLS of next-12-month normalized-PE change on same-basis log FairPE gap"
  minimum_completed_annual_pairs: 12
  annual_speed_bounds: [0.0, 1.0]
  horizon_scaling: "1-(1-annual_speed)^(horizon/242)"
  state_dependent_speed_used_in_signal: false

regimes:
  rate: "10年国债收益率6个月变化的正负"
  earnings: "正常化指数EPS过去12个月变化的正负"
  market: "指数相对10个月均线与3个月动量共同判定牛/熊/震荡"
  risk_premium: "正常化盈利收益率减10年国债，和信号日前扩展中位数比较"
  roe: "正常化ROE和信号日前扩展中位数比较"
  volatility: "3个月实现波动率和信号日前扩展中位数比较"
  foreign_flow: "UNAVAILABLE"

governance:
  parameter_search_performed: false
  architecture_selected_after_v2_inspection: true
  trading_use_authorized: false
  note: "V3用于诊断V2时变失效；不得把回顾结果描述为预注册或样本外证据。"

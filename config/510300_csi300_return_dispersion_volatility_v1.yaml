factor:
  id: CSI300_POINT_IN_TIME_MONTHLY_EQUAL_WEIGHT_RETURN_DISPERSION
  active_factor_count: 1
  formula: sqrt(sum_i((r_i_month-r_equal_weight_month)^2)/(N-1))
  squared_formula: cross_sectional_return_dispersion^2
  expected_predictive_direction: positive_for_next_month_realized_variance
  standardization: natural_log_of_squared_dispersion_in_regression
  threshold_selection: none
  ranking: none
  smoothing: none
  winsorization: none
  alternate_cssd_or_csad_after_result: forbidden
  sign_reversal_after_result: forbidden

mechanism_model:
  target: next_calendar_month_000300_price_index_realized_variance
  daily_return_definition: log_close_to_close_return
  monthly_realized_variance_definition: sum_of_daily_log_return_squared_within_calendar_month
  baseline_regression: log_rv_next = alpha + beta_rv * log_rv_current + error
  augmented_regression: log_rv_next = alpha + beta_rv * log_rv_current + beta_rd * log_dispersion_squared_current + error
  expected_beta_rd_direction: positive
  estimation: expanding_ordinary_least_squares
  minimum_training_pairs: 96
  training_information_cutoff: 在月末t预测t加1月时，只使用目标月份不晚于t的历史配对
  variance_forecast_transform: exp_of_predicted_log_variance
  forecast_floor: 1.0e-10
  local_model_class_selection: forbidden
  baseline_only_portfolio_if_augmented_fails: forbidden

mechanism_evaluation:
  primary_loss: QLIKE
  secondary_loss: log_variance_squared_error
  qlike_formula: actual_variance_divided_by_forecast_variance_plus_log_forecast_variance
  dm_loss_difference: baseline_loss_minus_augmented_loss
  newey_west_max_lag_months: 3
  bootstrap_method: CIRCULAR_MOVING_BLOCK_BOOTSTRAP_AUGMENTED_OLS_BETA_RD
  bootstrap_repetitions: 5000
  bootstrap_block_length_months: 12
  bootstrap_confidence_level: 0.90
  random_seed: 20260830

mechanism_gates:
  minimum_complete_oos_target_months: 139
  full_sample_beta_rd_must_be_positive: true
  full_sample_beta_rd_one_sided_t_minimum: 1.645
  bootstrap_90pct_lower_beta_rd_must_be_positive: true
  full_sample_qlike_improvement_must_be_positive: true
  full_sample_qlike_dm_one_sided_t_minimum: 1.645
  every_structural_period_beta_rd_must_be_positive: true
  every_structural_period_qlike_improvement_must_be_positive: true
  pass_requires_all_gates: true

allocation:
  enabled_only_if_mechanism_gate_passes: true
  expected_return_forecast: expanding_arithmetic_mean_of_h00300_monthly_total_returns_available_through_decision_month
  expected_return_minimum_observations: 24
  risk_aversion_gamma: 5.0
  raw_weight_formula: max(0, historical_mean_monthly_total_return)/(5.0*augmented_forecast_monthly_variance)
  lower_weight_bound: 0.0
  upper_weight_bound: 1.0
  missing_or_invalid_forecast_action: 维持前一目标；若从未形成目标则持有现金
  baseline_only_allocation: forbidden
  local_return_parameter_tuning: forbidden


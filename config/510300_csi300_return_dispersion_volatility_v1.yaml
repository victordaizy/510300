literature:
  primary_mechanism_paper:
    title: Firm-level return dispersion and the future volatility of aggregate stock market returns
    author: Christopher T. Stivers
    publication_year: 2003
    doi: 10.1016/S1386-4181(02)00044-7
    url: https://www.sciencedirect.com/science/article/pii/S1386418102000447
    sample_start: '1927-01'
    sample_end: '1995-12'
    frequency: monthly
    original_market: United States
    original_measure: firm return cross-sectional standard deviation
    expected_direction: higher_current_return_dispersion_predicts_higher_future_market_volatility
  exact_measure_reference:
    title: Information content and other characteristics of the daily cross-sectional dispersion in stock returns
    authors: Robert A. Connolly and Christopher T. Stivers
    publication_year: 2006
    doi: 10.1016/j.jempfin.2005.02.001
    url: https://www.sciencedirect.com/science/article/pii/S0927539805000502
    formula: sample_standard_deviation_of_constituent_returns_about_equal_weight_portfolio_return
  transfer_limitations:
    - 原论文市场为美国，本候选转移到中国沪深300大盘股成分
    - 原论文主模型为非对称GARCH，本候选预注册为可审计的月频扩展OLS：log下一月实现方差对log本月实现方差与log本月离散度平方
    - 沪深300本身已是大盘流动性筛选后的300只股票，因此固定使用全部点时成员，不再按市值剔除最小20%
    - 历史成员来自第三方将官方调样公告标准化后的区间，不得称为中证官方历史权重
    - 历史成分行情与复权因子是当前回溯重建，不构成当时可得性时间戳证明
    - 机制预测对象是000300价格指数月度实现方差，执行对象仍仅为510300或现金
    - 历史研究不是盲测；510300既有价格历史在其他候选中已经被观察


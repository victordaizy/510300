  long_only: true
  leverage_allowed: false
  short_selling_allowed: false
  derivatives_execution_allowed: false
  signal_time: T日收盘后
  execution_time: T+1交易日开盘
  earliest_allowed_source_date: '2021-01-01'
  position_rule_source: 既有冻结state_final逐日序列，禁止重算阈值、改状态或填补缺失

dates:
  frozen_signal_series_start: '2021-08-12'
  frozen_signal_series_end: '2026-08-27'
  primary_evaluation_start: '2022-03-09'
  primary_evaluation_end: '2026-08-27'
  periods:
    DEVELOPMENT_2022_2025:
      start: '2022-03-09'
      end: '2025-12-31'
      gate_eligible: true
    TEMPORAL_REPLICATION_2026_YTD:
      start: '2026-01-02'
      end: '2026-08-27'
      gate_eligible: true
    COMBINED_2022_03_09_TO_2026_08_27:
      start: '2022-03-09'
      end: '2026-08-27'
      gate_eligible: true
    POST_CUTOFF_HOLDOUT_2026_08_17_TO_2026_08_27:
      start: '2026-08-17'
      end: '2026-08-27'
      gate_eligible: false
  primary_period: COMBINED_2022_03_09_TO_2026_08_27
  temporal_replication_period: TEMPORAL_REPLICATION_2026_YTD


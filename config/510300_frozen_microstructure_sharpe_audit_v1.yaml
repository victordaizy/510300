execution:
  initial_capital_cny: 20000.0
  lot_size_shares: 100
  paid_dividends_reinvested_at_earliest_next_open: true
  cash_annual_rate: 0.0
  annualization_trading_days: 242
  start_perturbations_trading_days:
    - 0
    - 1
    - 2
    - 3
    - 4

costs:
  base:
    commission_rate_per_leg: 0.0003
    minimum_commission_cny_per_leg: 5.0
    slippage_bps_per_leg: 5.0
  double:
    commission_rate_per_leg: 0.0006
    minimum_commission_cny_per_leg: 10.0
    slippage_bps_per_leg: 10.0

metrics:
  sharpe_definition: 日简单收益均值除以样本标准差再乘sqrt(242)，现金收益率为0
  annualized_return_definition: 日对数收益均值乘242后指数还原
  h00300_benchmark: H00300全收益指数，不计交易成本
  buy_hold_benchmark: 同期2万元、100股整数倍、基础成本、含分红510300买入持有
  maximum_drawdown_definition: 净值除以前高减1
  yearly_excess_contribution: 相对510300买入持有的逐日对数超额按自然年求和
  completed_round_trip: 仓位首次降至0后再次恢复至1

historical_gates:
  net_sharpe_minimum: 1.20
  annualized_excess_vs_h00300_must_be_positive: true
  annualized_excess_vs_buy_hold_must_be_positive: true
  maximum_drawdown_ratio_vs_buy_hold: 0.75
  maximum_complete_round_trips_in_any_calendar_year: 10
  every_start_perturbation_must_pass: true

robustness_gates:
  double_cost_sharpe_minimum: 0.90
  leave_one_calendar_year_out_sharpe_must_be_positive: true
  maximum_single_year_share_of_total_log_excess: 0.50
  temporal_replication_excess_vs_both_benchmarks_must_be_positive: true

adjudication:
  macro_candidate_replacement_allowed: false
  historical_candidate_status_if_all_gates_pass: HISTORICAL_POST_SELECTION_AUDIT_PASS_FORWARD_PROOF_STILL_REQUIRED
  failed_status: HISTORICAL_POST_SELECTION_AUDIT_REJECTED_NO_RESCUE
  insufficient_status: HISTORICAL_POST_SELECTION_AUDIT_INSUFFICIENT
  parameter_rescue_after_result: forbidden
  date_rescue_after_result: forbidden
  cost_rescue_after_result: forbidden
  benchmark_rescue_after_result: forbidden
  start_offset_averaging_rescue_after_result: forbidden

governance:
  research_only: true
  paper_or_shadow_position_mapping: disabled
  order_generation: disabled
  broker_connection: disabled
  live_trading_authorized: false

paths:
  manifest: config/510300_frozen_microstructure_sharpe_audit_v1_manifest.json
  freeze_receipt: reports/frozen/510300_frozen_microstructure_sharpe_audit_v1_freeze_receipt.json

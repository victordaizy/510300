feature_contract:
  causal_percentile: EMPIRICAL_MIDRANK_AGAINST_STRICTLY_PRIOR_VALID_OBSERVATIONS_ONLY
  missing_value_rule: NO_VIEW_NO_INTERPOLATION_NO_ZERO_FILL
  all_fixed_channels_required_within_each_module: true
  M:
    aggregation: MEDIAN_OF_TWO_RISK_PERCENTILES
    M1_EY_RATE_BUFFER:
      formula: CSI300_EARNINGS_YIELD_MINUS_CHINA_10Y_GOVERNMENT_BOND_YIELD
      canonical_name: EARNINGS_YIELD_RATE_BUFFER_NOT_EXPECTED_ERP
      risk_direction: LOWER_IS_HIGHER_RISK
    M2_FUNDING_SPREAD:
      formula: DR007_MINUS_7D_REVERSE_REPO_POLICY_RATE
      transform: FIVE_MARKET_DAY_MEAN
      risk_direction: HIGHER_IS_HIGHER_RISK
    standalone_trigger_allowed: false
  F:
    aggregation: MEDIAN_OF_THREE_RISK_PERCENTILES
    F1_BREADTH20:
      formula: SHARE_OF_SCOREABLE_PIT_MEMBERS_WITH_POSITIVE_20D_TOTAL_SHAREHOLDER_RETURN
      risk_direction: LOWER_IS_HIGHER_RISK
    F2_LEADERSHIP_GAP20:
      formula: H00300_20D_TOTAL_RETURN_MINUS_PIT_MEMBER_EQUAL_WEIGHT_20D_TOTAL_RETURN
      risk_direction: HIGHER_IS_HIGHER_RISK
    F3_COMOVEMENT20:
      formula: MEDIAN_MEMBER_CORRELATION_WITH_PIT_EQUAL_WEIGHT_PEERS_EXCLUDING_SELF_OVER_20D
      risk_direction: HIGHER_IS_HIGHER_RISK
  T:
    aggregation: MEDIAN_OF_FOUR_RISK_PERCENTILES
    T1_BREADTH_DROP5:
      formula: BREADTH20_T_MINUS_5_MINUS_BREADTH20_T
      risk_direction: HIGHER_IS_HIGHER_RISK
    T2_TAIL_DIFFUSION5:
      formula: SHARE_OF_PIT_MEMBERS_WITH_5D_RETURN_BELOW_NEGATIVE_1_5_TIMES_60D_DAILY_VOL_TIMES_SQRT_5
      risk_direction: HIGHER_IS_HIGHER_RISK
    T3_COMOVEMENT_ACCEL5:
      formula: COMOVEMENT20_T_MINUS_COMOVEMENT20_T_MINUS_5
      risk_direction: HIGHER_IS_HIGHER_RISK
    T4_FUNDING_SHOCK5:
      formula: FUNDING_SPREAD_5D_MEAN_MINUS_FUNDING_SPREAD_20D_MEAN
      risk_direction: HIGHER_IS_HIGHER_RISK


  feature_parquet: data/features/510300_futures_option_bridge_v1_dev.parquet
  prediction_parquet: data/features/510300_futures_option_bridge_v1_dev_predictions.parquet
  result_json: reports/discovery/510300_futures_option_bridge_v1_dev.json

common_sample_contract:
  join_key: origin_date_equals_feature_date
  feature_information_cutoff: T_CLOSE
  B1:
    eligible_when: B1_STATE_VIEW_ALLOWED_AND_ALL_THREE_B1_FEATURES_FINITE

    eligible_when: B1_ELIGIBLE_AND_B2_FEATURE_STATE_VIEW_ALLOWED_AND_T_AND_T_X_F_FINITE
    common_sample_required: true
  B3_VS_B2:
    eligible_when: B2_VS_B1_ELIGIBLE_AND_B3_FEATURE_STATE_VIEW_ALLOWED_AND_M_AND_T_X_M_FINITE
    common_sample_required: true
  no_view_rule: RETAIN_ROW_WITH_NULL_MODEL_WEIGHT_AND_EXPLICIT_REASON
  positive_event_inclusion_rule: AT_LEAST_ONE_ELIGIBLE_POSITIVE_ORIGIN
  positive_weight_rule: RENORMALIZE_ELIGIBLE_POSITIVE_ORIGINS_TO_SUM_ONE_WITHIN_EACH_EVENT_AND_MODEL_SAMPLE
  negative_weight_rule: EACH_ELIGIBLE_NON_EVENT_RISK_DAY_EQUALS_ONE
  split_assignment: UNASSIGNED_PRE_MODEL_FREEZE
  prediction_or_fit_allowed: false


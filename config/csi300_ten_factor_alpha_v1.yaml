protocol:
  project_id: "CSI300_TEN_FACTOR_NONLINEAR_ALPHA_V1"
  version: "1.0.0"
  protocol_date: "2026-08-18"
  state: "DISCOVERY_ONLY"
  historical_contamination_cutoff: "2026-08-14"
  evidence_label: "FORMULA_PSEUDO_OOS_PROJECT_HISTORY_CONTAMINATED"
  true_forward_start: null
  benchmark: "H00300沪深300全收益指数"
  acceptance_metric: "策略几何年化收益率减基准几何年化收益率"
  acceptance_minimum: 0.20

inputs:
  constituent_member_panel: "data/raw/constituents/000300_constituent_daily.parquet"
  component_history_cache: "data/raw/constituents/.tushare_stock_history_cache"
  component_moneyflow: "data/raw/flow/csi300_component_moneyflow_daily.parquet"
  point_in_time_financials: "data/raw/fundamentals/csi300_financials_point_in_time.parquet"
  index_daily: "data/raw/market/000300_daily_feature_warmup.parquet"
  benchmark_total_return: "data/raw/market/H00300_total_return_daily_raw.parquet"
  breadth: "data/features/000300_equal_weight_breadth_daily.parquet"

schedule:
  feature_start_date: "2021-08-12"
  pseudo_oos_start_date: "2023-01-03"
  end_date: "2026-08-14"
  rebalance_every_trading_days: 10
  target_horizon_trading_days: 10
  signal_time: "t日收盘后"
  execution_time: "t+1交易日开盘"
  target_exit: "t+11交易日开盘"

factor_budget:
  maximum: 10
  used: 10
  feature_columns:
    - "f01_medium_momentum_rank"
    - "f02_short_momentum_rank"
    - "f03_reversal_5d_rank"
    - "f04_low_volatility_rank"
    - "f05_drawdown_position_rank"
    - "f06_liquidity_shock_rank"
    - "f07_informed_flow_rank"
    - "f08_value_quality_composite"
    - "f09_index_trend_120d"
    - "f10_breadth_above_ma60"
  definitions:
    f01: "Rank[log(TRClose[t-20]/TRClose[t-120])]"
    f02: "Rank[log(TRClose[t]/TRClose[t-20])]"
    f03: "Rank[-log(TRClose[t]/TRClose[t-5])]"
    f04: "Rank[-Std(Return1d,t-19:t)]"
    f05: "Rank[TRClose[t]/Max(TRClose,t-59:t)-1]"
    f06: "Rank[log(MeanAmount20/MeanAmount120)]"
    f07: "Rank[(LargeAndExtraLargeNet20-SmallNet20)/Amount20]"
    f08: "0.5*Rank[BPS/RawClose]+0.5*Rank[ROE]，财报公告日点时可见"
    f09: "IndexClose/MA120-1"
    f10: "点时成分股站上MA60比例"

model:
  estimator: "sklearn.ensemble.HistGradientBoostingRegressor"
  loss: "squared_error"
  learning_rate: 0.05
  max_iter: 120
  max_leaf_nodes: 15
  min_samples_leaf: 80
  l2_regularization: 1.0
  max_bins: 63
  early_stopping: false
  random_state: 20260818
  target_clip: [-0.50, 0.50]
  training_half_life_calendar_days: 730
  minimum_training_rows: 3000
  minimum_training_signal_dates: 10
  hyperparameter_search_allowed: false
  feature_selection_allowed: false
  interaction_search_allowed: false

selection:
  holdings: 3
  primary_sort: "predicted_10d_excess_desc"
  tie_break: "con_code_asc"
  minimum_20d_average_amount_cny: 50000000
  maximum_open_total_return_gap_for_trade: 0.095

account:
  initial_cash_cny: 20000
  maximum_positions: 3
  minimum_trade_notional_cny: 5000
  lot_size: 100
  cash_annual_rate: 0.015
  long_only: true
  leverage_allowed: false

costs:
  commission_rate: 0.0003
  minimum_commission_cny: 5.0
  stamp_duty_sell_rate: 0.0005
  stamp_duty_sell_rate_before_reduction: 0.001
  stamp_duty_reduction_effective_date: "2023-08-28"
  base_slippage_bps_per_leg: 5.0
  stress_slippage_bps_per_leg: 15.0

evaluation:
  annualized_excess_minimum: 0.20
  stress_annualized_excess_minimum: 0.20
  evaluation_subperiod_start: "2025-01-02"
  subperiod_annualized_excess_minimum: 0.20
  bootstrap_repetitions: 5000
  bootstrap_block_length_trading_days: 20
  bootstrap_excess_lower_bound_strictly_above: 0.0
  random_seed: 20260818

governance:
  historical_result_may_authorize_live: false
  paper_signal_enabled: false
  position_mapping_enabled: false
  order_generation_enabled: false
  broker_connection_enabled: false
  live_trading_authorized: false
  freeze_before_outcome_read: true
  failed_model_parameter_rescue_forbidden: true

outputs:
  factor_panel: "data/features/000300_ten_factor_signal_v1.parquet"
  predictions: "data/features/000300_ten_factor_prediction_oos_v1.parquet"
  base_ledger: "data/processed/csi300_ten_factor_alpha_v1/base_ledger.parquet"
  base_trades: "data/processed/csi300_ten_factor_alpha_v1/base_trades.parquet"
  stress_ledger: "data/processed/csi300_ten_factor_alpha_v1/stress_ledger.parquet"
  stress_trades: "data/processed/csi300_ten_factor_alpha_v1/stress_trades.parquet"
  result_json: "reports/backtest/csi300_ten_factor_alpha_v1.json"
  result_markdown: "reports/backtest/csi300_ten_factor_alpha_v1.md"


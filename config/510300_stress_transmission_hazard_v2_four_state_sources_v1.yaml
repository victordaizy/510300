    documentation_url: https://tushare.pro/document/1?doc_id=27
    provider_semantics: UNADJUSTED_DAILY_NO_ROWS_DURING_SUSPENSION
    required_fields: [ts_code, trade_date, open, high, low, close, pre_close, change, pct_chg, vol, amount]

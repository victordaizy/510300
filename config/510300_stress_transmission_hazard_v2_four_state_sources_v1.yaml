  credential_source: EPHEMERAL_ENV_ONLY
  credential_persistence_allowed: false
  allowed_endpoint_hosts: [api.tushare.pro, fast.xiaodefa.cn, tt.xiaodefa.cn]
  request_strategy_after_probe:

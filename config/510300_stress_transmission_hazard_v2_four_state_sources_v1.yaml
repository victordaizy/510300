    documentation_url: https://tushare.pro/document/2?doc_id=214
    required_fields: [ts_code, trade_date, suspend_timing, suspend_type]
    provider_semantics: PROVIDER_MAINTAINED_DAILY_SUSPEND_RESUME_CANDIDATE
    official_exchange_evidence_eligible: false
    zero_return_authorization: false
    role: CANDIDATE_DIAGNOSTIC_ONLY
  dividend:
    api_name: dividend
    documentation_url: https://tushare.pro/document/2?doc_id=103
    required_fields: [ts_code, end_date, ann_date, div_proc, stk_div, stk_bo_rate, stk_co_rate, cash_div, cash_div_tax, record_date, ex_date, pay_date, div_listdate, imp_ann_date, base_date, base_share]

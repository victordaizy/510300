corporate_action_reconciliation:
  comparison:
    previous_unadjusted_close_source: PRIOR_OBSERVED_DAILY_CLOSE
    provider_ex_reference_source: DAILY_PRE_CLOSE
    expected_ex_reference_formula: ROUND_TO_CENT((PREVIOUS_CLOSE_MINUS_GROSS_CASH_PLUS_SUBSCRIPTION_OUTFLOW)/POST_TO_PRE_SHARE_RATIO)
    absolute_tolerance_cny: 0.011
    pct_chg_identity_absolute_tolerance_percentage_points: 0.011
  none_confirmed:
    required: true
    rule: DAILY_PRE_CLOSE_EQUALS_PRIOR_OBSERVED_UNADJUSTED_CLOSE_WITHIN_TOLERANCE_AND_NO_CONFLICTING_ACTION_ROW
  resolved:
    required: true
    rule: IMPLEMENTED_TERMS_AVAILABLE_BEFORE_EX_DATE_AND_EXPECTED_EX_REFERENCE_MATCHES_DAILY_PRE_CLOSE
  unresolved_triggers:
    - DAILY_PRE_CLOSE_DIFFERS_FROM_PRIOR_OBSERVED_CLOSE_WITHOUT_MATCHED_IMPLEMENTED_TERMS
    - IMPLEMENTATION_ANNOUNCEMENT_NOT_STRICTLY_BEFORE_EX_DATE
    - CONFLICTING_DUPLICATE_ACTION_TERMS
    - RIGHTS_ISSUE_OR_SUBSCRIPTION_TERMS_NOT_AVAILABLE
    - ADJ_FACTOR_CHANGE_WITHOUT_RESOLVED_TERMS
    - INVALID_OR_NONFINITE_ECONOMIC_TERMS

four_state_mapping:
  TRADED_VALID:
    requirements: [DAILY_ROW_PRESENT, DAILY_INTERNAL_IDENTITY_PASS, CORPORATE_ACTION_NONE_CONFIRMED_OR_RESOLVED]
    return_formula: (UNADJUSTED_CLOSE*POST_TO_PRE_SHARE_RATIO+GROSS_CASH_DISTRIBUTION-SUBSCRIPTION_CASH_OUTFLOW)/PREVIOUS_UNADJUSTED_CLOSE-1
  OFFICIAL_SUSPENSION:
    requirements: [EXCHANGE_OFFICIAL_SUSPENSION_EVIDENCE, CORPORATE_ACTION_RECONCILED]
    current_source_path_available: false
    provider_suspend_d_sufficient: false
    return_value: 0.0
  CORPORATE_ACTION_UNRESOLVED:
    return_value: null
    feature_use_allowed: false
  SUPPLIER_MISSING_OR_CONFLICT:
    return_value: null
    feature_use_allowed: false
  blanket_zero_fill_allowed: false
  supplier_suspension_candidate_default_state_without_exchange_evidence: SUPPLIER_MISSING_OR_CONFLICT


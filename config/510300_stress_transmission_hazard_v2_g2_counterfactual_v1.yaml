common_sample_contract:
  sample: B2_VS_B1_COMMON_SAMPLE_ONLY
  eligibility_column: b2_vs_b1_eligible
  B1_features:
    - b1_realized_vol20_risk_percentile
    - b1_drawdown20_risk_percentile
    - b1_downside_return5_risk_percentile
  B2_features: [T, T_x_F]
  B2_formula: T_PLUS_T_TIMES_F
  positive_event_weight_sum: 1.0
  negative_risk_day_weight: 1.0
  compare_on_exact_same_rows: true
  event_may_be_split_within_a_prediction_fold: false
  missing_or_no_view_imputation_allowed: false

model_contract:
  family: BINOMIAL_LOGISTIC_REGRESSION
  objective: WEIGHTED_MEAN_NEGATIVE_LOG_LIKELIHOOD_PLUS_HALF_L2_TIMES_SUM_SLOPE_SQUARED
  l2_penalty: 1.0
  intercept_penalized: false
  feature_standardization: NONE_PERCENTILE_INPUTS_ALREADY_ON_ZERO_ONE_SCALE
  B1_slope_constraints: NONNEGATIVE
  B2_beta1_T_constraint: NONNEGATIVE
  B2_beta2_T_x_F_constraint: NONNEGATIVE
  optimizer: SCIPY_L_BFGS_B_ANALYTIC_GRADIENT
  optimizer_max_iterations: 2000
  optimizer_ftol: 1.0e-12
  optimizer_gtol: 1.0e-8
  probability_clip: 1.0e-12
  hyperparameter_grid_allowed: false
  automatic_variable_selection_allowed: false
  sign_reversal_allowed: false
  tree_boosting_or_neural_model_allowed: false

prequential_split_contract:
  method: ANNUAL_EXPANDING_LABEL_MATURED_PREQUENTIAL
  model_vintage_month_day: "01-01"
  training_row_rule: HORIZON_END_DATE_STRICTLY_BEFORE_MODEL_VINTAGE
  training_positive_event_rule: WHOLE_EVENT_MAX_HORIZON_END_STRICTLY_BEFORE_MODEL_VINTAGE
  evaluation_positive_event_vintage: CALENDAR_YEAR_OF_EVENT_MINIMUM_ORIGIN_DATE
  evaluation_negative_vintage: CALENDAR_YEAR_OF_ORIGIN_DATE
  positive_event_rows_use_one_vintage_even_if_EVENT_CROSSES_YEAR: true
  future_calendar_year_training_allowed: false
  evaluation_row_may_train_its_own_prediction: false
  minimum_training_positive_events: 1
  minimum_training_negative_risk_days: 1
  calibration_split_used: false
  first_possible_model_vintage_year: 2016
  last_model_vintage_year: 2026


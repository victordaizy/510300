definitions:
  raw_earnings_yield: "官方权重加权的成分股TTM每股归母净利润除以同日未复权收盘价；亏损公司保留，不以盈利公司PE替代"
  normalized_earnings: "仅审计既有固定定义的可重建性：公司三年正TTM利润中位数与当前TTM收入乘三年TTM净利率中位数等权；不足四个TTM观察则缺失"
  normalized_earnings_yield: "官方权重加权的公司标准化每股盈利除以同日未复权收盘价"
  earnings_yield_spread: "标准化盈利收益率减同日10年期中国国债收益率"
  suspension_price_rule: "停牌日使用该证券在快照日以前最后一笔未复权收盘价并显式标记陈旧天数；不得使用快照日后的价格"
  financial_availability_rule: "available_at取实际公告日f_ann_date，缺失时回退ann_date；任何信号只允许available_at不晚于快照日的版本"
  vendor_valuation_role: "乐咕PE/PB仅作独立交叉核验，不作为VAL-01或VAL-02正式信号输入"
  official_pe_role: "中证官网滚动PE历史仅作独立交叉核验；本地文件为事后下载，不能单独证明历史不可修订的点时版本"


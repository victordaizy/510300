frozen_feature_construction:
  information_clock: T_CLOSE_AND_INFORMATION_AVAILABLE_BY_T_CLOSE
  execution_clock_reserved_for_post_g3: NEXT_TRADING_DAY_OPEN
  missing_value_rule: NO_VIEW_NO_INTERPOLATION
  all_three_channels_required_for_each_composite: true
  causal_percentile:
    formula: EMPIRICAL_MIDRANK_AGAINST_STRICTLY_PRIOR_VALID_OBSERVATIONS_ONLY
    minimum_prior_valid_observations: 1
    current_observation_excluded: true
    first_valid_raw_observation_status: NO_VIEW
    expanding_history_only: true
  M:
    aggregation: MEDIAN_OF_M1_M2_M3_RISK_PERCENTILES
    M1:
      formula: 100_DIVIDED_BY_OFFICIAL_CSI300_PE_MINUS_CHINA_10Y_YIELD_PERCENT
      availability: BOTH_DAILY_VALUES_SHIFTED_TO_NEXT_TRADING_DAY_OPEN
      risk_direction: LOWER_IS_HIGHER_RISK
    M2:
      formula: DR007_WEIGHTED_AVERAGE_PERCENT_MINUS_LAST_ACTUALLY_PUBLISHED_PBOC_7D_RATE_PERCENT
      dr007_availability: NEXT_TRADING_DAY_OPEN_AFTER_RATE_DATE
      policy_rate_availability: RECORDED_OFFICIAL_PUBLICATION_TIMESTAMP
      policy_rate_state_rule: CARRY_LAST_ACTUALLY_PUBLISHED_7D_RATE_ONLY
      risk_direction: HIGHER_IS_HIGHER_RISK
      forbidden_substitutes: [FDR007, R007, FR007, EXCHANGE_REPO_R_007]
    M3:
      formula: FIRST_RELEASE_TSF_STOCK_YOY_PERCENT_MINUS_FIRST_RELEASE_VALUE_THREE_REFERENCE_MONTHS_EARLIER
      availability: RECORDED_AVAILABLE_AT_NOT_LATER_THAN_SIGNAL_CLOSE
      later_revision_backfill_allowed: false
      risk_direction: LOWER_IS_HIGHER_RISK
  F:
    aggregation: MEDIAN_OF_F1_F2_F3_RISK_PERCENTILES
    F1:
      formula: SHARE_OF_TODAY_PIT_300_MEMBERS_WITH_POSITIVE_TOTAL_RETURN_CLOSE_T_DIVIDED_BY_T_MINUS_20_MINUS_1
      window: 20_COMPLETED_CLOSE_TO_CLOSE_MARKET_RETURNS_ENDING_T
      valid_member_count_required: 300
      risk_direction: LOWER_IS_HIGHER_RISK
    F2:
      formula: ETF_20D_TOTAL_RETURN_MINUS_EQUAL_WEIGHT_CURRENT_PIT_MEMBER_20D_TOTAL_RETURN
      etf_dividend_rule: ADD_EX_DATE_CASH_DISTRIBUTION_TO_CLOSE_TO_CLOSE_TOTAL_RETURN
      valid_member_count_required: 300
      historical_official_weights_used: false
      risk_direction: HIGHER_IS_HIGHER_RISK
    F3:
      formula: MEDIAN_OFF_DIAGONAL_PAIRWISE_CORRELATION_OF_EQUAL_WEIGHT_SW_L1_DAILY_TOTAL_RETURNS
      window: 20_COMPLETED_CLOSE_TO_CLOSE_MARKET_RETURNS_ENDING_T
      sector_identity: POINT_IN_TIME_SW_LEVEL1_EACH_RETURN_DATE
      full_member_price_and_industry_coverage_required_each_date: true
      sector_pair_complete_observations_required: 20
      minimum_common_sector_count: 10
      risk_direction: HIGHER_IS_HIGHER_RISK
  T:
    aggregation: MEDIAN_OF_T1_T2_T3_RISK_PERCENTILES
    T1:
      formula: NEGATIVE_OF_F1_BREADTH20_T_MINUS_F1_BREADTH20_T_MINUS_5
      risk_direction: HIGHER_IS_HIGHER_RISK
    T2:
      formula: F3_SECTOR_CORR20_T_MINUS_F3_SECTOR_CORR20_T_MINUS_5
      risk_direction: HIGHER_IS_HIGHER_RISK
    T3:
      formula: SHARE_OF_COMMON_POINT_IN_TIME_SW_L1_SECTORS_WITH_NEGATIVE_COMPOUNDED_5D_RETURN
      full_member_price_and_industry_coverage_required_each_date: true
      risk_direction: HIGHER_IS_HIGHER_RISK
  fixed_scores:
    internal_score: SQRT_F_TIMES_T
    full_mechanism_score: CUBE_ROOT_M_TIMES_F_TIMES_T
    price_baseline: MEDIAN_OF_CAUSAL_RISK_PERCENTILES_OF_NEGATIVE_ETF_20D_TOTAL_RETURN_AND_ETF_20D_REALIZED_VOLATILITY
    realized_volatility: SAMPLE_STANDARD_DEVIATION_OF_20_CLOSE_TO_CLOSE_TOTAL_RETURNS

g2_mechanism_if_temporally_identifiable:
  macro_lead_test:
    predictor: M_T
    response: INTERNAL_SCORE_T_PLUS_5_MINUS_INTERNAL_SCORE_T
    statistic: SPEARMAN_RHO
    required_direction: POSITIVE_STRICT
    subperiods_required_positive: 3
    total_subperiods: 4
    subperiod_selection_or_repartition_allowed: false
  internal_bad10_test:
    internal_score: SQRT_F_TIMES_T
    price_baseline_score: FROZEN_PRICE_BASELINE
    sample_unit: EARLIEST_ORIGIN_OF_EACH_MERGED_BAD10_EVENT_AND_FROZEN_GREEDY_NON_EVENT_BLOCK_ORIGIN
    statistic: ROC_AUC
    pass_rule: INTERNAL_AUC_STRICTLY_GREATER_THAN_PRICE_BASELINE_AUC
    minimum_scoreable_events: 30
    minimum_scoreable_non_event_blocks: 120
  model_training_in_g2: false
  portfolio_metrics_in_g2: false

temporal_identifiability_preflight:
  purpose: NECESSARY_SOURCE_COVERAGE_UPPER_BOUND_BEFORE_FEATURE_OR_LABEL_READ
  internal_history_market_sessions_inclusive: 25
  macro_lead_forward_market_sessions: 5
  necessary_union_market_sessions_inclusive: 30
  minimum_potential_daily_origins_per_subperiod: 20
  required_evaluable_subperiods: 3
  total_subperiods: 4
  daily_necessary_conditions:
    - EXACTLY_300_UNIQUE_PIT_MEMBERS
    - FINITE_POSITIVE_TOTAL_RETURN_CLOSE_PRESENT_FOR_ALL_300_MEMBERS
    - PIT_AVAILABLE_SW_L1_PRESENT_FOR_ALL_300_MEMBERS
  optimistic_upper_bound_assumptions:
    previous_price_needed_for_first_daily_return_ignored: true
    macro_source_missingness_ignored: true
    causal_percentile_warmup_ignored: true
    feature_numeric_validity_ignored: true
  failure_status: NO_VIEW_G2_TEMPORAL_IDENTIFIABILITY_FAILED_STOP_NO_RESCUE
  pass_status: PASS_G2_TEMPORAL_IDENTIFIABILITY_PREFLIGHT_FEATURE_CONSTRUCTION_MAY_BE_FROZEN
  failure_is_terminal_for_v1: true
  repartition_after_result_allowed: false
  current_industry_backfill_allowed: false
  alternative_constituent_panel_allowed: false


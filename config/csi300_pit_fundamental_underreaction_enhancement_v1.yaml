  official_event_archive_start: '2016-01-16'
  feature_event_start: '2018-01-01'
  feature_event_end: '2026-08-14'
  early_period_start: '2018-01-01'
  early_period_end: '2021-12-31'
  late_period_start: '2022-01-01'
  late_period_end: '2026-08-14'
  outcome_cutoff: '2026-08-14'
  incomplete_60d_or_120d_horizons_are_censored_no_view: true


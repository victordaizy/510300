  reverse_signal_after_failure_allowed: false
  pressure_timing_input_allowed: false
  portfolio_construction_allowed: false
  strategy_sharpe_allowed: false
  transaction_cost_evaluation_allowed: false
  position_mapping: false
  order_generation: false
  broker_connection: false
  paper_or_shadow_authorized: false
  live_authorized: false


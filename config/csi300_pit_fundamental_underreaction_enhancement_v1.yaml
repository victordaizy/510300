study:
  study_id: CSI300_PIT_FUNDAMENTAL_UNDERREACTION_ENHANCEMENT_V1
  version: 1.0.0
  chinese_name: 沪深300点时基本面改善—市场反应不足增强策略
  timezone: Asia/Shanghai
  frozen_on: '2026-08-30'
  data_cutoff: '2026-08-14'
  research_scope: PHASE_1_RELATIVE_RETURN_MECHANISM_ONLY
  protocol_status: PRE_REGISTERED_BEFORE_OFFICIAL_FACT_ACQUISITION_AND_ANY_FUTURE_RETURN_READ
  objective: 检验经营改善且质量得到确认、但公告后初始价格反应不足的沪深300成份股，未来60日和120日是否相对510300持续占优

legacy_program_closure:
  timing_program_id: 510300_TIME_SERIES_STRESS_TIMING_PROGRAM
  timing_program_status: CLOSED_ON_EXISTING_HISTORY
  dashboard_id: 510300_STRESS_MECHANISM_DASHBOARD
  dashboard_status: OBSERVATION_ONLY_NO_POSITION_MAPPING
  components:
    - study_id: 510300_STRESS_TRANSMISSION_AND_EXHAUSTION_ATLAS_V1
      required_status: EXPLANATORY_ONLY_SYNCHRONOUS_OR_LAGGING_NO_STRATEGY_PROMOTION_NO_RESCUE
      evidence: reports/research/510300_stress_transmission_and_exhaustion_atlas_v1.json
    - study_id: 510300_REGIME_TRANSITION_ROUTER_V1
      required_status: REJECTED_FROZEN_STATE_IDENTIFIABILITY_GATE_FAILED_NO_PHASE_2_NO_RESCUE
      evidence: reports/research/510300_regime_transition_router_v1.json
    - study_id: 510300_LIQUIDITY_STRESS_LONG_CYCLE_REPLICATION_V1
      required_status: REJECTED_LONG_CYCLE_REPLICATION_NO_PHASE_2_NO_RESCUE
      evidence: reports/research/510300_liquidity_stress_long_cycle_replication_v1.json
  forbidden_reuse:
    - PRESSURE_SCORE_AS_POSITION_INPUT
    - EXHAUSTION_SCORE_AS_ENTRY_OR_REENTRY_INPUT
    - REGIME_ROUTER_AS_SELL_OR_CASH_SWITCH
    - SAME_HISTORY_THRESHOLD_WINDOW_LABEL_OR_MODEL_RESCUE


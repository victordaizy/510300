    access_rule: FORBIDDEN_UNTIL_ALL_DATA_ADMISSION_GATES_PASS

official_fact_contract:
  storage_shape: LONG_ONE_ROW_PER_ANNOUNCEMENT_METRIC
  key:
    - announcement_id
    - metric_id
  required_identifier_columns:
    - announcement_id
    - ts_code
    - report_period
    - period_type
    - event_publication_date
    - official_pdf_url
    - official_pdf_sha256
    - metric_id
    - metric_value_cny
    - statement_scope
    - value_period_scope
    - source_page
    - source_locator
    - source_label
    - verification_status
  required_metrics:
    - OPERATING_REVENUE_YTD
    - OPERATING_PROFIT_YTD
    - PARENT_NET_PROFIT_YTD
    - CORE_PARENT_NET_PROFIT_YTD
    - OPERATING_CASH_FLOW_YTD
    - ACCOUNTS_RECEIVABLE_END
    - INVENTORY_END
    - TOTAL_ASSETS_END
    - TOTAL_LIABILITIES_END
  statement_scope: CONSOLIDATED_ONLY
  currency: CNY
  version_rule: EARLIEST_CHRONOLOGY_VALID_ORIGINAL_FULL_PERIODIC_REPORT
  future_restatement_backfill_forbidden: true
  current_vendor_value_without_pdf_location_forbidden: true
  summary_report_forbidden_when_full_report_exists: true
  corrected_or_restated_document_can_replace_original: false
  percentages_per_share_values_and_unresolved_units_forbidden: true
  unique_label_value_location_required: true
  full_pdf_sha256_required: true
  full_pdf_retention_required: false
  candidate_value_sources:
    - CNINFO_DATA20_OFFICIAL_STRUCTURED_DISPLAY_CANDIDATE_ONLY
    - SSE_XBRL_OFFICIAL_STRUCTURED_DISPLAY_CANDIDATE_ONLY
    - EXISTING_VENDOR_SNAPSHOT_CANDIDATE_ONLY
  admitted_verification_status: PASS_OFFICIAL_ORIGINAL_PDF_LABEL_VALUE_UNIT_VERIFIED

data_admission:
  gates:
    - G1_LEGACY_STRESS_PROGRAM_TERMINAL_STATES_MATCH
    - G2_OFFICIAL_EVENT_CHRONOLOGY_PASS
    - G3_OFFICIAL_PIT_CSI300_MEMBERSHIP_PASS
    - G4_PIT_INDUSTRY_INTERVAL_COVERAGE_PASS
    - G5_VENDOR_REVISION_RISK_IS_QUARANTINED
    - G6_OFFICIAL_PDF_VERIFIED_FACT_ARCHIVE_PASS
    - G7_NO_MARKET_PRICE_OR_FUTURE_RETURN_READ_BEFORE_G1_TO_G6_PASS
  minimum_industry_interval_coverage_ratio: 0.99
  minimum_official_fact_complete_event_ratio: 0.90
  minimum_complete_event_ratio_each_publication_year: 0.80
  minimum_complete_event_ratio_each_industry_with_at_least_50_targets: 0.75
  all_required_metrics_must_be_present_for_each_complete_dependency_document: true
  all_gates_required: true
  pass_status: PASS_CSI300_PIT_FUNDAMENTAL_UNDERREACTION_DATA_CONTRACT_PRICE_READ_ALLOWED
  fail_status: NO_VIEW_CSI300_PIT_FUNDAMENTAL_UNDERREACTION_DATA_CONTRACT_FAILED
  fail_return_evaluation: NOT_ALLOWED

universe:
  definition: OFFICIAL_PIT_CSI300_MEMBERS_ON_FIRST_COMMON_OPEN_STRICTLY_AFTER_PUBLICATION_DATE
  exchanges: [SSE, SZSE]
  period_types: [Q1, H1, Q3, FY]
  require_full_original_periodic_report: true
  require_point_in_time_industry: true
  excluded_industry_l1_codes:
    - 801780.SI
    - 801790.SI
  excluded_industry_reason: 银行与非银金融报表结构不满足同一经营利润现金流营运资本链，预先排除且不得按结果改变
  minimum_trailing_reference_events_same_industry_and_period_type: 30
  trailing_reference_calendar_days: 730

feature_contract:
  information_clock: OFFICIAL_EVENT_PUBLICATION_DATE
  conservative_first_available_session: FIRST_COMMON_OPEN_STRICTLY_AFTER_PUBLICATION_DATE
  reaction_window:
    start: FIRST_COMMON_OPEN_STRICTLY_AFTER_PUBLICATION_DATE
    end: FIFTH_COMMON_SESSION_CLOSE_AFTER_PUBLICATION_DATE
  formation_clock: FIFTH_COMMON_SESSION_CLOSE_AFTER_PUBLICATION_DATE
  future_return_origin: FORMATION_CLOSE
  ttm_formula: CURRENT_YTD_PLUS_PREVIOUS_FY_MINUS_PREVIOUS_SAME_YTD_FY_USES_CURRENT_FY
  no_future_comparative_column_backfill: true
  operating_improvement:
    revenue_growth_acceleration: CURRENT_SINGLE_QUARTER_YOY_REVENUE_GROWTH_MINUS_PREVIOUS_SINGLE_QUARTER_YOY_REVENUE_GROWTH
    operating_margin_change: CURRENT_SINGLE_QUARTER_OPERATING_MARGIN_MINUS_PRIOR_YEAR_SAME_QUARTER_OPERATING_MARGIN
    operating_roa_change: CURRENT_TTM_OPERATING_PROFIT_DIVIDED_BY_AVERAGE_ASSETS_MINUS_PRIOR_YEAR_COMPARABLE
    continuity: AT_LEAST_TWO_OF_LAST_THREE_SEQUENTIAL_REPORTS_HAVE_NONNEGATIVE_MEDIAN_OPERATING_IMPROVEMENT
    strength_percentile: MEDIAN_OF_THREE_TRAILING_PIT_PERCENTILE_RANKS_AFTER_CONTINUITY_PASS
  quality_confirmation:
    cash_conversion_change: TTM_OPERATING_CASH_FLOW_DIVIDED_BY_TTM_OPERATING_PROFIT_CHANGE_VS_PRIOR_YEAR
    working_capital_intensity_change: ACCOUNTS_RECEIVABLE_PLUS_INVENTORY_DIVIDED_BY_TTM_REVENUE_CHANGE_VS_PRIOR_YEAR
    core_profit_share_change: CORE_PARENT_NET_PROFIT_DIVIDED_BY_PARENT_NET_PROFIT_CHANGE_VS_PRIOR_YEAR
    liability_ratio_change: TOTAL_LIABILITIES_DIVIDED_BY_TOTAL_ASSETS_CHANGE_VS_PRIOR_YEAR
    denominator_rule: POSITIVE_AND_NONZERO_REQUIRED_OTHERWISE_NO_VIEW
    pass_rule: AT_LEAST_THREE_OF_FOUR_NONDETERIORATING_AND_NO_METRIC_MISSING
  initial_reaction:
    stock_total_return_minus_510300_total_return: FIRST_OPEN_TO_FIFTH_CLOSE
    percentile: TRAILING_PIT_PERCENTILE_WITHIN_SAME_INDUSTRY_AND_PERIOD_TYPE
  score:
    formula: OPERATING_IMPROVEMENT_STRENGTH_PERCENTILE_MINUS_INITIAL_REACTION_PERCENTILE
    range: [-1.0, 1.0]
    higher_means: STRONGER_VERIFIED_FUNDAMENTAL_IMPROVEMENT_WITH_LESS_INITIAL_PRICE_REACTION
    score_only_when_quality_gate_passes: true
    factor_weight_search_forbidden: true

phase_1_evaluation:
  horizons_market_sessions: [60, 120]
  outcome: STOCK_TOTAL_RETURN_MINUS_510300_TOTAL_RETURN_FROM_FORMATION_CLOSE
  portfolio_return: NOT_CALCULATED
  strategy_sharpe: NOT_CALCULATED
  costs: NOT_APPLICABLE_IN_PHASE_1_EVENT_MECHANISM_TEST
  primary_groups: FIVE_EQUAL_COUNT_SCORE_GROUPS_WITHIN_PUBLICATION_YEAR_AND_PERIOD_TYPE
  gates:
    monotonicity:
      minimum_nonnegative_adjacent_steps_each_horizon: 3
      q5_minus_q1_positive_each_horizon: true
      spearman_score_outcome_positive_each_horizon: true
    chronological_split:
      q5_minus_q1_positive_in_early_and_late_period_each_horizon: true
    industries:
      minimum_industry_event_count: 30
      strictly_more_than_half_eligible_industries_positive_each_horizon: true
    leave_one_year_out:
      q5_minus_q1_positive_for_every_deleted_publication_year_each_horizon: true
    leave_one_industry_out:
      q5_minus_q1_positive_for_every_deleted_eligible_industry_each_horizon: true
    extreme_stock_dependency:
      q5_minus_q1_positive_after_deleting_top_and_bottom_1_percent_stock_outcomes_each_horizon: true
      q5_median_relative_return_positive_each_horizon: true
  all_conditions_required: true
  pass_status: PHASE_1_FUNDAMENTAL_UNDERREACTION_MECHANISM_PASS_PHASE_2_FREEZE_ALLOWED
  fail_status: REJECTED_FROZEN_PHASE_1_FUNDAMENTAL_UNDERREACTION_MECHANISM_FAILED_NO_RESCUE

phase_2_if_phase_1_passes:
  allowed_in_same_run: false
  requires_new_frozen_version: true
  target_holdings: 15_TO_25
  equity_exposure: NORMALLY_FULLY_INVESTED_NO_INDEX_TIMING
  industry_and_large_cap_style_near_csi300: true
  capital_cny: 200000
  commission_rate: 0.0002
  minimum_commission_cny: 5
  board_lot_shares: 100
  realistic_slippage_required: true
  pressure_router_input_forbidden: true

forbidden_after_results:
  - 改财务指标方向权重连续性或质量通过规则救援
  - 改公告后反应窗口形成时钟60日或120日期限救援
  - 改样本起止早晚分割行业排除或最小样本门槛救援
  - 删除不利年份行业股票或极端负收益事件救援
  - 用当前供应商终值更正值或未来比较列回填历史
  - 加入压力路由器技术指标宏观政策基金持仓或机器学习救援
  - 把事件相对收益机制通过称为组合净夏普通过或交易授权


rules:
  required_citic_industry_count: 25
  economic_bucket_membership_per_industry: 1
  cics_weight_sum_tolerance_percent: 0.05
  maximum_weight_age_calendar_days: 31
  industry_return_windows: [5, 20, 60]
  flow_windows: [1, 5]
  theme_cross_sum_allowed: false
  theme_effective_weight_allowed: false
  minimum_industry_return_coverage_weight: 0.95
  maximum_industry_staleness_trading_days: 0
  qualitative_forward_rules:
    minimum_expectation_coverage_of_bucket: 0.50
    early_recovery_maximum_60d_history_percentile: 0.30
    extended_minimum_60d_history_percentile: 0.80
    require_positive_fundamental_score_for_positive_candidate: true
    interpretation: 描述性研究排序，不是拟合阈值、收益预测或仓位信号。

semantics:
  economic_bucket_weight: 互斥行业权重之和，可以在经济大类之间比较和加总。
  theme_core_weight: 主题核心行业当前指数权重覆盖，仅用于该主题内部描述。
  theme_adjacent_weight: 主题邻接行业当前指数权重覆盖，不与核心权重合成所谓真实暴露。
  flow: Tushare个股moneyflow按主动买卖订单分类；不是ETF申赎，也不是国家队资金。
  national_team: 只有带披露期、披露日、账户身份和持股数量的股东记录才可计入；行情资金流不得反推身份。

safety:
  research_only: true
  shadow_only: true
  position_mapping_enabled: false
  order_generation_enabled: false
  broker_connection_enabled: false
  live_trading_enabled: false

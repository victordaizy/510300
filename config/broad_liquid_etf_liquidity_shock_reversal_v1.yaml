protocol:
  candidate_id: "BROAD_LIQUID_ETF_LIQUIDITY_SHOCK_REVERSAL_V1"
  parent_protocol_id: "MULTI_ASSET_ANNUAL_EXCESS_40PCT_HIGH_SHARPE_V1"
  lane: "BROAD_LIQUID_ETF_CROSS_ASSET"
  status: "FROZEN_BEFORE_VISIBLE_OUTCOME"
  frozen_date: "2026-08-27"
  research_only: true
  mechanism: "广泛流动ETF遭遇成交额确认的短期流动性冲击后反转"
  prior_failed_formula_reused: false
  prior_failed_family_parameter_rescue: false
  outcome_used_to_choose_signal_parameters: false

account:
  initial_capital_cny: 500000.0
  user_transaction_fee_rate_per_leg: 0.0001
  cash_annual_rate: 0.015

inputs:
  etf_total_return_panel: "data/raw/all_etf_momentum_v1/etf_total_return_panel.parquet"
  fund_master: "data/raw/all_etf_momentum_v1/fund_master.parquet"
  benchmark_total_return: "data/raw/all_etf_momentum_v1/H00300_total_return.parquet"
  benchmark_price_ohlc: "data/raw/r6/000300_daily.parquet"
  parent_manifest: "config/multi_asset_annual_excess_40pct_high_sharpe_v1_manifest.json"

historical_partition:
  visible_start: "2016-01-04"
  visible_end: "2021-12-31"
  sealed_replication_start: "2022-01-01"
  sealed_replication_end: "2026-08-14"
  sealed_replication_may_open_only_after_visible_pass: true
  retrospective_history_can_verify_target: false

universe:
  master_statuses: ["L", "D", "I"]
  minimum_observed_history_days: 252
  minimum_raw_price_cny: 0.5
  minimum_prior_median_amount_20_cny: 100000000.0
  maximum_order_fraction_of_prior_median_amount: 0.01
  require_point_in_time_list_and_delist_dates: true
  require_observed_non_suspended_signal_bar: true
  require_observed_non_suspended_entry_bar: true

signal:
  family: "LIQUIDITY_SHOCK_SHORT_TERM_REVERSAL"
  lookback_return_trading_days: 5
  volatility_lookback_trading_days: 60
  volatility_window_excludes_signal_day: true
  shock_score_definition: "LOG_RETURN_5D_DIV_PRIOR_60D_LOG_RETURN_STD_DIV_SQRT_5"
  maximum_shock_score: -1.5
  require_negative_1d_return: true
  require_negative_5d_return: true
  amount_lookback_trading_days: 20
  prior_amount_statistic: "MEDIAN_EXCLUDING_SIGNAL_DAY"
  minimum_signal_amount_to_prior_median_ratio: 1.0
  signal_information_time: "SIGNAL_DAY_CLOSE"
  first_executable_time: "NEXT_BENCHMARK_TRADING_DAY_OPEN"
  prefreeze_signal_coverage_only_no_future_return_used: true

portfolio:
  maximum_positions: 5
  target_fraction_per_position: 0.20
  board_lot_shares: 100
  minimum_trade_notional_cny: 5000.0
  holding_period_trading_days_open_to_open: 5
  ranking:
    - "shock_score_ascending"
    - "prior_median_amount_20_descending"
    - "con_code_ascending"
  diversification_correlation_lookback_trading_days: 60
  diversification_minimum_pair_observations: 50
  maximum_pairwise_correlation: 0.95
  duplicate_security_position_allowed: false
  entry_open_gap_lower_bound: -0.095
  entry_open_gap_upper_bound: 0.095
  exit_open_gap_lower_bound: -0.095
  blocked_exit_policy: "CARRY_UNTIL_FIRST_ELIGIBLE_OPEN"
  terminal_open_positions_policy: "FAIL_NO_FORCED_OR_FICTITIOUS_EXIT"
  stop_new_entries_if_scheduled_exit_after_partition_end: true
  missing_position_mark_policy: "LAST_OBSERVED_TOTAL_RETURN_CLOSE_WITH_STALE_FLAG"

costs:
  etf_user_fee_rate_per_leg: 0.0001
  etf_minimum_user_fee_cny: 0.0
  conservative_exchange_handling_fee_rate_per_leg: 0.00004
  base_slippage_bps_per_leg: 5.0
  stress_slippage_bps_per_leg: 15.0
  base_market_impact_bps_per_leg: 1.0
  stress_market_impact_bps_per_leg: 3.0
  stamp_duty_rate: 0.0
  omitted_cost_is_failure: true

risk:
  maximum_gross_exposure: 1.0
  maximum_absolute_net_exposure: 1.0
  short_sale_allowed: false
  borrowing_allowed: false
  leverage_allowed: false
  derivative_position_allowed: false

visible_gates:
  benchmark: "H00300_TOTAL_RETURN"
  annualization_trading_days: 242
  minimum_annualized_net_excess: 0.40
  minimum_strategy_net_sharpe: 1.50
  rolling_window_trading_days: 242
  minimum_rolling_excess_median: 0.40
  minimum_rolling_sharpe_median: 1.50
  minimum_non_overlapping_242d_blocks: 3
  minimum_target_qualified_blocks: 2
  bootstrap:
    method: "PAIRED_MOVING_BLOCK"
    repetitions: 5000
    block_length_trading_days: 20
    random_seed: 20260827
    lower_quantile: 0.025
    minimum_excess_lower_bound: 0.0
    minimum_sharpe_lower_bound: 1.0
  base_and_stress_must_both_pass: true
  data_quality_complete_required: true
  capacity_pass_required: true

historical_evidence_limits:
  immutable_vendor_vintage_chain_available: false
  historical_bid_ask_snapshots_available: false
  fund_master_is_current_archive_with_point_in_time_dates: true
  slippage_and_impact_are_modeled_not_observed: true
  performance_screen_label: "DISCOVERY_ONLY_CURRENT_ARCHIVE_AND_MODELED_EXECUTION"
  historical_result_may_authorize_paper_or_live: false

outputs:
  manifest: "config/broad_liquid_etf_liquidity_shock_reversal_v1_manifest.json"
  visible_daily_returns: "data/research/broad_liquid_etf_liquidity_shock_reversal_v1/visible_daily_returns.parquet"
  visible_trades: "data/research/broad_liquid_etf_liquidity_shock_reversal_v1/visible_trades.parquet"
  visible_report_json: "reports/research/broad_liquid_etf_liquidity_shock_reversal_v1_visible.json"
  visible_report_markdown: "reports/research/BROAD_LIQUID_ETF_LIQUIDITY_SHOCK_REVERSAL_V1_VISIBLE.md"
  sealed_daily_returns: "data/research/broad_liquid_etf_liquidity_shock_reversal_v1/sealed_daily_returns.parquet"
  sealed_trades: "data/research/broad_liquid_etf_liquidity_shock_reversal_v1/sealed_trades.parquet"
  sealed_report_json: "reports/research/broad_liquid_etf_liquidity_shock_reversal_v1_sealed.json"
  sealed_report_markdown: "reports/research/BROAD_LIQUID_ETF_LIQUIDITY_SHOCK_REVERSAL_V1_SEALED.md"

safety:
  paper_position_generation: false
  order_generation: false
  broker_connection: false
  live_trading_authorized: false

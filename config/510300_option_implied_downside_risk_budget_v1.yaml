    - request_parameters
    - request_started_at
    - response_received_at
    - success
    - row_count
    - returned_columns
    - error_code
    - error_message
    - response_sha256
    - endpoint_origin
  endpoint_origin_rule: SCHEME_AND_HOST_ONLY_NO_CREDENTIALS
  core_strategy_blocked_if_any_fail:
    - trade_cal
    - fund_daily
    - fund_div
    - opt_basic
    - opt_daily
    - shibor
  etf_mins_failure_state: PREDICTION_RESEARCH_ALLOWED_FINAL_EXECUTION_BACKTEST_BLOCKED
  overall_pass_state: PASS_G0_PERMISSION_PROBE
  core_failure_state: CORE_STRATEGY_BLOCKED


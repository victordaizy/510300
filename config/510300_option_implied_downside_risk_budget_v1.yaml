    - -0.05
  strike_interpolation_variable: TOTAL_VARIANCE
  strike_interpolation_method: LINEAR_BETWEEN_ADJACENT_STRIKES
  strike_extrapolation_allowed: false
  maturity_targets_calendar_days:

    volume_strictly_positive: true
    open_interest_strictly_positive: true
    minimum_dte_calendar_days: 5
    maximum_dte_calendar_days: 120
    duplicate_ts_code_trade_date_allowed: false
    no_arbitrage_bounds_required: true
  shibor_rate:
    input_unit: PERCENT_PER_ANNUM
    internal_unit: DECIMAL_PER_ANNUM
    tenors_calendar_days:

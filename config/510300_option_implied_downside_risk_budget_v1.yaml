protocol:
  model_id: 510300_OPTION_IMPLIED_DOWNSIDE_RISK_BUDGET_V1
  version: 1.0.0
  state: PROTOCOL_FROZEN_BEFORE_FIRST_API_PROBE
  research_stage: DATA_ADMISSION_ONLY
  historical_evaluation_label: RESEARCH_OBSERVED_HISTORICAL
  validated_alpha: false
  live_trading_authorized: false
  position_impact: 0
  tradable_universe:
    - 510300.SH
    - CASH_CNY
  source_text_cash_alias: CNY_CASH_ONLY
  options_role: SIGNAL_ONLY_NOT_TRADABLE
  start_date: '2019-12-23'
  end_date_rule: LAST_COMPLETED_SSE_TRADING_DAY_AVAILABLE_AFTER_ALL_FROZEN_SOURCE_CLOCKS
  timezone: Asia/Shanghai
  daily_signal_formation_not_before: '20:15:00'
  future_return_reads_allowed_during_phases_a_to_e: false
  portfolio_return_reads_allowed_before_g0_to_g3_pass: false
  broker_connection_enabled: false
  order_generation_enabled: false

source_contract:
  provider: TUSHARE_COMPATIBLE_PROXY
  transport: HTTPS_POST_JSON
  authentication: X_API_KEY_HEADER_EPHEMERAL_ONLY
  accept_encoding: gzip
  endpoint_allowlist:
    - https://fast.xiaodefa.cn
    - https://tt.xiaodefa.cn
  selected_endpoint: https://tt.xiaodefa.cn
  endpoint_selection_evidence: LOWEST_READ_ONLY_ROOT_GET_LATENCY_AT_2026_09_04_PREFLIGHT
  token_rules:
    allowed_inputs:
      - interactive_hidden_prompt
      - TUSHARE_PROXY_TOKEN_environment_variable
    persist_token: false
    include_in_logs: false
    include_in_receipts: false
    include_in_reports: false
    include_in_manifests: false
    include_in_commits: false
  minimum_request_interval_seconds: 0.65
  connect_timeout_seconds: 15
  read_timeout_seconds: 90
  maximum_attempts: 5
  retry_delays_seconds:
    - 2
    - 4
    - 8
    - 16
  retry_only:
    - CONNECTION_ERROR
    - TIMEOUT
    - HTTP_429
    - HTTP_500
    - HTTP_502
    - HTTP_503
    - HTTP_504
  no_retry:
    - AUTHENTICATION_FAILURE
    - ENTITLEMENT_FAILURE
    - INVALID_PARAMETER
    - EMPTY_SUCCESS_RESPONSE
  documentation_checked_at: '2026-09-04T20:11:45+08:00'
  documentation:
    proxy_usage: https://www.yuque.com/aimiao-ke7gj/vosp6x/tsdwcwttw15976iv
    trade_cal: https://tushare.pro/document/2?doc_id=26
    fund_daily: https://tushare.pro/document/2?doc_id=127
    fund_div: https://tushare.pro/document/2?doc_id=120
    opt_basic: https://tushare.pro/document/2?doc_id=158
    opt_daily: https://tushare.pro/document/2?doc_id=159
    etf_mins: https://tushare.pro/document/2?doc_id=387
    shibor: https://tushare.pro/document/2?doc_id=149
    permission_timetable: https://tushare.pro/document/1?doc_id=108
    sse_510300_option_listing: https://www.sse.com.cn/lawandrules/sselawsrules2025/option/c/c_20250611_10781547.shtml
    sse_etf_faq: https://www.sse.com.cn/assortment/fund/etf/question/
  source_clock:
    trade_cal: PERIODIC
    fund_daily: DAILY_POST_CLOSE
    fund_div: PERIODIC
    opt_basic: DAILY_20_00_APPROX
    opt_daily: DAILY_17_00_APPROX
    shibor: DAILY_11_00_APPROX
    etf_mins: HISTORICAL_ON_DEMAND
  availability_rule:
    signal_date_inputs: SAME_TRADE_DATE_DATA_RETRIEVED_NOT_BEFORE_20_15_ASIA_SHANGHAI
    latest_end_date: MINIMUM_COMMON_AVAILABLE_COMPLETED_TRADE_DATE_ACROSS_REQUIRED_DAILY_INPUTS
    missing_same_day_shibor: NO_VIEW
    forward_fill_allowed: false
    cross_date_interpolation_allowed: false


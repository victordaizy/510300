    - RETURN_SELECTED_FEATURES

labels:
  execution_price:
    date: NEXT_TRADING_DAY
    window_start: '09:35:00'
    window_end: '09:39:59'
    method: ONE_MINUTE_AMOUNT_WEIGHTED_VWAP
  primary:
    name: V5
    horizon_trading_days: 5
    definition: ANNUALIZED_SUM_OF_FIVE_FORWARD_LOG_TOTAL_RETURN_SQUARES_DIVIDED_BY_5_TIMES_252
    matured_at: FIFTH_FUTURE_TRADING_DAY_AFTER_CLOSE
  optional_tail:
    name: TAIL5
    threshold: -0.03
    horizon_trading_days: 5
    overlapping_positive_labels_merge_to_events: true
    minimum_independent_events: 40
    minimum_events_per_era: 5
    insufficient_event_state: NO_VIEW
  output_variance: data/curated/510300_future_risk_labels/510300_future_variance_5d.parquet
  output_tail_events: data/curated/510300_future_risk_labels/510300_tail5_event_ledger.parquet

models:
  b0:
    type: EXPANDING_MATURED_LABEL_MEAN
  b1:
    type: EXP_LINK_NONNEGATIVE_QLIKE_RIDGE
    inputs: B1_PRICE_FEATURES
  b2:
    type: EXP_LINK_NONNEGATIVE_QLIKE_RIDGE
    inputs: B1_PLUS_B2_FEATURES
  variance_loss: QLIKE
  l2_lambda: 1.0
  coefficient_lower_bound: 0.0
  standardization: TRAINING_SAMPLE_MEAN_AND_STANDARD_DEVIATION_ONLY
  training_window: EXPANDING
  minimum_matured_training_days: 504
  refit: FIRST_TRADING_DAY_OF_EACH_MONTH
  coefficient_hold: CONSTANT_WITHIN_MONTH
  label_lag_trading_days_minimum: 5
  forbidden_model_selection:
    - LAMBDA_GRID_SEARCH
    - FEATURE_SELECTION
    - SIGN_REVERSAL
    - RANDOM_FOREST
    - XGBOOST
    - NEURAL_NETWORK
    - SHARPE_BASED_MODEL_SELECTION
  tail_model:
    type: NONNEGATIVE_LOGISTIC_RIDGE
    l2_lambda: 1.0
    daily_natural_frequency_weights: true
    event_reweighting_allowed: false
    inference_clusters:
      - EVENT
      - CALENDAR_MONTH

position_mapping:
  risk_reference: EXPANDING_MEDIAN_OF_SQRT_MATURED_V5
  volatility_weight: MIN_1_SIGMA_REFERENCE_OVER_PREDICTED_SIGMA
  tail_weight: MIN_1_BASE_RATE_OVER_PREDICTED_TAIL_PROBABILITY
  tail_weight_if_tail_model_disabled: 1.0
  raw_weight: MIN_VOLATILITY_WEIGHT_AND_TAIL_WEIGHT
  discrete_levels:
    - 0.0
    - 0.25
    - 0.5
    - 0.75
    - 1.0
  discretization: FLOOR_TO_QUARTER
  decrease_rule: NEXT_TRADING_DAY_IMMEDIATE_TO_TARGET
  increase_rule: MAXIMUM_0_25_PER_TRADING_DAY

execution:
  initial_capital_cny: 200000
  commission_rate: 0.0002
  minimum_commission_cny: 5
  lot_size_shares: 100
  t_plus_one: true
  cash_return: 0.0
  base_slippage_per_leg: 0.0005
  stress_slippage_per_leg: 0.0010
  execution: NEXT_DAY_09_35_TO_09_39_VWAP
  leverage_allowed: false
  shorting_allowed: false
  option_trading_allowed: false
  intraday_t_allowed: false
  stop_loss_take_profit_allowed: false
  theoretical_mid_execution_allowed: false

evaluation:
  eras:
    count: 4
    boundary_rule: FOUR_CONTIGUOUS_NEAR_EQUAL_VALID_PREDICTION_DATE_COUNTS_AFTER_FIRST_504_DAY_TRAINING_POINT
    freeze_before_prediction_results: true
  prediction_scheme: STRICT_PREQUENTIAL_MATURED_INFORMATION_ONLY
  random_kfold_allowed: false
  bootstrap_units:
    - CALENDAR_MONTH
    - FIVE_DAY_OVERLAPPING_LABEL_BLOCK
    - TAIL_EVENT_BLOCK
  portfolios:
    p0: 510300_TOTAL_RETURN_BUY_AND_HOLD
    p1: CONSTANT_510300_CASH_MATCHED_AVERAGE_EXPOSURE
    p2: B1_PRICE_RISK_BUDGET
    p3: B2_OPTION_ENHANCED_RISK_BUDGET
  deflated_sharpe_trial_count_scope: ENTIRE_510300_PROJECT_CUMULATIVE_EXPERIMENT_COUNT

gates:
  g0:
    required_core_apis:
      - fund_daily
      - fund_div
      - opt_basic
      - opt_daily
      - shibor
      - trade_cal
    official_underlying_cross_check: true
    immutable_raw_hashes_complete: true
    duplicate_primary_keys_maximum: 0
    clean_new_process_replay: true
    final_portfolio_additional_requirements:
      etf_mins_available: true
      execution_window_coverage_minimum: 0.98
  g1:
    minimum_valid_surface_days: 1000
    minimum_overall_valid_coverage: 0.80
    minimum_each_complete_calendar_year_coverage: 0.65
    legal_30d_and_60d_interpolation: true
    no_arbitrage_pass: true
    put_call_parity_pass: true
    missing_state_preserved_as_no_view: true
  g2:
    b1_vs_b0_prequential_qlike_improvement_strictly_positive: true
    minimum_positive_eras: 3
    one_sided_block_bootstrap_90pct_lower_bound_strictly_positive: true
  g3:
    b2_vs_b1_qlike_improvement_minimum: 0.05
    log_variance_mse_improvement_strictly_positive: true
    minimum_positive_eras: 3
    one_sided_block_bootstrap_90pct_lower_bound_strictly_positive: true
    minimum_prequential_prediction_days: 750
    calibration_slope_minimum: 0.75
    calibration_slope_maximum: 1.25
    mean_predicted_to_realized_variance_minimum: 0.85
    mean_predicted_to_realized_variance_maximum: 1.15
    failure_state: MODEL_STATE_REJECTED_FROZEN_NO_RESCUE
    portfolio_evaluation_if_fail: NOT_ALLOWED
  g4:
    c2_vs_c1_brier_improvement_minimum: 0.02
    c2_vs_c1_log_loss_improvement_minimum: 0.02
    minimum_eras_improving_both: 3
    one_sided_event_block_bootstrap_90pct_lower_bound_strictly_positive: true
    calibration_slope_minimum: 0.70
    calibration_slope_maximum: 1.30
    failure_state: TAIL_CAP_DISABLED
  g5:
    base_cost_net_sharpe_minimum: 1.20
    p3_minus_p2_net_sharpe_minimum: 0.20
    p3_minus_same_exposure_sharpe_strictly_positive: true
    maximum_drawdown_reduction_vs_buy_hold_minimum: 0.30
    net_cagr_minimum: 0.04
    net_cagr_vs_buy_hold_shortfall_maximum: 0.02
    upside_capture_minimum: 0.70
    downside_capture_maximum: 0.60
    average_510300_weight_minimum: 0.40
    average_510300_weight_maximum: 0.90
    annualized_equivalent_round_trips_maximum: 8
    minimum_eras_p3_excess_vs_p2_positive: 3
    maximum_single_stress_episode_total_excess_contribution: 0.30
    stress_slippage_net_sharpe_minimum: 0.90
    stress_slippage_net_excess_strictly_positive: true
    equivalent_round_trip_definition: HALF_SUM_ABSOLUTE_WEIGHT_CHANGES

phase_state_machine:
  a_freeze:
    reads_future_labels: false
    reads_portfolio_returns: false
  b_raw_download:
    order:
      - trade_cal
      - fund_daily
      - fund_div
      - opt_basic
      - opt_daily
      - shibor
      - etf_mins
    reads_future_labels: false
    reads_portfolio_returns: false
  c_data_admission:
    allowed_outputs:
      - CONTRACT_MAP
      - SURFACE_QUALITY_LEDGER
      - DAILY_SURFACE
      - G0_G1_ADJUDICATION
    stop_if_g1_fails: true
  d_labels:
    allowed_only_after_g0_g1_pass: true
    freeze_era_boundaries_before_label_distribution_read: true
  e_prediction:
    order:
      - B0
      - B1
      - B2
      - C1_C2_IF_EVENT_GATE
    portfolio_outputs_allowed: false
  f_model_freeze:
    b2_fail: STOP_BRANCH
    b2_pass_c2_fail: VOLATILITY_WEIGHT_ONLY
    b2_pass_c2_pass: MIN_VOLATILITY_AND_TAIL_WEIGHT
  g_one_shot_portfolio:
    allowed_only_after_g0_g1_g2_g3_pass: true
    run_limit: 1
  h_forward:
    entry_state: SHADOW_ONLY_FORWARD
    first_stage_new_trading_days: 252
    formal_stage_new_trading_days: 504
    real_position_impact: 0

no_rescue:
  terminal_core_failure_state: HISTORICAL_REJECTED_FROZEN_NO_RESCUE
  forbidden_changes_after_result_read:

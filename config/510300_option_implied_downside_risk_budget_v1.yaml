    - exercise_price
    - opt_multiplier
  nearest_pairs_to_underlying_close_maximum: 5
  minimum_pairs_per_expiry: 3
  forward_from_parity: K_PLUS_EXP_RT_TIMES_CALL_MINUS_PUT
  forward_aggregation: MEDIAN
  maximum_parity_mad_over_forward: 0.005
  parity_failure_state: NO_VIEW_PARITY_DISPERSION
  log_moneyness: LN_K_OVER_FORWARD
  otm_price_choice:
    k_below_zero: PUT
    k_at_or_above_zero: CALL
  implied_volatility_model: BLACK_76
  implied_volatility_solver: BRENT_BOUNDED
  minimum_log_moneyness: -0.12
  maximum_log_moneyness: 0.12
  minimum_implied_volatility: 0.01
  maximum_implied_volatility: 2.0
  minimum_valid_strikes_per_expiry: 5
  require_strikes_both_sides_of_zero: true
  required_strike_targets:

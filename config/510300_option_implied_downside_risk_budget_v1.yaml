  maturity_interpolation_variable: TOTAL_VARIANCE
  maturity_interpolation_method: LINEAR_BETWEEN_BRACKETING_EXPIRIES
  maturity_extrapolation_allowed: false
  missing_maturity_bracket_state: NO_VIEW_NO_MATURITY_BRACKET
  outputs:

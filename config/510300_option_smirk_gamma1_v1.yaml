protocol:
  project_id: 510300_OPTION_SMIRK_GAMMA1_V1
  state: DISCOVERY_EXTERNAL_FORMULA_TRANSFER_PRE_OUTCOME_FREEZE
  purpose: 将风险中性偏度对认购期权收益的负向预测迁移为2万元单合约策略
  deployable_strategy: false
  factor_count: 1

external_sources:
  predictive_paper:
    title: The Dynamics of Option Volatility Smirk and Option Returns Predictability
    doi: 10.1002/fut.22590
    url: https://www.researchgate.net/publication/391086786_The_Dynamics_of_Option_Volatility_Smirk_and_Option_Returns_Predictability_Evidence_From_Chinese_SSE50_ETF_Options
    disclosed_relation: 风险中性偏度对未来1日至4周认购期权Delta中性收益为负向预测
  curve_method:
    title: The implied volatility smirk
    doi: 10.1080/14697680701410247
    formula: IV(xi)=gamma0*(1+gamma1*xi+gamma2*xi^2)
  transfer_warning: 原论文使用50ETF及Delta中性收益，本协议使用300ETF单合约只做多，属于迁移检验

dates:
  feature_history_start: '2020-01-02'
  strategy_start: '2021-01-04'
  development_end: '2023-12-29'
  reserved_validation_start: '2024-01-01'
  reserved_validation_end: '2024-12-31'
  final_holdout_start: '2025-01-01'
  final_holdout_end: '2026-08-14'
  validation_or_holdout_read_authorized: false


smirk_construction:
  risk_free_annual_rate: 0.015
  target_constant_maturity_calendar_days: 30
  minimum_distinct_strikes_per_expiry: 5
  implied_volatility_minimum: 0.03
  implied_volatility_maximum: 2.00
  use_otm_options_only: true
  forward_price: 同到期月认购认沽收盘价差绝对值最小的行权价按认沽认购平价推导
  atm_volatility: 行权价最接近远期价格的认购认沽隐含波动率均值
  standardized_moneyness: log(strike/forward)/(atm_iv*sqrt(dte_years))
  fit: 以成交量为权重拟合IV=alpha0+alpha1*xi+alpha2*xi^2
  gamma1: alpha1/alpha0
  constant_maturity: 用30日前后两个到期月的gamma1按日历期限线性插值

signal:
  factor_name: gamma1_30d
  trailing_window_trading_days: 252
  lower_quantile: 0.20
  threshold_lag_trading_days: 1
  action: 当日gamma1_30d不高于此前252日的20%分位数时买入认购，否则持有现金

schedule:
  signal_time: t日收盘后
  entry_time: t+1交易日
  exit_time: 入场后第20个交易日
  holding_trading_days: 20
  overlap_allowed: false
  next_signal_may_use_exit_day_close: true

contract_selection:

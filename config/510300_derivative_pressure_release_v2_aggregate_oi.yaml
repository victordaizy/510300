  parent_v1_manifest_content_sha256: 5576c79749c4c07b21338b37145194248324dbae145d30d0fb3893825b4a7079
  parent_v1_adjudication_sha256: 981f4c39804ab4f9bc6979b6a175ce41df3e2ec991d6803d9e14498cdcdb453a

scope:

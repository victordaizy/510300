    risk_flags: [TERMINOLOGY_MAPPING_TRAP]
  - entity_id: REAL_ESTATE_INFRASTRUCTURE
    entity_name_cn: 地产基建
    direction: NEGATIVE
    confidence: HIGH
    support_article_ids: []
    adverse_article_ids: [12, 21, 122, 168]

    risk_flags: [NO_ACCELERATION_EVIDENCE]
  - entity_id: CONSUMER_DISCRETIONARY
    entity_name_cn: 可选消费
    direction: NEGATIVE
    confidence: MEDIUM
    support_article_ids: []
    adverse_article_ids: [21, 122, 168]

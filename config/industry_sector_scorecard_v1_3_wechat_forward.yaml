    risk_flags: [AUTO_SALES_CONTRACTION, APPLIANCE_PRODUCTION_CONTRACTION]
  - entity_id: HEALTHCARE
    entity_name_cn: 医疗健康
    direction: POSITIVE
    confidence: MEDIUM
    support_article_ids: [77, 122, 161]
    adverse_article_ids: []
    thesis: 医疗设备产量、行业盈利预测及龙头订单出现改善，但现有价格阶段偏后且历史赔率不利，属于鱼尾风险观察而非追涨。
    risk_flags: [LATE_PRICE_PHASE, SINGLE_COMPANY_CONFIRMATION]
  - entity_id: MIDSTREAM_MATERIALS
    entity_name_cn: 中游材料
    direction: NEGATIVE
    confidence: MEDIUM
    support_article_ids: []
    adverse_article_ids: [21, 122, 168]

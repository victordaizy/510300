    entity_name_cn: 数字内容与通信
    direction: POSITIVE
    confidence: MEDIUM
    support_article_ids: [23, 86, 161]
    adverse_article_ids: [167]
    thesis: 传媒与计算机获得主动资金和盈利预测支持，AI价值可能从基础设施向应用迁移，但通信资金流仍有分歧。
    risk_flags: [APPLICATION_MONETIZATION_UNPROVEN]
  - entity_id: ADVANCED_MANUFACTURING
    entity_name_cn: 先进制造
    direction: POSITIVE
    confidence: HIGH
    support_article_ids: [21, 72, 122, 162, 168]
    adverse_article_ids: [21, 126]
    thesis: 装备制造、机器人、锂电排产和设备需求改善构成定性领先信号；汽车终端和光伏主产业链仍是拖累。
    risk_flags: [AUTO_DEMAND_WEAK, SOLAR_OVERcapacity]
  - entity_id: FINANCE
    entity_name_cn: 金融
    direction: MIXED
    confidence: MEDIUM
    support_article_ids: [171, 184]
    adverse_article_ids: [161, 171]
    thesis: 居民存款向非银迁移提高金融资产购买力，但弱信贷、银行净息差和ETF及北上流出限制金融板块盈利弹性。
    risk_flags: [WEAK_CREDIT_DEMAND, BANK_NET_INTEREST_MARGIN]
  - entity_id: CONSUMER_STAPLES
    entity_name_cn: 必选消费
    direction: NEGATIVE
    confidence: MEDIUM
    support_article_ids: []
    adverse_article_ids: [122]

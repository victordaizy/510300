  missing_dependency_status: NO_VIEW_REQUIRED_OFFICIAL_PERIODIC_REPORT_MISSING
  duplicate_document_download_forbidden: true

official_pdf:
  accepted_host: static.cninfo.com.cn
  search_page_url: https://www.cninfo.com.cn/new/commonUrl/pageOfSearch?url=disclosure/list/search
  query_url: https://www.cninfo.com.cn/new/hisAnnouncement/query
  pdf_base_url: https://static.cninfo.com.cn/
  required_header: '%PDF-'
  timeout_seconds: 120
  maximum_attempts_per_run: 3
  retry_backoff_seconds: [1, 2]
  workers_default: 6
  download_chunk_bytes: 1048576
  maximum_pdf_bytes: 104857600
  retain_full_pdf: false
  retain_full_pdf_sha256: true
  same_event_official_full_pdf_sibling_fallback: true
  sibling_query_page_size: 30
  sibling_maximum_candidates: 10
  sibling_required_same_security_report_period_and_publication_date: true
  sibling_selection_rule: FIRST_COMPLETE_NINE_METRIC_PDF_BY_OFFICIAL_TIMESTAMP_THEN_ANNOUNCEMENT_ID
  sibling_excluded_title_tokens: [摘要, 取消, 更正, 修订, 更新后, 英文, 英文版, 提示性公告]

extraction:
  parser_version: CSI300_PIT_OFFICIAL_FINANCIAL_FACTS_PDFIUM_PDFPLUMBER_V1_4_0
  engine: pypdfium2_text_with_pdfplumber_strict_table_cell_and_summary_table_fallback
  statement_scope: CONSOLIDATED_ONLY
  statement_section_rule: COHERENT_BALANCE_INCOME_CASH_ORDER_WITH_SAME_PAGE_TABLE_HEADER_OR_PREVIOUS_PAGE_TAIL_HEADING_AND_NEXT_PAGE_TABLE_HEADER
  current_period_column_rule: Q1_H1_FY_FIRST_AMOUNT_AFTER_PROVABLE_OPTIONAL_NOTE_Q3_FROZEN_YTD_COLUMN
  statement_note_rule: SKIP_PLAIN_PARENTHESIZED_OR_NESTED_NOTE_TOKENS_ONLY_WHEN_COLUMN_CONTEXT_PROVES_A_FOLLOWING_AMOUNT
  local_unit_rule: NEAREST_EXPLICIT_UNIT_IN_THE_LABEL_AMOUNT_WINDOW_THEN_SECTION_CONSENSUS
  q3_income_ytd_rule: IF_BOTH_7_TO_9_AND_1_TO_9_COLUMNS_EXIST_SELECT_THIRD_AMOUNT_OTHERWISE_SELECT_FIRST_YTD_AMOUNT
  core_profit_rule: PDFPLUMBER_SUMMARY_TABLE_FIRST_CURRENT_PERIOD_AMOUNT_FOR_Q1_H1_FY_AND_FROZEN_YTD_MIDPOINT_FOR_Q3
  explicit_standalone_dash_amount_rule: ZERO_ONLY_WHEN_DASH_OCCUPIES_THE_CURRENT_AMOUNT_CELL
  explicit_blank_inventory_rule: ZERO_ONLY_WHEN_OFFICIAL_TABLE_EXACT_INVENTORY_ROW_HAS_CURRENT_AND_PRIOR_AMOUNT_CELLS_ALL_BLANK
  combined_receivable_line_rule: FORBIDDEN_AS_ACCOUNTS_RECEIVABLE_USE_PURE_ACCOUNTS_RECEIVABLE_FROM_CONSOLIDATED_NOTES
  ocr_allowed: false
  scanned_or_textless_statement_status: NO_VIEW_REQUIRED_OFFICIAL_FINANCIAL_FACTS_INCOMPLETE
  units: [元, 千元, 万元, 百万元, 亿元]
  currency: CNY
  required_metrics:
    - OPERATING_REVENUE_YTD
    - OPERATING_PROFIT_YTD
    - PARENT_NET_PROFIT_YTD
    - CORE_PARENT_NET_PROFIT_YTD
    - OPERATING_CASH_FLOW_YTD
    - ACCOUNTS_RECEIVABLE_END
    - INVENTORY_END
    - TOTAL_ASSETS_END
    - TOTAL_LIABILITIES_END
  every_metric_requires_page_label_raw_value_unit_and_locator: true
  admitted_verification_status: PASS_OFFICIAL_ORIGINAL_PDF_LABEL_VALUE_UNIT_VERIFIED
  ambiguous_or_missing_value_status: NO_VIEW_REQUIRED_OFFICIAL_FINANCIAL_FACTS_INCOMPLETE


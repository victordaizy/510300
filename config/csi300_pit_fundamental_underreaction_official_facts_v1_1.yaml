dependency_contract:
  fiscal_quarter_frequency: Q_DEC
  quarters_including_target: 9
  reason: 覆盖当前与前8个标准季度，以构造单季度同比加速度、最近三期连续性、当前及上年可比TTM和期末资产平均值

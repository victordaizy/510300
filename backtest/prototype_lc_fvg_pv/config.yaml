  question: "LC 扫流动性后形成的分钟 FVG，在回踩并获得 PV 与 VWAP 确认后，是否具有覆盖交易成本的方向性优势？"
  symbol: "510300.SH"
  data_file: "data/raw/market/510300_1m_tushare_raw.parquet"

feature:
  price_tick: 0.001
  liquidity_lookback_bars: 20
  liquidity_minimum_bars: 12
  atr_window_bars: 14
  sweep_to_fvg_maximum_bars: 6
  sweep_to_fvg_maximum_minutes: 10
  minimum_fvg_atr_fraction: 0.10

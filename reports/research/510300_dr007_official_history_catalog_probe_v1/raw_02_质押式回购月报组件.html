<script type="text/javascript">
$(function(){
	var jsonYearMonth = '';

    $('#pr-mth-bltn-tran').sanDatasheet({
        url: DURL+'currency/pr-mth-bltn-tran.json',
		wrapAllowed: true,
        dataHandler: function(data){
            var $sheet = this;
            var dataInData = data['data'];
			var ym = dataInData['showYearMonth'];
			$('#title-pr-mth-bltn-date').text(ym);
            jsonYearMonth = dataInData['optionJson'];
			jsonYearSelect('pr-mth-bltn-year', 'pr-mth-bltn-month', jsonYearMonth, ym.split('-'));
			$('#mon-pr-excel').attr("href",DQSURL+'cm-u-query-mlrp/PrMthBltnExcel?yearMonth='+dateConvertor(ym,'YYYY-MM','-','YYYYMM'));
            return _example_dataFormatter($sheet, dataInData['updateTime'], data['records']);
        },
        onDone: function(){
            var $this = this;
            var d = $this.attr('data-date');
            //$('#pr-mth-bltn-update-date').text(dateConvertor(d, 'DD MMM YYYY hh:mm', ' ', 'YYYY-MM-DD hh:mm'));
        }
    });

    $('#pr-mth-bltn-bala').sanDatasheet({
        url: DURL+'currency/pr-mth-bltn-bala.json',
		wrapAllowed: true,
        dataHandler: function(data){
            var $sheet = this;
            return _example_dataFormatter($sheet, data['data']['updateTime'], data['records']);
        }
    });
    
	$('#pr-mth-bltn-inst').sanDatasheet({
        url: DURL+'currency/pr-mth-bltn-inst.json',
		wrapAllowed: true,
        dataHandler: function(data){
            var $sheet = this;
            return _example_dataFormatter($sheet, data['data']['updateTime'], data['records']);
        }
    });

    $('#pr-mth-bltn-year').on('change', function(){
        jsonMonthSelect('pr-mth-bltn-month', jsonYearMonth, [$('#pr-mth-bltn-year').val(), $('#pr-mth-bltn-month').val()]);
        $('#title-pr-mth-bltn-date').text($('#pr-mth-bltn-year').val() + '-' + sanZeroFill($('#pr-mth-bltn-month').val()));
        prTimChange();
    });
    
    $('#pr-mth-bltn-month').on('change', function(){
        $('#title-pr-mth-bltn-date').text($('#pr-mth-bltn-year').val() + '-' + sanZeroFill($('#pr-mth-bltn-month').val()));
        prTimChange();
    });
	//备注
	san.tools.getJsonData({
		url: DURL+'note/note-2070.json',
		onDone: function(data){
			$('#notes-mth-zyshgyb').html(data.data.rmkCn);
			$('#tips-ibl-mth-zyshgyb').sanTooltips({
				type: 'html',
				selector: '#notes-mth-zyshgyb'
			});
		}
	});
	//备注
	notesSetup('#tips-ibl-mth-zyshgyb', 'notes-mth-zyshgyb', DURL+'note/note-2070.json');		
});

function prTimChange(){
	//$("#pr-mon-update-time").hide();
	prtvvo();	
	pritvo(); 
	prittvo();
}

function prtvvo(){
	var yearmonth = '';
	if($('#pr-mth-bltn-year').val()!=null && $('#pr-mth-bltn-year').val() != '' 
				&& $('#pr-mth-bltn-month').val()!=null && $('#pr-mth-bltn-month').val() != ''){
		yearmonth = $('#pr-mth-bltn-year').val() + '' + $('#pr-mth-bltn-month').val();
	}
	 $.ajax({
	 	type: "POST",
	   	url: MD_URL + 'cm-u-query-mlrp/PrMthBltn',	   	
	   	data:{
			lang : "cn",
			yearMonth : yearmonth,
			indexType:"tvvo"
		},
	   	dataType:'json'	
	 }).done(function(data){
			var dataInData = data['data'];
			var ym = dataInData['showYearMonth'];
	    	$('#title-pr-mth-bltn-date').text(data['data']['showYearMonth']);
	    	$('#pr-mth-bltn-tran').sanDatasheet({
				url:data,
				dataSource: 'local',
				wrapAllowed: true,
			    dataHandler: function(data){									    	
			        var $sheet = this;
			        $('#mon-pr-excel').attr("href",DQSURL+'cm-u-query-mlrp/PrMthBltnExcel?yearMonth='+dateConvertor(ym,'YYYY-MM','-','YYYYMM'));
			        return _example_dataFormatter($sheet, data['data']['updateTime'], data['records']);
			    },
			    onDone:function(){
		        },
			    onFail:function(){
		        }
			});
	  
	})
}

	var yearmonth = '';
	if($('#pr-mth-bltn-year').val()!=null && $('#pr-mth-bltn-year').val() != '' 
				&& $('#pr-mth-bltn-month').val()!=null && $('#pr-mth-bltn-month').val() != ''){
		yearmonth = $('#pr-mth-bltn-year').val() + '' + $('#pr-mth-bltn-month').val();
	}
	 $.ajax({
	 	type: "POST",
	   	url: MD_URL + 'cm-u-query-mlrp/PrMthBltn',

			lang : "cn",
			yearMonth : yearmonth,
			indexType:"itVOList"
		},
	   	dataType:'json'	
	 }).done(function(data){
	    	$('#title-pr-mth-bltn-date').text(data['data']['showYearMonth']);
	    	$('#pr-mth-bltn-bala').sanDatasheet({
				url:data,
				dataSource: 'local',
				wrapAllowed: true,
			    dataHandler: function(data){									    	
			        var $sheet = this;
			        return _example_dataFormatter($sheet, data['data']['updateTime'], data['records']);
			    },
			    onDone:function(){
		        },
			    onFail:function(){
		        }
			});
	   
	})
}

function prittvo(){
	var yearmonth = '';
	if($('#pr-mth-bltn-year').val()!=null && $('#pr-mth-bltn-year').val() != '' 
				&& $('#pr-mth-bltn-month').val()!=null && $('#pr-mth-bltn-month').val() != ''){
		yearmonth = $('#pr-mth-bltn-year').val() + '' + $('#pr-mth-bltn-month').val();
	}
	 $.ajax({
	 	type: "POST",
	   	url: MD_URL + 'cm-u-query-mlrp/PrMthBltn',	   	
	   	data:{
			lang : "cn",

			indexType:"pitvo"
		},
	   	dataType:'json'	
	 }).done(function(data){
	    	$('#title-pr-mth-bltn-date').text(data['data']['showYearMonth']);
	    	$('#pr-mth-bltn-inst').sanDatasheet({
				url:data,
				dataSource: 'local',
				wrapAllowed: true,
			    dataHandler: function(data){									    	
			        var $sheet = this;
			        return _example_dataFormatter($sheet, data['data']['updateTime'], data['records']);
			    },
			    onDone:function(){
		        },
			    onFail:function(){
		        }
			});

}

	selector: '#mtmoncjglzyshgt-dl'
});


</script>

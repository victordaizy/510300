addopts =
    --deselect=tests/test_510300_direction_switch_v1.py::test_frozen_protocol_and_manifest
    --deselect=tests/test_510300_pit_earnings_information_diffusion_10d_risk_v1.py::test_manifest_hashes_match_if_manifest_exists
